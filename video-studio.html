<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profesyonel Video Stüdyosu | AGENT-GELISTIRME</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #111827; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { margin: 0; font-family: 'Playfair Display', serif; font-size: 32px; color: #FDF2F8; }
        .header p { color: #9CA3AF; font-size: 14px; margin-top: 5px; }
        
        .studio-container { width: 100%; max-width: 800px; background: #1F2937; border-radius: 20px; padding: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid #374151; }
        
        .prompt-area { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
        .prompt-area label { font-size: 14px; font-weight: 600; color: #F3F4F6; }
        .prompt-area textarea { width: 100%; height: 80px; background: #111827; border: 1px solid #374151; border-radius: 10px; padding: 14px; color: #F3F4F6; font-family: 'Inter', sans-serif; resize: none; outline: none; transition: border 0.3s; }
        .prompt-area textarea:focus { border-color: #F472B6; }
        
        .action-row { display: flex; gap: 10px; }
        .action-row button { flex: 1; background: linear-gradient(135deg, #F472B6, #A78BFA); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .action-row button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(244,114,182,0.3); }
        .action-row button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .canvas-area { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; position: relative; display: flex; justify-content: center; align-items: center; margin-bottom: 20px; border: 2px solid #374151; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
        canvas { width: 100%; height: 100%; display: none; }
        
        .status { text-align: center; font-size: 14px; color: #9CA3AF; margin-bottom: 15px; font-weight: 600; }
        .status.recording { color: #F87171; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .download-area { display: none; text-align: center; margin-top: 10px; }
        .download-area a { display: inline-block; background: #10B981; color: white; padding: 14px 28px; text-decoration: none; border-radius: 10px; font-weight: 600; transition: background 0.2s; }
        .download-area a:hover { background: #059669; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Luxe Studio</h1>
        <p>Yapay zeka destekli, profesyonel pastel video üretici.</p>
    </div>

    <div class="studio-container">
        <div class="prompt-area">
            <label for="videoPrompt">Videonuzun konseptini yazın:</label>
            <textarea id="videoPrompt" placeholder="Örnek: Yumuşak pastel renklerde, doğal ve lüks bir makyaj tanıtımı. Zarif, dinlendirici ve göz alıcı olsun."></textarea>
            <div class="action-row">
                <button id="generateBtn" onclick="generateVideo()">✨ Profesyonel Videoyu Üret</button>
            </div>
        </div>

        <div class="canvas-area" id="canvasContainer">
            <span style="color: #6B7280; font-weight: 300;">Önizleme Alanı</span>
            <canvas id="videoCanvas" width="1280" height="720"></canvas>
        </div>

        <div class="status" id="statusText"></div>

        <div class="download-area" id="downloadArea">
            <a id="downloadLink" download="luxe_video.webm">📥 Videoyu İndir (.webm)</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('statusText');
        const downloadArea = document.getElementById('downloadArea');
        const downloadLink = document.getElementById('downloadLink');
        const generateBtn = document.getElementById('generateBtn');
        const canvasContainer = document.getElementById('canvasContainer');

        let mediaRecorder;
        let recordedChunks = [];
        let animationId;

        // Gelişmiş Prompt Analizi ve Pastel Paletler
        function getPromptSettings(prompt) {
            const p = prompt.toLowerCase();
            
            // 1. MAKYAJ / GÜZELLİK (Pastel Pembe, Lila, Şeftali)
            if (p.includes('makyaj') || p.includes('güzellik') || p.includes('cilt') || p.includes('ruj') || p.includes('lüks')) {
                return { 
                    colors: ['#FDE68A', '#FBCFE8', '#E9D5FF', '#FDF2F8'], // Pastel sarı, pembe, lila
                    text: "LUXE BEAUTY",
                    subtext: "DOĞAL IŞILTI",
                    particleColor: 'rgba(255,255,255,0.6)',
                    font: "600 70px 'Playfair Display', serif"
                };
            }
            // 2. DOĞA / DİNLENDİRİCİ (Pastel Yeşil, Mavi, Mint)
            if (p.includes('doğa') || p.includes('orman') || p.includes('deniz') || p.includes('dinlendirici')) {
                return { 
                    colors: ['#A7F3D0', '#BAE6FD', '#ECFCCB', '#E0F2FE'], 
                    text: "PURE NATURE",
                    subtext: "DOĞANIN GÜCÜ",
                    particleColor: 'rgba(255,255,255,0.4)',
                    font: "600 70px 'Playfair Display', serif"
                };
            }
            // 3. TEKNOLOJİ / GELECEK (Pastel Mavi, Gri, Beyaz)
            if (p.includes('teknoloji') || p.includes('yazılım') || p.includes('gelecek') || p.includes('bilim')) {
                return { 
                    colors: ['#E0E7FF', '#C7D2FE', '#BFDBFE', '#F3F4F6'], 
                    text: "FUTURE TECH",
                    subtext: "YENİ NESİL",
                    particleColor: 'rgba(255,255,255,0.7)',
                    font: "600 70px 'Inter', sans-serif"
                };
            }
            // Varsayılan (Yumuşak Pastel Tonlar)
            return { 
                colors: ['#FDE68A', '#FBCFE8', '#E9D5FF', '#FDF2F8'],
                text: "PREMIUM",
                subtext: "LUXE COLLECTION",
                particleColor: 'rgba(255,255,255,0.5)',
                font: "600 70px 'Playfair Display', serif"
            };
        }

        async function generateVideo() {
            const prompt = document.getElementById('videoPrompt').value || "Yumuşak pastel renklerde lüks bir sunum.";
            const settings = getPromptSettings(prompt);
            
            generateBtn.disabled = true;
            downloadArea.style.display = 'none';
            canvas.style.display = 'block';
            canvasContainer.querySelector('span').style.display = 'none';
            statusText.innerText = "🎬 Profesyonel video render ediliyor...";
            statusText.className = "status recording";
            recordedChunks = [];

            const stream = canvas.captureStream(60); // 60 FPS akıcılık
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
            
            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) recordedChunks.push(event.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                downloadLink.href = url;
                downloadArea.style.display = 'block';
                statusText.innerText = "✅ Video Hazır! Hemen İndirin.";
                statusText.className = "status";
                generateBtn.disabled = false;
                cancelAnimationFrame(animationId);
            };

            mediaRecorder.start();

            let startTime = Date.now();
            const duration = 6000; // 6 Saniyelik profesyonel klip
            let particles = [];

            // Zarif Parçacıklar (Işıltılar) Oluştur
            for (let i = 0; i < 150; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 4 + 0.5, // Küçük ve zarif
                    speedX: (Math.random() - 0.5) * 1.5, // Yavaş süzülme
                    speedY: (Math.random() - 0.5) * 1.5 - 0.5, // Hafif yukarı
                    alpha: Math.random() * 0.5 + 0.1
                });
            }

            function drawFrame() {
                const time = Date.now() - startTime;
                
                // 1. HAREKETLİ PASTEL ARKA PLAN (Animasyonlu Gradient)
                // Renklerin açısını ve pozisyonunu zamanla değiştiriyoruz
                const gradient = ctx.createLinearGradient(
                    canvas.width/2 + Math.sin(time/1000) * 500, 
                    0, 
                    canvas.width/2 - Math.sin(time/1000) * 500, 
                    canvas.height
                );
                
                // Renk duraklarını (color stops) zamanla kaydırarak akış efekti veriyoruz
                const offset = Math.sin(time / 2000) * 0.2;
                gradient.addColorStop(Math.max(0, 0 + offset), settings.colors[0]);
                gradient.addColorStop(Math.min(1, 0.33 + offset), settings.colors[1]);
                gradient.addColorStop(Math.min(1, 0.66 + offset), settings.colors[2]);
                gradient.addColorStop(1, settings.colors[3]);

                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // 2. IŞILTILARI ÇİZ (Bokeh Efekti)
                particles.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = settings.particleColor;
                    ctx.globalAlpha = p.alpha * (0.5 + Math.sin(time/500 + p.x) * 0.5); // Göz kırpma efekti
                    ctx.shadowColor = "white";
                    ctx.shadowBlur = 10;
                    ctx.fill();
                    
                    // Süzülme hareketi
                    p.x += p.speedX;
                    p.y += p.speedY;

                    // Ekran sınırlarından çıkınca geri döndür
                    if (p.x < 0) p.x = canvas.width;
                    if (p.x > canvas.width) p.x = 0;
                    if (p.y < 0) p.y = canvas.height;
                    if (p.y > canvas.height) p.y = 0;
                });
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;

                // 3. PROFESYONEL METİN ANİMASYONU
                const textOpacity = Math.min(1, time / 1000); // 1 saniyede belir
                const textScale = 1 + Math.sin(time / 2000) * 0.02; // Çok hafif nefes alma efekti
                
                ctx.save();
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.scale(textScale, textScale);
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.globalAlpha = textOpacity;

                // Gölge ve Işıma (Glow)
                ctx.shadowColor = "rgba(0,0,0,0.2)"; // Hafif koyu gölge pastel üzerinde okunabilirlik sağlar
                ctx.shadowBlur = 15;
                ctx.shadowOffsetY = 5;

                // Ana Başlık
                ctx.fillStyle = "#4C1D95"; // Koyu mor (Pastel arka plan üzerinde şık durur)
                ctx.font = settings.font;
                ctx.fillText(settings.text, 0, -20);

                // Alt Başlık
                ctx.shadowBlur = 5;
                ctx.fillStyle = "#831843"; // Koyu pembe
                ctx.font = "600 24px 'Inter', sans-serif";
                // Harfler arası boşluk efekti için
                ctx.letterSpacing = "10px"; 
                ctx.fillText(settings.subtext, 0, 50);
                
                ctx.restore();

                // Zaman kontrolü
                if (time >= duration) {
                    mediaRecorder.stop();
                } else {
                    animationId = requestAnimationFrame(drawFrame);
                }
            }

            drawFrame();
        }
    </script>
</body>
</html>
