<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Reklam Stüdyosu | AGENT-GELISTIRME</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@300;600&family=Inter:wght@400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0F172A; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { margin: 0; font-family: 'Playfair Display', serif; font-size: 32px; background: linear-gradient(90deg, #38BDF8, #A78BFA); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { color: #94A3B8; font-size: 13px; margin-top: 5px; }
        
        .studio-container { width: 100%; max-width: 800px; background: #1E293B; border-radius: 20px; padding: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid #334155; }
        
        .prompt-area { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .prompt-area label { font-size: 14px; font-weight: 600; color: #E2E8F0; }
        .prompt-area textarea { width: 100%; height: 80px; background: #0F172A; border: 1px solid #334155; border-radius: 10px; padding: 14px; color: white; font-family: 'Inter', sans-serif; resize: none; outline: none; transition: border 0.3s; }
        .prompt-area textarea:focus { border-color: #38BDF8; }
        
        .action-row { display: flex; gap: 10px; }
        .action-row button { flex: 1; background: linear-gradient(135deg, #38BDF8, #818CF8); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .action-row button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(56,189,248,0.3); }
        .action-row button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; background: #475569; }

        .canvas-area { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; position: relative; display: flex; justify-content: center; align-items: center; margin-bottom: 15px; border: 2px solid #334155; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
        canvas { width: 100%; height: 100%; display: none; }
        
        .status { text-align: center; font-size: 13px; color: #94A3B8; margin-bottom: 10px; font-weight: 600; }
        .status.recording { color: #F87171; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .download-area { display: none; text-align: center; margin-top: 10px; }
        .download-area a { display: inline-block; background: #10B981; color: white; padding: 12px 24px; text-decoration: none; border-radius: 10px; font-weight: 600; transition: background 0.2s; }
        .download-area a:hover { background: #059669; }
    </style>
</head>
<body>

    <div class="header">
        <h1>AI Reklam Stüdyosu</h1>
        <p>Yapay zeka sizin için renkleri, yazıları ve temayı tasarlar.</p>
    </div>

    <div class="studio-container">
        <div class="prompt-area">
            <label for="videoPrompt">Nasıl bir reklam filmi istiyorsunuz?</label>
            <textarea id="videoPrompt" placeholder="Örnek: Karanlık temalı, altın sarısı detaylara sahip lüks bir saat reklamı."></textarea>
            <div class="action-row">
                <button id="generateBtn" onclick="generateVideo()" disabled>Yapay Zeka Yükleniyor...</button>
            </div>
        </div>

        <div class="canvas-area" id="canvasContainer">
            <span style="color: #64748B; font-weight: 300;">Yapay Zeka Hazır Olduğunda Burada Video Oluşacak</span>
            <canvas id="videoCanvas" width="1280" height="720"></canvas>
        </div>

        <div class="status" id="statusText">Model indiriliyor, lütfen bekleyin (İlk açılışta 1-2 dk sürebilir)...</div>

        <div class="download-area" id="downloadArea">
            <a id="downloadLink" download="ai_reklam_filmi.webm">📥 Reklam Filmini İndir (.webm)</a>
        </div>
    </div>

    <script type="module">
        import * as webllm from "https://esm.run/@mlc-ai/web-llm";

        let engine = null;
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('statusText');
        const generateBtn = document.getElementById('generateBtn');
        const downloadArea = document.getElementById('downloadArea');
        const downloadLink = document.getElementById('downloadLink');
        const canvasContainer = document.getElementById('canvasContainer');

        let mediaRecorder;
        let recordedChunks = [];
        let animationId;

        // YAPAY ZEKAYI BAŞLAT
        async function initAI() {
            try {
                const selectedModel = "Llama-3.2-1B-Instruct-q4f32_1-MLC";
                engine = await webllm.CreateMLCEngine(selectedModel, {
                    initProgressCallback: (progress) => {
                        statusText.innerText = progress.text;
                    }
                });
                statusText.innerText = "✅ Yapay Zeka Hazır! Prompt yazıp videoyu üretebilirsiniz.";
                statusText.style.color = "#10B981";
                generateBtn.disabled = false;
                generateBtn.innerText = "✨ Yapay Zeka ile Reklam Filmi Üret";
            } catch (e) {
                statusText.innerText = "⚠️ Model yüklenemedi: " + e.message;
                statusText.style.color = "#EF4444";
            }
        }
        initAI();

        // KIRILMAZ JSON AYRIŞTIRICI
        function extractJSON(text) {
            try {
                // Bazen AI ```json ... ``` şeklinde çıktı verebilir, onları temizle
                let cleanText = text.replace(/```json/gi, '').replace(/```/g, '').trim();
                const match = cleanText.match(/\{[\s\S]*\}/);
                
                if (match) {
                    let jsonStr = match[0];
                    try {
                        return JSON.parse(jsonStr);
                    } catch (e) {
                        // Eğer JSON'da tek tırnak veya sonda virgül kaldıysa düzelt
                        let fixedJson = jsonStr.replace(/'/g, '"').replace(/,\s*}/g, '}');
                        return JSON.parse(fixedJson);
                    }
                }
            } catch (err) {
                console.warn("JSON parse hatası, yedek plana geçiliyor.");
            }
            return null;
        }

        // YEDEK PLAN (Eğer AI saçmalarsa, bu devreye girer ve videoyu yine de yapar)
        function getFallbackDesign(prompt) {
            const p = prompt.toLowerCase();
            if (p.includes('makyaj') || p.includes('güzellik') || p.includes('lüks') || p.includes('altın')) {
                return { title: "LUXE", subtitle: "GOLD COLLECTION", colors: ["#1A0B1A", "#4C1D95", "#831843"], textColor: "#FDF2F8", particleColor: "rgba(251,207,232,0.6)", fontStyle: "serif" };
            }
            if (p.includes('teknoloji') || p.includes('araba') || p.includes('neon') || p.includes('gelecek')) {
                return { title: "FUTURE", subtitle: "TECHNOLOGY", colors: ["#020617", "#1E3A8A", "#06B6D4"], textColor: "#38BDF8", particleColor: "rgba(56,189,248,0.6)", fontStyle: "sans-serif" };
            }
            if (p.includes('doğa') || p.includes('kahve') || p.includes('organik')) {
                return { title: "PURE", subtitle: "ORGANIC", colors: ["#064E3B", "#10B981", "#34D399"], textColor: "#ECFDF5", particleColor: "rgba(167,243,208,0.6)", fontStyle: "serif" };
            }
            // Hiçbirine uymazsa varsayılan şık tasarım
            return { title: "PREMIUM", subtitle: "DESIGN", colors: ["#111827", "#374151", "#1F2937"], textColor: "#F3F4F6", particleColor: "rgba(255,255,255,0.3)", fontStyle: "sans-serif" };
        }

        // YAPAY ZEKADAN TASARIM İSTEME
        async function getVideoDesignFromAI(prompt) {
            const messages = [
                { 
                    role: "system", 
                    content: `You are a JSON API. Output ONLY a valid JSON object. Do NOT use markdown blocks. Do NOT write explanations.
                    Format: {"title": "SHORT TITLE", "subtitle": "SHORT SUBTITLE", "colors": ["#hex1", "#hex2", "#hex3"], "textColor": "#hex", "particleColor": "rgba(255,255,255,0.5)", "fontStyle": "serif"}
                    Analyze the user prompt and generate the design.` 
                },
                { 
                    role: "user", 
                    content: `Design for: "${prompt}"` 
                }
            ];

            try {
                const reply = await engine.chat.completions.create({ 
                    messages: messages,
                    temperature: 0.1, 
                    max_tokens: 150
                });

                let parsedDesign = extractJSON(reply.choices[0].message.content);
                
                if (parsedDesign && parsedDesign.title && parsedDesign.colors) {
                    return parsedDesign;
                }
            } catch (e) {
                console.warn("AI üretim hatası:", e);
            }
            
            // Eğer AI başarısız olursa yedek planı kullan
            return getFallbackDesign(prompt);
        }

        // VİDEO ÜRETİM FONKSİYONU
        window.generateVideo = async function() {
            const prompt = document.getElementById('videoPrompt').value.trim();
            if (!prompt) {
                alert("Lütfen bir reklam senaryosu yazın!");
                return;
            }
            
            generateBtn.disabled = true;
            downloadArea.style.display = 'none';
            statusText.innerText = "🧠 Yapay Zeka tasarımı oluşturuyor...";
            statusText.className = "status recording";

            try {
                const design = await getVideoDesignFromAI(prompt);
                statusText.innerText = "🎬 Video render ediliyor...";

                canvas.style.display = 'block';
                canvasContainer.querySelector('span').style.display = 'none';
                recordedChunks = [];

                const stream = canvas.captureStream(60);
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) recordedChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    downloadLink.href = url;
                    downloadArea.style.display = 'block';
                    statusText.innerText = "✅ Reklam Filmi Hazır! Hemen İndirin.";
                    statusText.className = "status";
                    statusText.style.color = "#10B981";
                    generateBtn.disabled = false;
                    generateBtn.innerText = "✨ Yapay Zeka ile Reklam Filmi Üret";
                    cancelAnimationFrame(animationId);
                };

                mediaRecorder.start();

                let startTime = Date.now();
                const duration = 6000;
                let particles = [];

                for (let i = 0; i < 100; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        radius: Math.random() * 3 + 0.5,
                        speedX: (Math.random() - 0.5) * 1.5,
                        speedY: (Math.random() - 0.5) * 1.5 - 0.5,
                        alpha: Math.random() * 0.5 + 0.1
                    });
                }

                function drawFrame() {
                    const time = Date.now() - startTime;
                    
                    const gradient = ctx.createLinearGradient(
                        canvas.width/2 + Math.sin(time/1000) * 500, 
                        0, 
                        canvas.width/2 - Math.sin(time/1000) * 500, 
                        canvas.height
                    );
                    
                    const offset = Math.sin(time / 2000) * 0.2;
                    gradient.addColorStop(Math.max(0, 0 + offset), design.colors[0] || "#1E293B");
                    gradient.addColorStop(Math.min(1, 0.5 + offset), design.colors[1] || "#0F172A");
                    gradient.addColorStop(1, design.colors[2] || "#000000");

                    ctx.fillStyle = gradient;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    particles.forEach(p => {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        ctx.fillStyle = design.particleColor || 'rgba(255,255,255,0.5)';
                        ctx.globalAlpha = p.alpha * (0.5 + Math.sin(time/500 + p.x) * 0.5);
                        ctx.shadowColor = "white";
                        ctx.shadowBlur = 10;
                        ctx.fill();
                        
                        p.x += p.speedX;
                        p.y += p.speedY;

                        if (p.x < 0) p.x = canvas.width;
                        if (p.x > canvas.width) p.x = 0;
                        if (p.y < 0) p.y = canvas.height;
                        if (p.y > canvas.height) p.y = 0;
                    });
                    ctx.globalAlpha = 1;
                    ctx.shadowBlur = 0;

                    const textOpacity = Math.min(1, time / 1000);
                    const textScale = 1 + Math.sin(time / 2000) * 0.03;
                    
                    ctx.save();
                    ctx.translate(canvas.width / 2, canvas.height / 2);
                    ctx.scale(textScale, textScale);
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.globalAlpha = textOpacity;

                    ctx.shadowColor = "rgba(0,0,0,0.6)";
                    ctx.shadowBlur = 15;
                    ctx.shadowOffsetY = 5;

                    ctx.fillStyle = design.textColor || "#FFFFFF";
                    const fontStyle = design.fontStyle === 'serif' ? "'Playfair Display', serif" : "'Montserrat', sans-serif";
                    ctx.font = `600 80px ${fontStyle}`;
                    ctx.fillText(design.title || "REKLAM", 0, -30);

                    ctx.shadowBlur = 5;
                    ctx.font = "300 28px 'Montserrat', sans-serif";
                    ctx.fillText(design.subtitle || "SİZİN İÇİN", 0, 50);
                    
                    ctx.restore();

                    if (time >= duration) {
                        mediaRecorder.stop();
                    } else {
                        animationId = requestAnimationFrame(drawFrame);
                    }
                }

                drawFrame();

            } catch (error) {
                statusText.innerText = "⚠️ Hata: " + error.message;
                statusText.style.color = "#EF4444";
                generateBtn.disabled = false;
                generateBtn.innerText = "✨ Yapay Zeka ile Reklam Filmi Üret";
            }
        };
    </script>
</body>
</html>
