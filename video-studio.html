<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otonom Sinema Stüdyosu | AGENT-GELISTIRME</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Montserrat:wght@400;600;800&family=Caveat:wght@700&family=Cinzel:wght@700&family=Inter:wght@400&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background: #0B1120; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { margin: 0; font-family: 'Playfair Display', serif; font-size: 34px; background: linear-gradient(90deg, #38BDF8, #A78BFA, #F472B6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .studio-container { width: 100%; max-width: 1000px; background: #1E293B; border-radius: 20px; padding: 24px; box-shadow: 0 25px 60px rgba(0,0,0,0.6); border: 1px solid #334155; }
        
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-group label { font-size: 13px; font-weight: 600; color: #E2E8F0; }
        .input-group input, .input-group textarea { width: 100%; background: #0F172A; border: 1px solid #334155; border-radius: 8px; padding: 12px; color: white; font-family: 'Inter', sans-serif; outline: none; box-sizing: border-box; }
        .input-group textarea { height: 70px; resize: none; }
        .input-group input:focus, .input-group textarea:focus { border-color: #38BDF8; }

        .controls-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px; }
        .control-box { background: #0F172A; padding: 10px; border-radius: 10px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 6px; }
        .control-box label { font-size: 10px; color: #94A3B8; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .control-box select { background: #1E293B; color: #E2E8F0; border: 1px solid #334155; padding: 8px; border-radius: 6px; outline: none; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 12px; width: 100%; }
        .control-box select:focus { border-color: #A78BFA; }
        
        .color-picker-row { display: flex; gap: 10px; align-items: center; justify-content: space-around; padding-top: 5px; }
        .color-picker-group { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .color-picker-group span { font-size: 10px; color: #94A3B8; }
        .color-picker-group input[type="color"] { -webkit-appearance: none; border: none; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; padding: 0; background: none; }
        .color-picker-group input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        .color-picker-group input[type="color"]::-webkit-color-swatch { border: 2px solid #475569; border-radius: 50%; }

        .upload-area { display: flex; flex-direction: column; gap: 10px; background: #0F172A; padding: 15px; border-radius: 10px; border: 1px dashed #475569; margin-bottom: 15px; }
        .upload-area input { color: #94A3B8; font-size: 13px; cursor: pointer; }
        .preview-container { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 5px; }
        .preview-container img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; border: 2px solid #334155; }
        .upload-status { font-size: 12px; color: #10B981; font-weight: 600; display: none; }
        
        .action-row { display: flex; gap: 10px; margin-top: 15px; }
        .action-row button { flex: 1; background: linear-gradient(135deg, #38BDF8, #818CF8, #F472B6); background-size: 200% 200%; color: white; border: none; padding: 16px; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s; animation: gradientBG 3s infinite; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .action-row button:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(56,189,248,0.4); }
        .action-row button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; animation: none; background: #475569; }

        .canvas-area { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; position: relative; display: flex; justify-content: center; align-items: center; margin-bottom: 15px; margin-top: 20px; border: 2px solid #334155; }
        canvas { width: 100%; height: 100%; display: none; }
        
        .status { text-align: center; font-size: 13px; color: #94A3B8; margin-bottom: 10px; font-weight: 600; }
        .status.recording { color: #F87171; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .download-area { display: none; text-align: center; margin-top: 10px; }
        .download-area a { display: inline-block; background: #10B981; color: white; padding: 14px 28px; text-decoration: none; border-radius: 10px; font-weight: 700; font-size: 15px; }
        
        @media (max-width: 800px) { .controls-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 500px) { .controls-grid, .input-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="header">
        <h1>Otonom Sinema Stüdyosu</h1>
        <p>Yapay Zeka senaryoyu okur, menüleri ve efektleri kendi seçer.</p>
    </div>

    <div class="studio-container">
        
        <div class="input-group" style="margin-bottom: 12px;">
            <label for="videoPrompt">Senaryo (Yapay Zeka her şeyi buna göre seçecek):</label>
            <textarea id="videoPrompt" placeholder="Örnek: Kırmızı ruj reklamı, ateşli ve tutkulu. Veya: Uzayda uçan fütüristik bir roket."></textarea>
        </div>

        <div class="input-row">
            <div class="input-group">
                <label for="manualTitle">Reklam Başlığı (İsteğe Bağlı)</label>
                <input type="text" id="manualTitle" placeholder="Örn: LUXE BEAUTY">
            </div>
            <div class="input-group">
                <label for="manualSlogan">Slogan (İsteğe Bağlı)</label>
                <input type="text" id="manualSlogan" placeholder="Örn: YENİ KOLEKSİYON">
            </div>
        </div>

        <div class="controls-grid">
            <!-- RENK -->
            <div class="control-box">
                <label>🎨 Renk Teması</label>
                <select id="colorPalette">
                    <option value="auto" selected>✨ Yapay Zeka Karar Versin</option>
                    <option value="luxury">Altın & Lüks</option>
                    <option value="cyberpunk">Cyberpunk (Neon)</option>
                    <option value="pastel">Pastel Rüya</option>
                    <option value="sunset">Gün Batımı</option>
                    <option value="matrix">Matrix</option>
                    <option value="custom">Özel Arka Plan Rengi</option>
                </select>
                <div class="color-picker-row" id="customColorContainer" style="display: none;">
                    <div class="color-picker-group"><input type="color" id="color1" value="#FF007F"><span>Arka 1</span></div>
                    <div class="color-picker-group"><input type="color" id="color2" value="#00F0FF"><span>Arka 2</span></div>
                </div>
                <div class="color-picker-row" style="margin-top: 5px; border-top: 1px solid #334155; padding-top: 5px;">
                    <div class="color-picker-group"><input type="color" id="textColorPicker" value="#FFFFFF"><span style="font-weight: 600; color: #E2E8F0;">Yazı Rengi</span></div>
                </div>
            </div>

            <!-- ARKA PLAN -->
            <div class="control-box">
                <label>🌌 Arka Plan</label>
                <select id="bgAnimation">
                    <option value="auto" selected>✨ Yapay Zeka Karar Versin</option>
                    <option value="aurora">Aurora</option>
                    <option value="galaxy">Galaksi</option>
                    <option value="cyber">Cyberpunk Izgara</option>
                    <option value="matrix">Matrix</option>
                    <option value="waves">Sinematik Dalgalar</option>
                    <option value="tunnel">Sonsuzluk Tüneli</option>
                    <option value="bokeh">Bokeh</option>
                    <option value="gradient">Sıvı Geçiş</option>
                </select>
                <label style="margin-top: 4px;">✨ Parçacık Efekti</label>
                <select id="particleEffect">
                    <option value="auto" selected>✨ Yapay Zeka Karar Versin</option>
                    <option value="golden_dust">Altın Tozu</option>
                    <option value="none">Parçacık Yok</option>
                    <option value="snow">Kar Yağışı</option>
                    <option value="confetti">Konfeti</option>
                    <option value="fireflies">Ateş Böcekleri</option>
                </select>
            </div>

            <!-- GÖRSEL STİLİ VE HAREKETİ -->
            <div class="control-box">
                <label>🖼️ Görsel Stili</label>
                <select id="imageStyle">
                    <option value="auto" selected>✨ Yapay Zeka Karar Versin</option>
                    <option value="glass">Cam Efekti</option>
                    <option value="normal">Normal</option>
                    <option value="circle">Tam Yuvarlak</option>
                    <option value="polaroid">Polaroid</option>
                    <option value="neon_border">Neon Çerçeve</option>
                    <option value="shadow">Derin Gölge</option>
                </select>
                <label style="margin-top: 4px;">🎞️ Görsel Hareketi</label>
                <select id="imageAnimType">
                    <option value="auto" selected>✨ Yapay Zeka Karar Versin</option>
                    <option value="float">Süzülme</option>
                    <option value="pulse">Nefes Alma</option>
                    <option value="rotate">Hafif Dönme</option>
                    <option value="zoom_in">Yavaşça Yaklaşma</option>
                    <option value="swing">Sallanma</option>
                    <option value="slide_side">Yanlardan Giriş</option>
                    <option value="3d_tilt">3D Eğilme</option>
                </select>
            </div>

            <!-- YAZI ANİMASYONU VE STİLİ -->
            <div class="control-box">
                <label>🔠 Yazı Stili (Font)</label>
                <select id="textStyle">
                    <option value="auto" selected>✨ Yapay Zeka Karar Versin</option>
                    <option value="modern">Modern (Montserrat)</option>
                    <option value="classic">Klasik (Playfair)</option>
                    <option value="elegant">Lüks (Cinzel)</option>
                    <option value="impact">Vurucu (Impact)</option>
                    <option value="handwriting">El Yazısı (Caveat)</option>
                    <option value="mono">Teknik (Courier)</option>
                </select>
                <label style="margin-top: 4px;">🎬 Yazı Animasyonu</label>
                <select id="textAnimation">
                    <option value="auto" selected>✨ Yapay Zeka Karar Versin</option>
                    <option value="typewriter">Daktilo</option>
                    <option value="slide_in">Yandan Kayma</option>
                    <option value="neon_pulse">Neon Nabız</option>
                    <option value="bounce">Zıplayan</option>
                    <option value="color_cycle">Renk Değiştiren</option>
                    <option value="fade_up">Aşağıdan Süzülme</option>
                    <option value="zoom_in">İçeri Büyüme</option>
                    <option value="shake">Titreşim</option>
                    <option value="split">Ortadan Ayrılma</option>
                </select>
            </div>
        </div>

        <div class="controls-grid" style="grid-template-columns: 1fr;">
            <!-- SİNEMATİK EFEKTLER -->
            <div class="control-box">
                <label>🎥 Sinematik Görüntü Efektleri (Overlay)</label>
                <select id="visualEffect">
                    <option value="auto" selected>✨ Yapay Zeka Karar Versin</option>
                    <option value="none">Efekt Yok (Sade)</option>
                    <option value="bloom">Bloom (Işıma)</option>
                    <option value="glitch">Glitch (Teknoloji)</option>
                    <option value="vignette">Vignette (Karartma)</option>
                    <option value="grain">Film Greni</option>
                    <option value="scanlines">CRT Çizgileri</option>
                    <option value="chromatic">Kromatik (3D)</option>
                    <option value="lightleak">Işık Sızması</option>
                    <option value="retro">Retro / Sepya</option>
                </select>
            </div>
        </div>

        <div class="upload-area">
            <label style="font-size: 13px; font-weight: 600; color: #E2E8F0;">Kendi Ürününüz (Boş bırakırsanız prompttaki nesneyi emoji olarak çizer):</label>
            <input type="file" id="imageUpload" accept="image/*" multiple>
            <div class="upload-status" id="uploadStatus">✅ Görseller Yüklendi</div>
            <div class="preview-container" id="previewContainer"></div>
        </div>

        <div class="action-row">
            <button id="generateBtn" onclick="generateVideo()" disabled>Yapay Zeka Yükleniyor...</button>
        </div>

        <div class="canvas-area" id="canvasContainer">
            <span style="color: #64748B; font-weight: 300;">Reklamınız Burada Oluşacak</span>
            <canvas id="videoCanvas" width="1280" height="720"></canvas>
        </div>

        <div class="status" id="statusText">Model indiriliyor, lütfen bekleyin...</div>

        <div class="download-area" id="downloadArea">
            <a id="downloadLink" download="pro_reklam.webm">📥 Reklam Filmini İndir (.webm)</a>
        </div>
    </div>

    <script type="module">
        import * as webllm from "https://esm.run/@mlc-ai/web-llm";

        let engine = null;
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('statusText');
        const generateBtn = document.getElementById('generateBtn');
        const downloadArea = document.getElementById('downloadArea');
        const downloadLink = document.getElementById('downloadLink');
        const canvasContainer = document.getElementById('canvasContainer');
        
        const imageUpload = document.getElementById('imageUpload');
        const uploadStatus = document.getElementById('uploadStatus');
        const previewContainer = document.getElementById('previewContainer');
        
        const colorPalette = document.getElementById('colorPalette');
        const customColorContainer = document.getElementById('customColorContainer');
        const color1 = document.getElementById('color1');
        const color2 = document.getElementById('color2');
        const textColorPicker = document.getElementById('textColorPicker');
        
        const bgAnimation = document.getElementById('bgAnimation');
        const particleEffect = document.getElementById('particleEffect');
        const imageStyle = document.getElementById('imageStyle');
        const imageAnimType = document.getElementById('imageAnimType');
        const textStyle = document.getElementById('textStyle');
        const textAnimation = document.getElementById('textAnimation');
        const visualEffect = document.getElementById('visualEffect');
        const manualTitle = document.getElementById('manualTitle');
        const manualSlogan = document.getElementById('manualSlogan');

        let mediaRecorder;
        let recordedChunks = [];
        let animationId;
        let uploadedImages = []; 

        colorPalette.addEventListener('change', () => {
            customColorContainer.style.display = colorPalette.value === 'custom' ? 'flex' : 'none';
        });

        imageUpload.addEventListener('change', async function(e) {
            const files = Array.from(e.target.files);
            uploadedImages = [];
            previewContainer.innerHTML = '';
            if (files.length === 0) return;

            uploadStatus.style.display = 'block';
            uploadStatus.innerText = `⏳ Yükleniyor (${files.length} resim)...`;

            const loadPromises = files.map(file => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            const thumb = document.createElement('img');
                            thumb.src = event.target.result;
                            previewContainer.appendChild(thumb);
                            resolve(img);
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            });

            uploadedImages = await Promise.all(loadPromises);
            uploadStatus.innerText = `✅ ${uploadedImages.length} Görsel Yüklendi`;
        });

        async function initAI() {
            try {
                const selectedModel = "Llama-3.2-1B-Instruct-q4f32_1-MLC";
                engine = await webllm.CreateMLCEngine(selectedModel, {
                    initProgressCallback: (progress) => { statusText.innerText = progress.text; }
                });
                statusText.innerText = "✅ Sistem Hazır!";
                statusText.style.color = "#10B981";
                generateBtn.disabled = false;
                generateBtn.innerText = "✨ Otonom Reklamı Üret";
            } catch (e) {
                statusText.innerText = "⚠️ Model hatası: " + e.message;
            }
        }
        initAI();

        function extractJSON(text) {
            try {
                let clean = text.replace(/```json/gi, '').replace(/```/g, '').replace(/\/\/.*$/gm, '').trim();
                const match = clean.match(/\{[\s\S]*\}/);
                if (match) return JSON.parse(match[0].replace(/'/g, '"').replace(/,\s*}/g, '}'));
            } catch (err) {}
            return null;
        }

        // --- YEREL AKILLI YEDEK PLAN ---
        // Eğer Yapay Zeka yavaş kalırsa veya hata verirse, bu devreye girer.
        function getLocalPromptDesign(prompt) {
            const p = prompt.toLowerCase();
            
            // Varsayılan değerler
            let design = {
                emoji: "", colors: ["#111827", "#374151", "#1F2937"], textColor: "#FFFFFF",
                bgAnimation: "gradient", particleEffect: "none", imageStyle: "glass", 
                imageAnimType: "float", textStyle: "modern", textAnimation: "fade_up", visualEffect: "none"
            };

            // Emoji Tanıma
            const emojiMap = {
                'ruj': '💄', 'parfüm': '🧴', 'koku': '🧴', 'ağaç': '🌳', 'kalem': '✏️', 
                'araba': '🚗', 'saat': '⌚', 'kahve': '☕', 'çiçek': '🌸', 'kitap': '📚', 
                'telefon': '📱', 'gözlük': '🕶️', 'ayakkabı': '👠', 'yiyecek': '🍔', 'müzik': '🎵', 
                'elmas': '💎', 'roket': '🚀', 'uzay': '🌌', 'robot': '🤖', 'oyun': '🎮', 
                'pizza': '🍕', 'kedi': '🐱', 'köpek': '🐶', 'kuş': '🐦', 'deniz': '🌊', 'kalp': '❤️'
            };
            for (const [key, value] of Object.entries(emojiMap)) {
                if (p.includes(key)) { design.emoji = value; break; }
            }

            // Tema Tanıma
            if (p.includes('ruj') || p.includes('aşk') || p.includes('güzellik') || p.includes('kırmızı')) {
                design.colors = ["#4C0519", "#BE123C", "#FDA4AF"]; design.textColor = "#FFF1F2";
                design.bgAnimation = "aurora"; design.particleEffect = "golden_dust";
                design.imageStyle = "glass"; design.imageAnimType = "pulse";
                design.textStyle = "elegant"; design.textAnimation = "neon_pulse"; design.visualEffect = "bloom";
            } else if (p.includes('doğa') || p.includes('ağaç') || p.includes('yeşil') || p.includes('orman')) {
                design.colors = ["#064E3B", "#10B981", "#A7F3D0"]; design.textColor = "#ECFDF5";
                design.bgAnimation = "bokeh"; design.particleEffect = "fireflies";
                design.imageStyle = "circle"; design.imageAnimType = "float";
                design.textStyle = "classic"; design.textAnimation = "fade_up"; design.visualEffect = "lightleak";
            } else if (p.includes('parfüm') || p.includes('lüks') || p.includes('altın')) {
                design.colors = ["#1A0B1A", "#4C1D95", "#FBBF24"]; design.textColor = "#FEF3C7";
                design.bgAnimation = "aurora"; design.particleEffect = "golden_dust";
                design.imageStyle = "polaroid"; design.imageAnimType = "swing";
                design.textStyle = "elegant"; design.textAnimation = "typewriter"; design.visualEffect = "vignette";
            } else if (p.includes('teknoloji') || p.includes('neon') || p.includes('uzay') || p.includes('roket') || p.includes('siber')) {
                design.colors = ["#020617", "#1D4ED8", "#06B6D4"]; design.textColor = "#E0F2FE";
                design.bgAnimation = "tunnel"; design.particleEffect = "none";
                design.imageStyle = "neon_border"; design.imageAnimType = "3d_tilt";
                design.textStyle = "mono"; design.textAnimation = "shake"; design.visualEffect = "glitch";
            } else if (p.includes('kahve') || p.includes('yemek') || p.includes('sıcak')) {
                design.colors = ["#451A03", "#92400E", "#FDE68A"]; design.textColor = "#FFFBEB";
                design.bgAnimation = "waves"; design.particleEffect = "snow"; // Kahve buharı niyetine
                design.imageStyle = "normal"; design.imageAnimType = "zoom_in";
                design.textStyle = "handwriting"; design.textAnimation = "bounce"; design.visualEffect = "retro";
            }

            return design;
        }

        async function getVideoDesignFromAI(prompt, currentSelections) {
            // currentSelections: Kullanıcının menülerden neyi seçtiğini tutar (auto olanlar için AI kullanılacak)
            
            const messages = [
                { 
                    role: "system", 
                    content: `You are an expert AI Art Director. Your task is to output a JSON object based on the user's prompt.
                    Do NOT use markdown, NO comments. Output ONLY valid JSON.
                    Select the best options for the following fields based on the prompt's mood.
                    
                    Allowed values:
                    - bgAnimation: [aurora, galaxy, cyber, matrix, waves, tunnel, bokeh, gradient]
                    - particleEffect: [golden_dust, none, snow, confetti, fireflies]
                    - imageStyle: [glass, normal, circle, polaroid, neon_border, shadow]
                    - imageAnimType: [float, pulse, rotate, zoom_in, swing, slide_side, 3d_tilt]
                    - textStyle: [modern, classic, elegant, impact, handwriting, mono]
                    - textAnimation: [typewriter, slide_in, neon_pulse, bounce, color_cycle, fade_up, zoom_in, shake, split]
                    - visualEffect: [none, bloom, glitch, vignette, grain, scanlines, chromatic, lightleak, retro]
                    
                    JSON FORMAT:
                    {
                      "title": "SHORT TITLE",
                      "subtitle": "SUBTITLE",
                      "colors": ["#hex1", "#hex2", "#hex3"],
                      "emoji": "SINGLE_EMOJI",
                      "bgAnimation": "one_of_the_allowed_values",
                      "particleEffect": "one_of_the_allowed_values",
                      "imageStyle": "one_of_the_allowed_values",
                      "imageAnimType": "one_of_the_allowed_values",
                      "textStyle": "one_of_the_allowed_values",
                      "textAnimation": "one_of_the_allowed_values",
                      "visualEffect": "one_of_the_allowed_values"
                    }` 
                },
                { role: "user", content: `Design for: "${prompt}"` }
            ];

            let aiDesign = null;
            try {
                const reply = await engine.chat.completions.create({ messages, temperature: 0.2, max_tokens: 250 });
                aiDesign = extractJSON(reply.choices[0].message.content);
            } catch (e) {
                console.warn("AI tasarımı alınamadı, yerel zeka devrede.");
            }

            // --- DOĞRULAMA VE BİRLEŞTİRME ---
            // Eğer AI bir şey üretemediyse veya yarım ürettiyse yerel zeka devreye girer
            const fallback = getLocalPromptDesign(prompt);
            
            // Menülerde 'auto' seçiliyse AI'nın veya Yerel Zekanın seçtiğini al, değilse kullanıcının seçtiğini al.
            const finalDesign = {
                title: aiDesign?.title || "PREMIUM",
                subtitle: aiDesign?.subtitle || "COLLECTION",
                colors: aiDesign?.colors || fallback.colors,
                textColor: fallback.textColor, // Yazı rengi her zaman fallback (veya custom) kullanır
                emoji: aiDesign?.emoji || fallback.emoji,
                
                bgAnimation: currentSelections.bgAnimation === 'auto' ? (aiDesign?.bgAnimation || fallback.bgAnimation) : currentSelections.bgAnimation,
                particleEffect: currentSelections.particleEffect === 'auto' ? (aiDesign?.particleEffect || fallback.particleEffect) : currentSelections.particleEffect,
                imageStyle: currentSelections.imageStyle === 'auto' ? (aiDesign?.imageStyle || fallback.imageStyle) : currentSelections.imageStyle,
                imageAnimType: currentSelections.imageAnimType === 'auto' ? (aiDesign?.imageAnimType || fallback.imageAnimType) : currentSelections.imageAnimType,
                textStyle: currentSelections.textStyle === 'auto' ? (aiDesign?.textStyle || fallback.textStyle) : currentSelections.textStyle,
                textAnimation: currentSelections.textAnimation === 'auto' ? (aiDesign?.textAnimation || fallback.textAnimation) : currentSelections.textAnimation,
                visualEffect: currentSelections.visualEffect === 'auto' ? (aiDesign?.visualEffect || fallback.visualEffect) : currentSelections.visualEffect
            };

            // AI'nın uydurma değerler vermesini engelle (Validation)
            const validBgs = ["aurora", "galaxy", "cyber", "matrix", "waves", "tunnel", "bokeh", "gradient"];
            if (!validBgs.includes(finalDesign.bgAnimation)) finalDesign.bgAnimation = "aurora";
            
            const validParts = ["golden_dust", "none", "snow", "confetti", "fireflies"];
            if (!validParts.includes(finalDesign.particleEffect)) finalDesign.particleEffect = "none";
            
            // Diğerleri için de benzer kontroller eklenebilir, şimdilik fallback hallediyor.

            return finalDesign;
        }

        function getFontFamily(style) {
            if (style === 'classic') return "'Playfair Display', serif";
            if (style === 'elegant') return "'Cinzel', serif";
            if (style === 'impact') return "Impact, 'Arial Black', sans-serif";
            if (style === 'handwriting') return "'Caveat', cursive";
            if (style === 'mono') return "'Courier Prime', monospace";
            return "'Montserrat', sans-serif"; // modern
        }

        window.generateVideo = async function() {
            const prompt = document.getElementById('videoPrompt').value.trim() || "Modern bir reklam";
            
            // Kullanıcı seçimlerini al
            const currentSelections = {
                colorPalette: colorPalette.value,
                bgAnimation: bgAnimation.value,
                particleEffect: particleEffect.value,
                imageStyle: imageStyle.value,
                imageAnimType: imageAnimType.value,
                textStyle: textStyle.value,
                textAnimation: textAnimation.value,
                visualEffect: visualEffect.value
            };

            const mTitle = manualTitle.value.trim();
            const mSlogan = manualSlogan.value.trim();
            const customTextColor = textColorPicker.value;

            generateBtn.disabled = true;
            downloadArea.style.display = 'none';
            statusText.innerText = "🧠 Yapay Zeka tüm ayarları seçiyor...";
            statusText.className = "status recording";

            try {
                const design = await getVideoDesignFromAI(prompt, currentSelections);
                
                let finalColors = design.colors;
                if (currentSelections.colorPalette === 'custom') {
                    finalColors = [color1.value, color2.value, color1.value];
                }

                const finalTitle = mTitle !== "" ? mTitle : (design.title || "REKLAM");
                const finalSubtitle = mSlogan !== "" ? mSlogan : (design.subtitle || "SİZİN İÇİN");
                const promptEmoji = design.emoji || ""; 
                const selectedFont = getFontFamily(design.textStyle);

                statusText.innerText = "🎬 Sinematik render başladı...";
                canvas.style.display = 'block';
                canvasContainer.querySelector('span').style.display = 'none';
                recordedChunks = [];

                const stream = canvas.captureStream(60);
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
                mediaRecorder.ondataavailable = (event) => { if (event.data.size > 0) recordedChunks.push(event.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    downloadLink.href = URL.createObjectURL(blob);
                    downloadArea.style.display = 'block';
                    statusText.innerText = "✅ Reklam Filmi Hazır!";
                    statusText.className = "status";
                    generateBtn.disabled = false;
                    generateBtn.innerText = "✨ Otonom Reklamı Üret";
                    cancelAnimationFrame(animationId);
                };

                mediaRecorder.start();

                let startTime = Date.now();
                const duration = 6000; 
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;

                // Parçacık Hazırlığı
                let particles = [];
                const partType = design.particleEffect;
                const pCount = partType === 'golden_dust' ? 300 : (partType === 'fireflies' ? 50 : 150);
                for (let i = 0; i < pCount; i++) {
                    let pColor = "rgba(255,255,255," + Math.random() + ")";
                    let pRadius = Math.random() * 2 + 0.5;
                    let pSpeedX = (Math.random() - 0.5) * 2;
                    let pSpeedY = (Math.random() - 0.5) * 2;

                    if (partType === 'golden_dust') {
                        pColor = `rgba(255, 215, 0, ${Math.random() * 0.8 + 0.2})`; pRadius = Math.random() * 2.5 + 0.5; pSpeedY = -(Math.random() * 1.5 + 0.5);
                    } else if (partType === 'snow') {
                        pColor = `rgba(255, 255, 255, ${Math.random() * 0.8 + 0.2})`; pRadius = Math.random() * 3 + 1; pSpeedY = Math.random() * 2 + 1;
                    } else if (partType === 'confetti') {
                        pColor = `hsl(${Math.random() * 360}, 100%, 50%)`; pRadius = Math.random() * 4 + 2; pSpeedY = Math.random() * 2 + 1;
                    } else if (partType === 'fireflies') {
                        pColor = `rgba(200, 255, 100, ${Math.random() * 0.6 + 0.2})`; pRadius = Math.random() * 4 + 1; 
                    }
                    particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, radius: pRadius, speedX: pSpeedX, speedY: pSpeedY, color: pColor, rotation: Math.random() * Math.PI, phase: Math.random() * Math.PI * 2 });
                }

                const bgType = design.bgAnimation;
                const imgStyle = design.imageStyle;
                const imgAnim = design.imageAnimType;
                const txtAnim = design.textAnimation;
                const effectType = design.visualEffect;

                function drawFrame() {
                    const time = Date.now() - startTime;
                    const progress = time / duration;

                    // === 1. ARKA PLANLAR ===
                    if (bgType === 'aurora' || bgType === 'gradient') {
                        ctx.fillStyle = finalColors[0];
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        const t = time / 1000;
                        for (let i = 0; i < 3; i++) {
                            let x = centerX + Math.cos(t * 0.5 + i * 2) * 400;
                            let y = centerY + Math.sin(t * 0.7 + i * 2) * 300;
                            let radGrad = ctx.createRadialGradient(x, y, 0, x, y, 600);
                            let c = finalColors[i] || finalColors[0];
                            radGrad.addColorStop(0, c + "AA"); radGrad.addColorStop(1, c + "00"); 
                            ctx.fillStyle = radGrad; ctx.fillRect(0, 0, canvas.width, canvas.height);
                        }
                    } 
                    else if (bgType === 'galaxy') {
                        ctx.fillStyle = "#000000"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                        let radGrad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 800);
                        radGrad.addColorStop(0, (finalColors[1] || "#333") + "44"); radGrad.addColorStop(1, "transparent");
                        ctx.fillStyle = radGrad; ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }
                    else if (bgType === 'matrix') {
                        ctx.fillStyle = "#000000"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.fillStyle = finalColors[1] || "#00FF41"; ctx.font = "20px monospace";
                        for(let i=0; i<canvas.width; i+=30) {
                            for(let j=0; j<canvas.height; j+=30) {
                                if(Math.random() > 0.95) ctx.fillText(Math.random().toString(36).substring(2,3), i, j + (time/10)%30);
                            }
                        }
                    }
                    else if (bgType === 'waves') {
                        ctx.fillStyle = finalColors[0]; ctx.fillRect(0, 0, canvas.width, canvas.height);
                        for (let i = 0; i < 3; i++) {
                            ctx.beginPath(); ctx.moveTo(0, canvas.height);
                            for (let x = 0; x <= canvas.width; x += 20) {
                                let y = centerY + Math.sin(x / 200 + time / 1000 + i) * 100;
                                ctx.lineTo(x, y);
                            }
                            ctx.lineTo(canvas.width, canvas.height);
                            ctx.fillStyle = (finalColors[i] || "#333") + "66"; ctx.fill();
                        }
                    }
                    else if (bgType === 'tunnel') {
                        ctx.fillStyle = "#000"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                        for (let i = 10; i > 0; i--) {
                            let size = (i * 100 + (time / 10) % 100);
                            ctx.beginPath(); ctx.roundRect(centerX - size, centerY - size/2, size*2, size, 20);
                            ctx.strokeStyle = finalColors[i % 3] + "80"; ctx.lineWidth = 3; ctx.stroke();
                        }
                    }
                    else if (bgType === 'bokeh') {
                        ctx.fillStyle = finalColors[0]; ctx.fillRect(0, 0, canvas.width, canvas.height);
                        for (let i = 0; i < 30; i++) {
                            let bX = (Math.sin(i * 99 + time / 2000) * 0.5 + 0.5) * canvas.width;
                            let bY = (Math.cos(i * 77 + time / 3000) * 0.5 + 0.5) * canvas.height;
                            let bR = 50 + Math.sin(i) * 40;
                            let radGrad = ctx.createRadialGradient(bX, bY, 0, bX, bY, bR);
                            radGrad.addColorStop(0, finalColors[i % 3] + "33"); radGrad.addColorStop(1, "transparent");
                            ctx.fillStyle = radGrad; ctx.beginPath(); ctx.arc(bX, bY, bR, 0, Math.PI*2); ctx.fill();
                        }
                    }

                    // === 2. PARÇACIKLAR ===
                    if (partType !== 'none') {
                        particles.forEach(p => {
                            ctx.save(); ctx.translate(p.x, p.y); ctx.beginPath();
                            if (partType === 'confetti') {
                                ctx.rotate(time/500 + p.rotation); ctx.fillStyle = p.color;
                                ctx.fillRect(-p.radius, -p.radius, p.radius*2, p.radius*2);
                            } else {
                                let currentRadius = p.radius;
                                if (partType === 'fireflies') currentRadius = p.radius + Math.sin(time/200 + p.phase) * 2;
                                ctx.arc(0, 0, currentRadius, 0, Math.PI * 2); ctx.fillStyle = p.color;
                                if (partType === 'golden_dust') { ctx.shadowColor = "gold"; ctx.shadowBlur = 10; }
                                if (partType === 'fireflies') { ctx.shadowColor = "yellow"; ctx.shadowBlur = 15; }
                                ctx.fill();
                            }
                            ctx.restore();
                            
                            p.x += p.speedX; p.y += p.speedY;
                            if(partType === 'fireflies') { p.x += Math.sin(time/1000 + p.phase) * 1.5; p.y += Math.cos(time/1200 + p.phase) * 1.5; }
                            if (p.x < 0) p.x = canvas.width; if (p.x > canvas.width) p.x = 0;
                            if (p.y < 0) p.y = canvas.height; if (p.y > canvas.height) p.y = 0;
                        });
                    }

                    // === 3. MERKEZ İÇERİK ===
                    let hasContent = false;
                    let imgYOffset = 0, imgScale = 1, imgRotation = 0, imgXOffset = 0;
                    
                    if (imgAnim === 'float') imgYOffset = Math.sin(time / 300) * 20;
                    if (imgAnim === 'pulse') imgScale = 1 + Math.sin(time / 200) * 0.05;
                    if (imgAnim === 'rotate') imgRotation = Math.sin(time / 500) * 0.05;
                    if (imgAnim === 'zoom_in') imgScale = 1 + (progress * 0.2);
                    if (imgAnim === 'swing') imgRotation = Math.sin(time / 300) * 0.15;
                    if (imgAnim === 'slide_side') imgXOffset = Math.max(0, (1000 - time) * 0.5);
                    if (imgAnim === '3d_tilt') { imgRotation = Math.sin(time/1000)*0.1; imgScale = 1 + Math.cos(time/1000)*0.05; }

                    if (uploadedImages.length > 0) {
                        hasContent = true;
                        const totalImages = uploadedImages.length;
                        const timePerImage = duration / totalImages;
                        const currentIndex = Math.min(Math.floor(time / timePerImage), totalImages - 1);
                        const nextIndex = (currentIndex + 1) % totalImages;
                        const imageProgress = (time % timePerImage) / timePerImage;
                        
                        let alphaCurrent = 1, alphaNext = 0;
                        if (imageProgress > 0.8 && totalImages > 1) {
                            alphaCurrent = 1 - ((imageProgress - 0.8) / 0.2); alphaNext = (imageProgress - 0.8) / 0.2;
                        }

                        const drawImg = (img, alpha) => {
                            let imgW = img.width, imgH = img.height, maxSize = 400;
                            if (imgW > maxSize || imgH > maxSize) {
                                if (imgW > imgH) { imgH = (maxSize / imgW) * imgH; imgW = maxSize; }
                                else { imgW = (maxSize / imgH) * imgW; imgH = maxSize; }
                            }
                            ctx.save(); ctx.globalAlpha = alpha;
                            ctx.translate(centerX + imgXOffset, centerY + imgYOffset); 
                            ctx.rotate(imgRotation); ctx.scale(imgScale, imgScale);
                            
                            if (imgStyle === 'neon_border') {
                                ctx.shadowColor = finalColors[1]; ctx.shadowBlur = 50;
                                ctx.strokeStyle = finalColors[2]; ctx.lineWidth = 10; ctx.strokeRect(-imgW/2, -imgH/2, imgW, imgH);
                            } else if (imgStyle === 'shadow') {
                                ctx.shadowColor = finalColors[0]; ctx.shadowBlur = 60; ctx.shadowOffsetX = 20; ctx.shadowOffsetY = 20;
                            } else if (imgStyle === 'glass' || imgStyle === 'polaroid' || imgStyle === 'circle') {
                                ctx.shadowColor = "rgba(0,0,0,0.6)"; ctx.shadowBlur = 30;
                            } else {
                                ctx.shadowColor = "rgba(0,0,0,0.8)"; ctx.shadowBlur = 30;
                            }

                            if (imgStyle === 'glass') {
                                ctx.beginPath(); ctx.roundRect(-imgW/2, -imgH/2, imgW, imgH, 30); ctx.clip();
                                ctx.globalAlpha = alpha * 0.85; ctx.drawImage(img, -imgW/2, -imgH/2, imgW, imgH);
                                ctx.shadowBlur = 0;
                                let glare = ctx.createLinearGradient(-imgW/2, -imgH/2, imgW/2, imgH/2);
                                glare.addColorStop(0, "rgba(255,255,255,0.4)"); glare.addColorStop(0.5, "rgba(255,255,255,0)");
                                ctx.fillStyle = glare; ctx.fillRect(-imgW/2, -imgH/2, imgW, imgH);
                            } 
                            else if (imgStyle === 'circle') {
                                ctx.beginPath(); ctx.arc(0, 0, Math.min(imgW, imgH)/2, 0, Math.PI*2); ctx.clip();
                                let drawSize = Math.min(imgW, imgH); ctx.drawImage(img, -drawSize/2, -drawSize/2, drawSize, drawSize);
                            }
                            else if (imgStyle === 'polaroid') {
                                ctx.fillStyle = "white"; ctx.fillRect(-imgW/2 - 20, -imgH/2 - 20, imgW + 40, imgH + 80);
                                ctx.shadowBlur = 0; ctx.drawImage(img, -imgW/2, -imgH/2, imgW, imgH);
                            }
                            else { ctx.drawImage(img, -imgW/2, -imgH/2, imgW, imgH); }
                            ctx.restore();
                        };

                        drawImg(uploadedImages[currentIndex], alphaCurrent);
                        if (alphaNext > 0) drawImg(uploadedImages[nextIndex], alphaNext);
                    } 
                    else if (promptEmoji !== "") {
                        hasContent = true;
                        ctx.save(); ctx.translate(centerX + imgXOffset, centerY + imgYOffset);
                        ctx.rotate(imgRotation); ctx.scale(imgScale, imgScale);
                        ctx.shadowColor = finalColors[1]; ctx.shadowBlur = 80;
                        ctx.font = "180px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                        ctx.fillText(promptEmoji, 0, 0); ctx.restore();
                    }

                    // === 4. YAZILAR VE ANİMASYONLARI ===
                    let titleYOffset = hasContent ? -230 : -50; 
                    let subYOffset = hasContent ? 260 : 40;  
                    let currentTextColor = customTextColor;
                    let textX = 0, textY = 0, textScale = 1;
                    
                    if (txtAnim === 'color_cycle') {
                        let hue = (time / 10) % 360; currentTextColor = `hsl(${hue}, 100%, 60%)`;
                    } else if (txtAnim === 'slide_in') {
                        if (time < 1000) textX = -1000 + (time * 1);
                    } else if (txtAnim === 'bounce') {
                        titleYOffset += Math.sin(time / 200) * 15; subYOffset += Math.sin(time / 200) * 15;
                    } else if (txtAnim === 'neon_pulse') {
                        textScale = 1 + Math.sin(time / 150) * 0.05;
                    } else if (txtAnim === 'fade_up') {
                        if(time < 1000) { textY = (1000 - time) * 0.1; ctx.globalAlpha = time / 1000; }
                    } else if (txtAnim === 'zoom_in') {
                        if(time < 800) { textScale = Math.max(0.1, time / 800); ctx.globalAlpha = time / 800; }
                    } else if (txtAnim === 'shake') {
                        if(time > 1000 && time < 2000) { textX = (Math.random() - 0.5) * 15; textY = (Math.random() - 0.5) * 15; }
                    } else if (txtAnim === 'split') {
                        if(time < 1000) { textScale = 1.5 - (time/1000)*0.5; ctx.globalAlpha = time/1000; }
                    }

                    ctx.save(); ctx.translate(centerX + textX, centerY + textY); ctx.scale(textScale, textScale);
                    ctx.textAlign = "center"; ctx.textBaseline = "middle"; 
                    
                    ctx.font = `600 80px ${selectedFont}`;
                    let titleWidth = ctx.measureText(finalTitle).width + 80;
                    
                    ctx.fillStyle = "rgba(0, 0, 0, 0.5)"; 
                    ctx.beginPath(); ctx.roundRect(-titleWidth/2, titleYOffset - 60, titleWidth, 110, 20); ctx.fill();

                    ctx.shadowColor = currentTextColor; ctx.shadowBlur = 20; ctx.fillStyle = currentTextColor;
                    if (txtAnim === 'typewriter') {
                        let charsToShow = Math.floor(time / 50);
                        ctx.fillText(finalTitle.substring(0, charsToShow), 0, titleYOffset);
                    } else {
                        ctx.fillText(finalTitle, 0, titleYOffset);
                    }
                    ctx.restore();

                    ctx.save(); ctx.translate(centerX + textX, centerY + textY); ctx.scale(textScale, textScale);
                    ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    ctx.font = `400 32px 'Montserrat', sans-serif`; 
                    
                    let subWidth = ctx.measureText(finalSubtitle).width + 60;
                    ctx.fillStyle = "rgba(0, 0, 0, 0.5)"; ctx.beginPath(); ctx.roundRect(-subWidth/2, subYOffset - 25, subWidth, 50, 15); ctx.fill();

                    ctx.shadowColor = "rgba(0,0,0,0.8)"; ctx.shadowBlur = 10;
                    ctx.fillStyle = txtAnim === 'color_cycle' ? currentTextColor : (finalColors[2] || "#CCCCCC");
                    ctx.fillText(finalSubtitle, 0, subYOffset); ctx.restore();

                    // === 5. SİNEMATİK GÖRÜNTÜ EFEKTLERİ ===
                    if (effectType === 'bloom') {
                        ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = 0.4; ctx.filter = 'blur(15px)';
                        ctx.drawImage(canvas, 0, 0); ctx.filter = 'none'; ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
                    }
                    else if (effectType === 'vignette') {
                        const vignette = ctx.createRadialGradient(centerX, centerY, canvas.height * 0.2, centerX, centerY, canvas.height * 0.9);
                        vignette.addColorStop(0, "rgba(0,0,0,0)"); vignette.addColorStop(1, "rgba(0,0,0,0.9)");
                        ctx.fillStyle = vignette; ctx.fillRect(0, 0, canvas.width, canvas.height);
                    } 
                    else if (effectType === 'grain') {
                        const grainData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        for (let i = 0; i < grainData.data.length; i += 4) {
                            let noise = (Math.random() - 0.5) * 30; grainData.data[i] += noise; grainData.data[i+1] += noise; grainData.data[i+2] += noise;
                        }
                        ctx.putImageData(grainData, 0, 0);
                    }
                    else if (effectType === 'scanlines') {
                        ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
                        for (let i = 0; i < canvas.height; i += 4) { ctx.fillRect(0, i, canvas.width, 2); }
                    }
                    else if (effectType === 'chromatic') {
                        ctx.globalCompositeOperation = 'screen';
                        ctx.fillStyle = "rgba(255,0,0,0.1)"; ctx.fillRect(5, 0, canvas.width, canvas.height);
                        ctx.fillStyle = "rgba(0,0,255,0.1)"; ctx.fillRect(-5, 0, canvas.width, canvas.height);
                        ctx.globalCompositeOperation = 'source-over';
                    }
                    else if (effectType === 'lightleak') {
                        const leakX = centerX + Math.sin(time / 1500) * 600; const leakY = centerY + Math.cos(time / 2000) * 300;
                        const leak = ctx.createRadialGradient(leakX, leakY, 0, leakX, leakY, 400);
                        leak.addColorStop(0, "rgba(255, 200, 100, 0.4)"); leak.addColorStop(1, "rgba(255, 200, 100, 0)");
                        ctx.fillStyle = leak; ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }
                    else if (effectType === 'retro') {
                        ctx.fillStyle = "rgba(112, 66, 20, 0.4)"; ctx.globalCompositeOperation = 'multiply';
                        ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.globalCompositeOperation = 'source-over';
                        const grainData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        for (let i = 0; i < grainData.data.length; i += 4) {
                            let noise = (Math.random() - 0.5) * 60; grainData.data[i] += noise; grainData.data[i+1] += noise; grainData.data[i+2] += noise;
                        }
                        ctx.putImageData(grainData, 0, 0);
                    }

                    if (time >= duration) { mediaRecorder.stop(); } 
                    else { animationId = requestAnimationFrame(drawFrame); }
                }

                drawFrame();

            } catch (error) {
                statusText.innerText = "⚠️ Hata: " + error.message;
                generateBtn.disabled = false;
                generateBtn.innerText = "✨ Otonom Reklamı Üret";
            }
        };
    </script>
</body>
