<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Reklam Stüdyosu | AGENT-GELISTIRME</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@300;600&family=Inter:wght@400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0F172A; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { margin: 0; font-family: 'Playfair Display', serif; font-size: 32px; background: linear-gradient(90deg, #38BDF8, #A78BFA); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { color: #94A3B8; font-size: 13px; margin-top: 5px; }
        
        .studio-container { width: 100%; max-width: 850px; background: #1E293B; border-radius: 20px; padding: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid #334155; }
        
        .prompt-area { display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px; }
        .prompt-area label { font-size: 14px; font-weight: 600; color: #E2E8F0; }
        .prompt-area textarea { width: 100%; height: 70px; background: #0F172A; border: 1px solid #334155; border-radius: 10px; padding: 14px; color: white; font-family: 'Inter', sans-serif; resize: none; outline: none; transition: border 0.3s; }
        .prompt-area textarea:focus { border-color: #38BDF8; }

        /* Yaratıcı Kontrol Paneli */
        .creative-controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-group label { font-size: 12px; color: #94A3B8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .control-group select { background: #0F172A; color: white; border: 1px solid #334155; padding: 10px; border-radius: 8px; outline: none; cursor: pointer; font-family: 'Inter', sans-serif; }
        .control-group select:focus { border-color: #A78BFA; }

        .upload-area { display: flex; align-items: center; gap: 10px; background: #0F172A; padding: 10px 15px; border-radius: 10px; border: 1px dashed #475569; margin-bottom: 15px; }
        .upload-area input { color: #94A3B8; font-size: 13px; width: 100%; }
        .upload-area span { font-size: 12px; color: #10B981; display: none; font-weight: 600; white-space: nowrap; }
        
        .action-row { display: flex; gap: 10px; }
        .action-row button { flex: 1; background: linear-gradient(135deg, #38BDF8, #818CF8); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .action-row button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(56,189,248,0.3); }
        .action-row button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; background: #475569; }

        .canvas-area { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; position: relative; display: flex; justify-content: center; align-items: center; margin-bottom: 15px; margin-top: 20px; border: 2px solid #334155; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
        canvas { width: 100%; height: 100%; display: none; }
        
        .status { text-align: center; font-size: 13px; color: #94A3B8; margin-bottom: 10px; font-weight: 600; }
        .status.recording { color: #F87171; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .download-area { display: none; text-align: center; margin-top: 10px; }
        .download-area a { display: inline-block; background: #10B981; color: white; padding: 12px 24px; text-decoration: none; border-radius: 10px; font-weight: 600; transition: background 0.2s; }
        .download-area a:hover { background: #059669; }

        @media (max-width: 600px) { .creative-controls { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="header">
        <h1>Pro Reklam Stüdyosu</h1>
        <p>Yapay zeka ile tasarla, yaratıcı efektlerle süsle.</p>
    </div>

    <div class="studio-container">
        <div class="prompt-area">
            <label for="videoPrompt">Senaryo (Ne reklamı yapıyoruz?):</label>
            <textarea id="videoPrompt" placeholder="Örnek: Kırmızı ve altın tonlarında lüks bir ruj reklamı."></textarea>
        </div>

        <!-- Yeni Yaratıcı Kontroller -->
        <div class="creative-controls">
            <div class="control-group">
                <label>Renk Paleti</label>
                <select id="colorPalette">
                    <option value="auto">AI Karar Versin (Otomatik)</option>
                    <option value="pastel">Pastel & Yumuşak</option>
                    <option value="vivid">Canlı & Neon</option>
                    <option value="dark">Karanlık & Kurumsal</option>
                    <option value="luxury">Altın & Lüks</option>
                </select>
            </div>
            <div class="control-group">
                <label>Arka Plan Animasyonu</label>
                <select id="bgAnimation">
                    <option value="gradient">Renk Geçişi (Gradient)</option>
                    <option value="particles">Parıltılar (Bokeh)</option>
                    <option value="geometric">Geometrik Şekiller</option>
                    <option value="waves">Sinematik Dalgalar</option>
                </select>
            </div>
            <div class="control-group">
                <label>Sinematik Efekt</label>
                <select id="visualEffect">
                    <option value="none">Efekt Yok</option>
                    <option value="vignette">Vignette (Kenar Karartma)</option>
                    <option value="grain">Film Greni (Grain)</option>
                    <option value="lightleak">Işık Sızması</option>
                </select>
            </div>
        </div>

        <div class="upload-area">
            <input type="file" id="imageUpload" accept="image/*">
            <span id="uploadStatus">✅ Görsel Yüklendi</span>
        </div>

        <div class="action-row">
            <button id="generateBtn" onclick="generateVideo()" disabled>Yapay Zeka Yükleniyor...</button>
        </div>

        <div class="canvas-area" id="canvasContainer">
            <span style="color: #64748B; font-weight: 300;">Reklamınız Burada Oluşacak</span>
            <canvas id="videoCanvas" width="1280" height="720"></canvas>
        </div>

        <div class="status" id="statusText">Model indiriliyor, lütfen bekleyin...</div>

        <div class="download-area" id="downloadArea">
            <a id="downloadLink" download="pro_reklam.webm">📥 Reklam Filmini İndir (.webm)</a>
        </div>
    </div>

    <script type="module">
        import * as webllm from "https://esm.run/@mlc-ai/web-llm";

        let engine = null;
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('statusText');
        const generateBtn = document.getElementById('generateBtn');
        const downloadArea = document.getElementById('downloadArea');
        const downloadLink = document.getElementById('downloadLink');
        const canvasContainer = document.getElementById('canvasContainer');
        
        const imageUpload = document.getElementById('imageUpload');
        const uploadStatus = document.getElementById('uploadStatus');
        const colorPalette = document.getElementById('colorPalette');
        const bgAnimation = document.getElementById('bgAnimation');
        const visualEffect = document.getElementById('visualEffect');

        let mediaRecorder;
        let recordedChunks = [];
        let animationId;
        let uploadedImage = null;

        // Görsel Yükleme
        imageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        uploadedImage = img;
                        uploadStatus.style.display = 'inline';
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            } else {
                uploadedImage = null;
                uploadStatus.style.display = 'none';
            }
        });

        // Modeli Başlat
        async function initAI() {
            try {
                const selectedModel = "Llama-3.2-1B-Instruct-q4f32_1-MLC";
                engine = await webllm.CreateMLCEngine(selectedModel, {
                    initProgressCallback: (progress) => { statusText.innerText = progress.text; }
                });
                statusText.innerText = "✅ Sistem Hazır!";
                statusText.style.color = "#10B981";
                generateBtn.disabled = false;
                generateBtn.innerText = "✨ Profesyonel Reklamı Üret";
            } catch (e) {
                statusText.innerText = "⚠️ Model hatası: " + e.message;
            }
        }
        initAI();

        // JSON Temizleyici
        function extractJSON(text) {
            try {
                let clean = text.replace(/```json/gi, '').replace(/```/g, '').replace(/\/\/.*$/gm, '').trim();
                const match = clean.match(/\{[\s\S]*\}/);
                if (match) return JSON.parse(match[0].replace(/'/g, '"').replace(/,\s*}/g, '}'));
            } catch (err) {}
            return null;
        }

        // Yedek Plan (Seçimlere göre)
        function getFallbackDesign(prompt, palette) {
            const p = prompt.toLowerCase();
            if (palette === 'pastel' || p.includes('pastel')) return { title: "SOFT", subtitle: "PASTEL TONES", colors: ["#FDE68A", "#FBCFE8", "#E9D5FF"], textColor: "#4C1D95", particleColor: "rgba(255,255,255,0.8)", fontStyle: "serif" };
            if (palette === 'vivid' || p.includes('neon')) return { title: "NEON", subtitle: "VIVID LIFE", colors: ["#06B6D4", "#D946EF", "#F59E0B"], textColor: "#FFFFFF", particleColor: "rgba(6,182,212,0.8)", fontStyle: "sans-serif" };
            if (palette === 'luxury' || p.includes('altın')) return { title: "LUXE", subtitle: "GOLD EDITION", colors: ["#1A0B1A", "#4C1D95", "#D4AF37"], textColor: "#FBBF24", particleColor: "rgba(251,191,36,0.6)", fontStyle: "serif" };
            return { title: "PREMIUM", subtitle: "DESIGN", colors: ["#111827", "#374151", "#1F2937"], textColor: "#F3F4F6", particleColor: "rgba(255,255,255,0.3)", fontStyle: "sans-serif" };
        }

        // AI'dan Tasarım İsteme
        async function getVideoDesignFromAI(prompt, palette) {
            const messages = [
                { 
                    role: "system", 
                    content: `You are a JSON API. Output ONLY valid JSON. No markdown, no comments.
                    Format: {"title": "TITLE", "subtitle": "SUBTITLE", "colors": ["#hex1", "#hex2", "#hex3"], "textColor": "#hex", "particleColor": "rgba(255,255,255,0.5)", "fontStyle": "serif"}
                    The user has selected the '${palette}' color palette. Ensure the colors match this vibe.` 
                },
                { role: "user", content: `Design for: "${prompt}"` }
            ];

            try {
                const reply = await engine.chat.completions.create({ messages, temperature: 0.1, max_tokens: 150 });
                let design = extractJSON(reply.choices[0].message.content);
                if (design && design.title && design.colors) return design;
            } catch (e) {}
            return getFallbackDesign(prompt, palette);
        }

        // Emojiler
        function getEmojisFromPrompt(prompt) {
            const p = prompt.toLowerCase();
            let emojis = [];
            if (p.includes('ruj')) emojis.push('💄');
            if (p.includes('parfüm')) emojis.push('🧴');
            if (p.includes('araba')) emojis.push('🚗');
            if (p.includes('saat')) emojis.push('⌚');
            if (p.includes('kahve')) emojis.push('☕');
            if (p.includes('telefon')) emojis.push('📱');
            return emojis;
        }

        // VİDEO ÜRETİM
        window.generateVideo = async function() {
            const prompt = document.getElementById('videoPrompt').value.trim() || "Modern bir reklam";
            const palette = colorPalette.value;
            const animType = bgAnimation.value;
            const effectType = visualEffect.value;

            generateBtn.disabled = true;
            downloadArea.style.display = 'none';
            statusText.innerText = "🧠 Yapay Zeka tasarlıyor...";
            statusText.className = "status recording";

            try {
                const design = await getVideoDesignFromAI(prompt, palette);
                const emojis = getEmojisFromPrompt(prompt);
                
                statusText.innerText = "🎬 Video render ediliyor...";
                canvas.style.display = 'block';
                canvasContainer.querySelector('span').style.display = 'none';
                recordedChunks = [];

                const stream = canvas.captureStream(60);
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
                mediaRecorder.ondataavailable = (event) => { if (event.data.size > 0) recordedChunks.push(event.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    downloadLink.href = URL.createObjectURL(blob);
                    downloadArea.style.display = 'block';
                    statusText.innerText = "✅ Reklam Filmi Hazır!";
                    statusText.className = "status";
                    generateBtn.disabled = false;
                    generateBtn.innerText = "✨ Profesyonel Reklamı Üret";
                    cancelAnimationFrame(animationId);
                };

                mediaRecorder.start();

                let startTime = Date.now();
                const duration = 6000;
                let particles = [];
                for (let i = 0; i < 100; i++) {
                    particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, radius: Math.random() * 3 + 0.5, speedX: (Math.random() - 0.5) * 1.5, speedY: (Math.random() - 0.5) * 1.5 - 0.5, alpha: Math.random() * 0.5 + 0.1 });
                }

                // Geçici (Offscreen) tuval - Film Grain için
                const grainCanvas = document.createElement('canvas');
                grainCanvas.width = 100; grainCanvas.height = 100;
                const grainCtx = grainCanvas.getContext('2d');

                function drawFrame() {
                    const time = Date.now() - startTime;
                    const centerX = canvas.width / 2;
                    const centerY = canvas.height / 2;

                    // 1. ARKA PLAN SEÇENEKLERİ
                    if (animType === 'gradient') {
                        const gradient = ctx.createLinearGradient(centerX + Math.sin(time/1000) * 500, 0, centerX - Math.sin(time/1000) * 500, canvas.height);
                        gradient.addColorStop(0, design.colors[0]);
                        gradient.addColorStop(0.5, design.colors[1]);
                        gradient.addColorStop(1, design.colors[2]);
                        ctx.fillStyle = gradient;
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    } 
                    else if (animType === 'particles') {
                        ctx.fillStyle = design.colors[0]; // Koyu baz renk
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        // Parçacıklar
                        particles.forEach(p => {
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                            ctx.fillStyle = design.particleColor;
                            ctx.globalAlpha = p.alpha * (0.5 + Math.sin(time/500 + p.x) * 0.5);
                            ctx.shadowColor = "white"; ctx.shadowBlur = 15; ctx.fill();
                            p.x += p.speedX; p.y += p.speedY;
                            if (p.x < 0) p.x = canvas.width; if (p.x > canvas.width) p.x = 0;
                            if (p.y < 0) p.y = canvas.height; if (p.y > canvas.height) p.y = 0;
                        });
                        ctx.globalAlpha = 1; ctx.shadowBlur = 0;
                    }
                    else if (animType === 'geometric') {
                        ctx.fillStyle = design.colors[0];
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.save();
                        ctx.translate(centerX, centerY);
                        for(let i=0; i<5; i++) {
                            ctx.rotate(time / 2000 + i);
                            ctx.beginPath();
                            ctx.rect(-150 - i*50, -150 - i*50, 300 + i*100, 300 + i*100);
                            ctx.strokeStyle = design.colors[i % 3];
                            ctx.lineWidth = 2;
                            ctx.globalAlpha = 0.3;
                            ctx.stroke();
                        }
                        ctx.restore();
                        ctx.globalAlpha = 1;
                    }
                    else if (animType === 'waves') {
                        ctx.fillStyle = design.colors[0];
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        for(let i=0; i<3; i++) {
                            ctx.beginPath();
                            ctx.moveTo(0, canvas.height);
                            for(let x=0; x<=canvas.width; x+=20) {
                                let y = centerY + Math.sin(x/200 + time/1000 + i) * 100;
                                ctx.lineTo(x, y);
                            }
                            ctx.lineTo(canvas.width, canvas.height);
                            ctx.fillStyle = design.colors[i] + "80"; // %50 saydamlık
                            ctx.fill();
                        }
                    }

                    // 2. MERKEZ GÖRSEL VEYA EMOJİ
                    const pulse = 1 + Math.sin(time / 500) * 0.05;
                    if (uploadedImage) {
                        ctx.save();
                        ctx.translate(centerX, centerY); ctx.scale(pulse, pulse);
                        let imgW = uploadedImage.width, imgH = uploadedImage.height, maxSize = 350;
                        if (imgW > maxSize || imgH > maxSize) {
                            if (imgW > imgH) { imgH = (maxSize / imgW) * imgH; imgW = maxSize; }
                            else { imgW = (maxSize / imgH) * imgW; imgH = maxSize; }
                        }
                        ctx.shadowColor = "rgba(0,0,0,0.8)"; ctx.shadowBlur = 40;
                        ctx.drawImage(uploadedImage, -imgW/2, -imgH/2, imgW, imgH);
                        ctx.restore();
                    } else if (emojis.length > 0) {
                        ctx.save();
                        ctx.translate(centerX, centerY + Math.sin(time/300) * 20);
                        ctx.scale(pulse, pulse);
                        ctx.font = "150px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                        ctx.shadowColor = "rgba(0,0,0,0.6)"; ctx.shadowBlur = 30;
                        ctx.fillText(emojis.join(' '), 0, 0);
                        ctx.restore();
                    }

                    // 3. METİN ANİMASYONU
                    const textOpacity = Math.min(1, time / 1000);
                    ctx.save();
                    ctx.translate(centerX, centerY);
                    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.globalAlpha = textOpacity;
                    ctx.shadowColor = "rgba(0,0,0,0.9)"; ctx.shadowBlur = 20; ctx.shadowOffsetY = 5;

                    let yOffset = uploadedImage ? 250 : -120; 
                    ctx.fillStyle = design.textColor || "#FFFFFF";
                    const fontStyle = design.fontStyle === 'serif' ? "'Playfair Display', serif" : "'Montserrat', sans-serif";
                    ctx.font = `600 70px ${fontStyle}`;
                    ctx.fillText(design.title || "REKLAM", 0, yOffset);

                    ctx.shadowBlur = 10;
                    ctx.font = "300 28px 'Montserrat', sans-serif";
                    ctx.fillText(design.subtitle || "SİZİN İÇİN", 0, yOffset + 60);
                    ctx.restore();

                    // 4. SİNEMATİK EFEKTLER (Overlay)
                    if (effectType === 'vignette') {
                        const vignette = ctx.createRadialGradient(centerX, centerY, canvas.height * 0.3, centerX, centerY, canvas.height * 0.8);
                        vignette.addColorStop(0, "rgba(0,0,0,0)");
                        vignette.addColorStop(1, "rgba(0,0,0,0.8)");
                        ctx.fillStyle = vignette;
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    } 
                    else if (effectType === 'grain') {
                        // Rastgele gürültü oluştur
                        const grainData = grainCtx.createImageData(100, 100);
                        for (let i = 0; i < grainData.data.length; i += 4) {
                            let val = Math.random() * 255;
                            grainData.data[i] = val; grainData.data[i+1] = val; grainData.data[i+2] = val; grainData.data[i+3] = 30; // Düşük saydamlık
                        }
                        grainCtx.putImageData(grainData, 0, 0);
                        // Ana tuvale gerilerek çiz
                        ctx.drawImage(grainCanvas, 0, 0, canvas.width, canvas.height);
                    }
                    else if (effectType === 'lightleak') {
                        const leakX = centerX + Math.sin(time / 1500) * 600;
                        const leakY = centerY + Math.cos(time / 2000) * 300;
                        const leak = ctx.createRadialGradient(leakX, leakY, 0, leakX, leakY, 400);
                        leak.addColorStop(0, "rgba(255, 200, 100, 0.3)"); // Turuncu/Sıcak ışık
                        leak.addColorStop(1, "rgba(255, 200, 100, 0)");
                        ctx.fillStyle = leak;
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }

                    if (time >= duration) { mediaRecorder.stop(); } 
                    else { animationId = requestAnimationFrame(drawFrame); }
                }

                drawFrame();

            } catch (error) {
                statusText.innerText = "⚠️ Hata: " + error.message;
                generateBtn.disabled = false;
                generateBtn.innerText = "✨ Profesyonel Reklamı Üret";
            }
        };
    </script>
</body>
</html>
