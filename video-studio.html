<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Pro Stüdyo v3 | AGENT-GELISTIRME</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@300;400;600&family=Inter:wght@400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0B1120; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { margin: 0; font-family: 'Playfair Display', serif; font-size: 34px; background: linear-gradient(90deg, #38BDF8, #A78BFA, #F472B6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .studio-container { width: 100%; max-width: 950px; background: #1E293B; border-radius: 20px; padding: 24px; box-shadow: 0 25px 60px rgba(0,0,0,0.6); border: 1px solid #334155; }
        
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-group label { font-size: 13px; font-weight: 600; color: #E2E8F0; }
        .input-group input, .input-group textarea { width: 100%; background: #0F172A; border: 1px solid #334155; border-radius: 8px; padding: 12px; color: white; font-family: 'Inter', sans-serif; outline: none; box-sizing: border-box; }
        .input-group textarea { height: 70px; resize: none; }
        .input-group input:focus, .input-group textarea:focus { border-color: #38BDF8; }

        /* Kontrol Panelleri */
        .controls-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 15px; }
        
        .control-box { background: #0F172A; padding: 12px; border-radius: 10px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 8px; }
        .control-box label { font-size: 11px; color: #94A3B8; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .control-box select { background: #1E293B; color: #E2E8F0; border: 1px solid #334155; padding: 10px; border-radius: 8px; outline: none; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 13px; width: 100%; }
        .control-box select:focus { border-color: #A78BFA; }
        
        /* Renk Seçiciler */
        .color-picker-row { display: flex; gap: 10px; align-items: center; justify-content: space-around; padding-top: 5px; }
        .color-picker-group { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .color-picker-group span { font-size: 10px; color: #94A3B8; }
        .color-picker-group input[type="color"] { -webkit-appearance: none; border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; padding: 0; background: none; }
        .color-picker-group input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        .color-picker-group input[type="color"]::-webkit-color-swatch { border: 2px solid #475569; border-radius: 50%; }

        .upload-area { display: flex; flex-direction: column; gap: 10px; background: #0F172A; padding: 15px; border-radius: 10px; border: 1px dashed #475569; margin-bottom: 15px; }
        .upload-area input { color: #94A3B8; font-size: 13px; cursor: pointer; }
        .preview-container { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 5px; }
        .preview-container img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; border: 2px solid #334155; }
        .upload-status { font-size: 12px; color: #10B981; font-weight: 600; display: none; }
        
        .action-row { display: flex; gap: 10px; margin-top: 15px; }
        .action-row button { flex: 1; background: linear-gradient(135deg, #38BDF8, #818CF8, #F472B6); background-size: 200% 200%; color: white; border: none; padding: 16px; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s; animation: gradientBG 3s infinite; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .action-row button:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(56,189,248,0.4); }
        .action-row button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; animation: none; background: #475569; }

        .canvas-area { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; position: relative; display: flex; justify-content: center; align-items: center; margin-bottom: 15px; margin-top: 20px; border: 2px solid #334155; }
        canvas { width: 100%; height: 100%; display: none; }
        
        .status { text-align: center; font-size: 13px; color: #94A3B8; margin-bottom: 10px; font-weight: 600; }
        .status.recording { color: #F87171; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .download-area { display: none; text-align: center; margin-top: 10px; }
        .download-area a { display: inline-block; background: #10B981; color: white; padding: 14px 28px; text-decoration: none; border-radius: 10px; font-weight: 700; font-size: 15px; }
        
        @media (max-width: 700px) { .controls-grid, .input-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="header">
        <h1>Ultimate Pro Stüdyo v3</h1>
        <p>Okunabilir yazılar, cam efektli görseller ve tam kontrol.</p>
    </div>

    <div class="studio-container">
        
        <div class="input-group" style="margin-bottom: 12px;">
            <label for="videoPrompt">Senaryo (Yapay Zeka'nın renk seçmesi için):</label>
            <textarea id="videoPrompt" placeholder="Örnek: Kırmızı ve altın tonlarında lüks bir ruj reklamı."></textarea>
        </div>

        <div class="input-row">
            <div class="input-group">
                <label for="manualTitle">Reklam Başlığı (İsteğe Bağlı)</label>
                <input type="text" id="manualTitle" placeholder="Örn: LUXE BEAUTY">
            </div>
            <div class="input-group">
                <label for="manualSlogan">Slogan (İsteğe Bağlı)</label>
                <input type="text" id="manualSlogan" placeholder="Örn: YENİ KOLEKSİYON">
            </div>
        </div>

        <!-- GELİŞMİŞ KONTROL PANELLERİ -->
        <div class="controls-grid">
            
            <!-- 1. RENK PALETİ VE YAZI RENGİ -->
            <div class="control-box">
                <label>🎨 Renk Teması</label>
                <select id="colorPalette">
                    <option value="auto">Yapay Zeka Karar Versin</option>
                    <option value="luxury">Altın & Lüks</option>
                    <option value="cyberpunk">Cyberpunk (Neon)</option>
                    <option value="pastel">Pastel Rüya</option>
                    <option value="sunset">Gün Batımı</option>
                    <option value="matrix">Matrix</option>
                    <option value="custom">Özel Arka Plan Rengi</option>
                </select>
                <div class="color-picker-row" id="customColorContainer" style="display: none;">
                    <div class="color-picker-group">
                        <input type="color" id="color1" value="#FF007F">
                        <span>Arka 1</span>
                    </div>
                    <div class="color-picker-group">
                        <input type="color" id="color2" value="#00F0FF">
                        <span>Arka 2</span>
                    </div>
                </div>
                <div class="color-picker-row" style="margin-top: 5px; border-top: 1px solid #334155; padding-top: 10px;">
                    <div class="color-picker-group">
                        <input type="color" id="textColorPicker" value="#FFFFFF">
                        <span style="font-weight: 600; color: #E2E8F0;">Özel Yazı Rengi</span>
                    </div>
                </div>
            </div>

            <!-- 2. GÖRSEL ANİMASYONU VE STİLİ -->
            <div class="control-box">
                <label>🖼️ Görsel Stili & Hareketi</label>
                <select id="imageStyle">
                    <option value="glass">Cam Efekti (Şeffaf & Yuvarlak)</option>
                    <option value="normal">Normal (Keskin Kenar)</option>
                </select>
                <select id="imageAnimType">
                    <option value="none">Sabit</option>
                    <option value="float">Süzülme (Yukarı-Aşağı)</option>
                    <option value="pulse">Nefes Alma (Büyüyüp Küçülme)</option>
                    <option value="rotate">Hafif Dönme</option>
                </select>
            </div>

            <!-- 3. ARKA PLAN VE PARÇACIKLAR -->
            <div class="control-box">
                <label>🌌 Arka Plan & Parçacık</label>
                <select id="bgAnimation">
                    <option value="aurora">Aurora (Kutup Işıkları)</option>
                    <option value="galaxy">Galaksi (Yıldız Tozu)</option>
                    <option value="cyber">Cyberpunk Izgara</option>
                    <option value="matrix">Matrix Yağmuru</option>
                </select>
                <select id="particleEffect">
                    <option value="golden_dust" selected>Altın Tozu (Golden Dust)</option>
                    <option value="none">Parçacık Yok</option>
                    <option value="snow">Kar Yağışı</option>
                    <option value="confetti">Konfeti</option>
                </select>
            </div>

            <!-- 4. YAZI VE SİNEMATİK EFEKTLER -->
            <div class="control-box" style="grid-column: span 3; display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div>
                    <label>🔠 Yazı Animasyonu</label>
                    <select id="textAnimation">
                        <option value="typewriter">Daktilo (Harf Harf)</option>
                        <option value="slide_in">Yandan Kayma</option>
                        <option value="neon_pulse">Neon Nabız (Işıma)</option>
                        <option value="bounce">Zıplayan / Süzülen</option>
                        <option value="color_cycle">Renk Değiştiren</option>
                    </select>
                </div>
                <div>
                    <label>🎬 Sinematik Görüntü Efekti</label>
                    <select id="visualEffect">
                        <option value="none">Efekt Yok (Sade)</option>
                        <option value="glitch">Glitch (Teknoloji)</option>
                        <option value="bloom">Bloom (Işıma/Taşma)</option>
                        <option value="vignette">Vignette (Kenar Karartma)</option>
                        <option value="grain">Film Greni</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="upload-area">
            <label style="font-size: 13px; font-weight: 600; color: #E2E8F0;">Ürün Görselleri (Çoklu seçim için Ctrl basılı tutun):</label>
            <input type="file" id="imageUpload" accept="image/*" multiple>
            <div class="upload-status" id="uploadStatus">✅ Görseller Yüklendi</div>
            <div class="preview-container" id="previewContainer"></div>
        </div>

        <div class="action-row">
            <button id="generateBtn" onclick="generateVideo()" disabled>Yapay Zeka Yükleniyor...</button>
        </div>

        <div class="canvas-area" id="canvasContainer">
            <span style="color: #64748B; font-weight: 300;">Reklamınız Burada Oluşacak</span>
            <canvas id="videoCanvas" width="1280" height="720"></canvas>
        </div>

        <div class="status" id="statusText">Model indiriliyor, lütfen bekleyin...</div>

        <div class="download-area" id="downloadArea">
            <a id="downloadLink" download="pro_reklam.webm">📥 Reklam Filmini İndir (.webm)</a>
        </div>
    </div>

    <script type="module">
        import * as webllm from "https://esm.run/@mlc-ai/web-llm";

        let engine = null;
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('statusText');
        const generateBtn = document.getElementById('generateBtn');
        const downloadArea = document.getElementById('downloadArea');
        const downloadLink = document.getElementById('downloadLink');
        const canvasContainer = document.getElementById('canvasContainer');
        
        const imageUpload = document.getElementById('imageUpload');
        const uploadStatus = document.getElementById('uploadStatus');
        const previewContainer = document.getElementById('previewContainer');
        
        const colorPalette = document.getElementById('colorPalette');
        const customColorContainer = document.getElementById('customColorContainer');
        const color1 = document.getElementById('color1');
        const color2 = document.getElementById('color2');
        const textColorPicker = document.getElementById('textColorPicker');
        
        const imageStyle = document.getElementById('imageStyle');
        const imageAnimType = document.getElementById('imageAnimType');
        const bgAnimation = document.getElementById('bgAnimation');
        const particleEffect = document.getElementById('particleEffect');
        const textAnimation = document.getElementById('textAnimation');
        const visualEffect = document.getElementById('visualEffect');
        const manualTitle = document.getElementById('manualTitle');
        const manualSlogan = document.getElementById('manualSlogan');

        let mediaRecorder;
        let recordedChunks = [];
        let animationId;
        let uploadedImages = []; 

        colorPalette.addEventListener('change', () => {
            customColorContainer.style.display = colorPalette.value === 'custom' ? 'flex' : 'none';
        });

        imageUpload.addEventListener('change', async function(e) {
            const files = Array.from(e.target.files);
            uploadedImages = [];
            previewContainer.innerHTML = '';
            if (files.length === 0) return;

            uploadStatus.style.display = 'block';
            uploadStatus.innerText = `⏳ Yükleniyor (${files.length} resim)...`;

            const loadPromises = files.map(file => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            const thumb = document.createElement('img');
                            thumb.src = event.target.result;
                            previewContainer.appendChild(thumb);
                            resolve(img);
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            });

            uploadedImages = await Promise.all(loadPromises);
            uploadStatus.innerText = `✅ ${uploadedImages.length} Görsel Yüklendi`;
        });

        async function initAI() {
            try {
                const selectedModel = "Llama-3.2-1B-Instruct-q4f32_1-MLC";
                engine = await webllm.CreateMLCEngine(selectedModel, {
                    initProgressCallback: (progress) => { statusText.innerText = progress.text; }
                });
                statusText.innerText = "✅ Sistem Hazır!";
                statusText.style.color = "#10B981";
                generateBtn.disabled = false;
                generateBtn.innerText = "✨ Ultra Reklamı Üret";
            } catch (e) {
                statusText.innerText = "⚠️ Model hatası: " + e.message;
            }
        }
        initAI();

        function extractJSON(text) {
            try {
                let clean = text.replace(/```json/gi, '').replace(/```/g, '').replace(/\/\/.*$/gm, '').trim();
                const match = clean.match(/\{[\s\S]*\}/);
                if (match) return JSON.parse(match[0].replace(/'/g, '"').replace(/,\s*}/g, '}'));
            } catch (err) {}
            return null;
        }

        function getFallbackDesign(prompt, palette) {
            const p = prompt.toLowerCase();
            if (palette === 'pastel' || p.includes('pastel')) return { title: "SOFT", subtitle: "PASTEL TONES", colors: ["#FDE68A", "#FBCFE8", "#E9D5FF"], fontStyle: "serif" };
            if (palette === 'cyberpunk' || p.includes('neon')) return { title: "NEON", subtitle: "VIVID LIFE", colors: ["#06B6D4", "#D946EF", "#F59E0B"], fontStyle: "sans-serif" };
            if (palette === 'luxury' || p.includes('altın')) return { title: "LUXE", subtitle: "GOLD EDITION", colors: ["#1A0B1A", "#4C1D95", "#D4AF37"], fontStyle: "serif" };
            if (palette === 'matrix') return { title: "SYSTEM", subtitle: "ACCESS GRANTED", colors: ["#000000", "#003B00", "#00FF41"], fontStyle: "sans-serif" };
            return { title: "PREMIUM", subtitle: "DESIGN", colors: ["#111827", "#374151", "#1F2937"], fontStyle: "sans-serif" };
        }

        async function getVideoDesignFromAI(prompt, palette) {
            if (palette === 'custom') return getFallbackDesign(prompt, 'luxury');

            const messages = [
                { 
                    role: "system", 
                    content: `You are a JSON API. Output ONLY valid JSON. No markdown, no comments.
                    Format: {"title": "TITLE", "subtitle": "SUBTITLE", "colors": ["#hex1", "#hex2", "#hex3"], "fontStyle": "serif"}
                    The user has selected the '${palette}' color palette.` 
                },
                { role: "user", content: `Design for: "${prompt}"` }
            ];

            try {
                const reply = await engine.chat.completions.create({ messages, temperature: 0.1, max_tokens: 150 });
                let design = extractJSON(reply.choices[0].message.content);
                if (design && design.colors) return design;
            } catch (e) {}
            return getFallbackDesign(prompt, palette);
        }

        window.generateVideo = async function() {
            const prompt = document.getElementById('videoPrompt').value.trim() || "Modern bir reklam";
            const palette = colorPalette.value;
            const imgStyle = imageStyle.value;
            const imgAnim = imageAnimType.value;
            const animType = bgAnimation.value;
            const partType = particleEffect.value;
            const textAnimType = textAnimation.value;
            const effectType = visualEffect.value;
            
            const mTitle = manualTitle.value.trim();
            const mSlogan = manualSlogan.value.trim();
            const customTextColor = textColorPicker.value;

            generateBtn.disabled = true;
            downloadArea.style.display = 'none';
            statusText.innerText = "🧠 Yapay Zeka tasarlıyor...";
            statusText.className = "status recording";

            try {
                const design = await getVideoDesignFromAI(prompt, palette);
                
                let finalColors = design.colors;
                if (palette === 'custom') {
                    finalColors = [color1.value, color2.value, color1.value];
                }

                const finalTitle = mTitle !== "" ? mTitle : (design.title || "REKLAM");
                const finalSubtitle = mSlogan !== "" ? mSlogan : (design.subtitle || "SİZİN İÇİN");

                statusText.innerText = "🎬 Sinematik render başladı...";
                canvas.style.display = 'block';
                canvasContainer.querySelector('span').style.display = 'none';
                recordedChunks = [];

                const stream = canvas.captureStream(60);
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
                mediaRecorder.ondataavailable = (event) => { if (event.data.size > 0) recordedChunks.push(event.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    downloadLink.href = URL.createObjectURL(blob);
                    downloadArea.style.display = 'block';
                    statusText.innerText = "✅ Ultra Reklam Filmi Hazır!";
                    statusText.className = "status";
                    generateBtn.disabled = false;
                    generateBtn.innerText = "✨ Ultra Reklamı Üret";
                    cancelAnimationFrame(animationId);
                };

                mediaRecorder.start();

                let startTime = Date.now();
                const duration = 6000; 
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;

                let particles = [];
                const pCount = partType === 'golden_dust' ? 300 : 150;
                for (let i = 0; i < pCount; i++) {
                    let pColor = "rgba(255,255,255," + Math.random() + ")";
                    let pRadius = Math.random() * 2 + 0.5;
                    let pSpeedX = (Math.random() - 0.5) * 1;
                    let pSpeedY = (Math.random() - 0.5) * 1;

                    if (partType === 'golden_dust') {
                        pColor = `rgba(255, 215, 0, ${Math.random() * 0.8 + 0.2})`;
                        pRadius = Math.random() * 2.5 + 0.5;
                        pSpeedY = -(Math.random() * 1.5 + 0.5);
                    } else if (partType === 'snow') {
                        pColor = `rgba(255, 255, 255, ${Math.random() * 0.8 + 0.2})`;
                        pRadius = Math.random() * 3 + 1;
                        pSpeedY = Math.random() * 2 + 1;
                    } else if (partType === 'confetti') {
                        pColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
                        pRadius = Math.random() * 4 + 2;
                        pSpeedY = Math.random() * 2 + 1;
                    }
                    particles.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, radius: pRadius, speedX: pSpeedX, speedY: pSpeedY, color: pColor, rotation: Math.random() * Math.PI });
                }

                function drawFrame() {
                    const time = Date.now() - startTime;
                    const progress = time / duration;

                    // 1. ARKA PLANLAR
                    if (animType === 'aurora' || animType === 'gradient') {
                        ctx.fillStyle = finalColors[0];
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        const t = time / 1000;
                        for (let i = 0; i < 3; i++) {
                            let x = centerX + Math.cos(t * 0.5 + i * 2) * 400;
                            let y = centerY + Math.sin(t * 0.7 + i * 2) * 300;
                            let radGrad = ctx.createRadialGradient(x, y, 0, x, y, 600);
                            let c = finalColors[i] || finalColors[0];
                            radGrad.addColorStop(0, c + "AA"); 
                            radGrad.addColorStop(1, c + "00"); 
                            ctx.fillStyle = radGrad;
                            ctx.fillRect(0, 0, canvas.width, canvas.height);
                        }
                    } 
                    else if (animType === 'galaxy') {
                        ctx.fillStyle = "#000000"; 
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        let radGrad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 800);
                        radGrad.addColorStop(0, (finalColors[1] || "#333") + "44");
                        radGrad.addColorStop(1, "transparent");
                        ctx.fillStyle = radGrad;
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }
                    else if (animType === 'matrix') {
                        ctx.fillStyle = "#000000";
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.fillStyle = "#00FF41";
                        ctx.font = "20px monospace";
                        for(let i=0; i<canvas.width; i+=30) {
                            for(let j=0; j<canvas.height; j+=30) {
                                if(Math.random() > 0.95) ctx.fillText(Math.random().toString(36).substring(2,3), i, j + (time/10)%30);
                            }
                        }
                    }

                    // 2. PARÇACIKLAR
                    if (partType !== 'none') {
                        particles.forEach(p => {
                            ctx.save();
                            ctx.translate(p.x, p.y);
                            ctx.beginPath();
                            if (partType === 'confetti') {
                                ctx.rotate(time/500 + p.rotation);
                                ctx.fillStyle = p.color;
                                ctx.fillRect(-p.radius, -p.radius, p.radius*2, p.radius*2);
                            } else {
                                ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
                                ctx.fillStyle = p.color;
                                if (partType === 'golden_dust') { ctx.shadowColor = "gold"; ctx.shadowBlur = 10; }
                                ctx.fill();
                            }
                            ctx.restore();
                            p.x += p.speedX; p.y += p.speedY;
                            if (p.x < 0) p.x = canvas.width; if (p.x > canvas.width) p.x = 0;
                            if (p.y < 0) p.y = canvas.height; if (p.y > canvas.height) p.y = 0;
                        });
                    }

                    // 3. ÇOKLU GÖRSELLER (Animasyonlu ve Cam Efektli)
                    let hasContent = false;
                    if (uploadedImages.length > 0) {
                        hasContent = true;
                        const totalImages = uploadedImages.length;
                        const timePerImage = duration / totalImages;
                        const currentIndex = Math.min(Math.floor(time / timePerImage), totalImages - 1);
                        const nextIndex = (currentIndex + 1) % totalImages;
                        const imageProgress = (time % timePerImage) / timePerImage;
                        
                        // Görsel Hareketi Hesaplama
                        let imgScale = 1 + (imageProgress * 0.1); // Ken Burns
                        let imgYOffset = 0;
                        let imgRotation = 0;

                        if (imgAnim === 'float') imgYOffset = Math.sin(time / 300) * 20;
                        if (imgAnim === 'pulse') imgScale = 1 + Math.sin(time / 200) * 0.05;
                        if (imgAnim === 'rotate') imgRotation = Math.sin(time / 500) * 0.05;

                        let alphaCurrent = 1;
                        let alphaNext = 0;
                        if (imageProgress > 0.8 && totalImages > 1) {
                            alphaCurrent = 1 - ((imageProgress - 0.8) / 0.2);
                            alphaNext = (imageProgress - 0.8) / 0.2;
                        }

                        const drawImg = (img, alpha) => {
                            let imgW = img.width, imgH = img.height, maxSize = 450;
                            if (imgW > maxSize || imgH > maxSize) {
                                if (imgW > imgH) { imgH = (maxSize / imgW) * imgH; imgW = maxSize; }
                                else { imgW = (maxSize / imgH) * imgW; imgH = maxSize; }
                            }
                            ctx.save();
                            ctx.globalAlpha = alpha;
                            // Görselin merkeze göre konumu (yOffset ile süzülme ekleniyor)
                            ctx.translate(centerX, centerY + imgYOffset); 
                            ctx.rotate(imgRotation);
                            ctx.scale(imgScale, imgScale);
                            
                            if (imgStyle === 'glass') {
                                // Cam efekti için yuvarlak maske
                                ctx.beginPath();
                                ctx.roundRect(-imgW/2, -imgH/2, imgW, imgH, 30);
                                ctx.clip();
                                
                                // Gölge
                                ctx.shadowColor = "rgba(0,0,0,0.6)"; 
                                ctx.shadowBlur = 40;
                            } else {
                                ctx.shadowColor = "rgba(0,0,0,0.8)"; 
                                ctx.shadowBlur = 30;
                            }

                            // Görseli çiz (Cam için biraz şeffaf yapalım)
                            ctx.globalAlpha = alpha * (imgStyle === 'glass' ? 0.85 : 1);
                            ctx.drawImage(img, -imgW/2, -imgH/2, imgW, imgH);
                            
                            if (imgStyle === 'glass') {
                                // Cam parlaması (Glare)
                                ctx.shadowBlur = 0;
                                let glare = ctx.createLinearGradient(-imgW/2, -imgH/2, imgW/2, imgH/2);
                                glare.addColorStop(0, "rgba(255,255,255,0.4)");
                                glare.addColorStop(0.5, "rgba(255,255,255,0)");
                                glare.addColorStop(1, "rgba(255,255,255,0)");
                                ctx.fillStyle = glare;
                                ctx.fillRect(-imgW/2, -imgH/2, imgW, imgH);
                            }
                            ctx.restore();
                        };

                        drawImg(uploadedImages[currentIndex], alphaCurrent);
                        if (alphaNext > 0) drawImg(uploadedImages[nextIndex], alphaNext);
                    }

                    // 4. YAZI ANİMASYONLARI VE OKUNABİLİRLİK KATMANI
                    let titleYOffset = hasContent ? -230 : -50; // Eğer görsel varsa yazıyı yukarı al
                    let subYOffset = hasContent ? 260 : 40;  // Sloganı aşağı al

                    let currentTextColor = customTextColor;
                    
                    // Animasyon Tipine Göre Ayarlar
                    let textX = 0;
                    let textScale = 1;
                    if (textAnimType === 'color_cycle') {
                        let hue = (time / 10) % 360;
                        currentTextColor = `hsl(${hue}, 100%, 60%)`;
                    } else if (textAnimType === 'slide_in') {
                        if (time < 1000) textX = -800 + (time * 0.8);
                    } else if (textAnimType === 'bounce') {
                        titleYOffset += Math.sin(time / 200) * 15;
                        subYOffset += Math.sin(time / 200) * 15;
                    } else if (textAnimType === 'neon_pulse') {
                        textScale = 1 + Math.sin(time / 150) * 0.05;
                    }

                    // --- OKUNABİLİRLİK PLAKASI (Text Background Plate) ---
                    // Ne olursa olsun yazıyı öne çıkarır
                    ctx.save();
                    ctx.translate(centerX + textX, centerY);
                    
                    // Başlık için arka plan
                    ctx.font = `600 80px 'Montserrat', sans-serif`; // Ölçüyü almak için fontu geçici set et
                    let titleWidth = ctx.measureText(finalTitle).width + 80;
                    ctx.fillStyle = "rgba(0, 0, 0, 0.4)"; // Yarı saydam siyah
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.roundRect(-titleWidth/2, titleYOffset - 60, titleWidth, 110, 20);
                    ctx.fill();

                    // Başlığı Çiz
                    ctx.scale(textScale, textScale);
                    ctx.textAlign = "center"; ctx.textBaseline = "middle"; 
                    ctx.shadowColor = currentTextColor === "#FFFFFF" ? "rgba(0,0,0,0.8)" : currentTextColor; 
                    ctx.shadowBlur = textAnimType === 'neon_pulse' ? 40 : 20; 
                    ctx.fillStyle = currentTextColor;
                    
                    if (textAnimType === 'typewriter') {
                        let charsToShow = Math.floor(time / 50);
                        ctx.fillText(finalTitle.substring(0, charsToShow), 0, titleYOffset);
                    } else {
                        ctx.fillText(finalTitle, 0, titleYOffset);
                    }
                    ctx.restore();

                    // --- SLOGAN ÇİZİMİ ---
                    ctx.save();
                    ctx.translate(centerX + textX, centerY);
                    ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    
                    // Slogan için arka plan
                    ctx.font = "400 32px 'Montserrat', sans-serif";
                    let subWidth = ctx.measureText(finalSubtitle).width + 60;
                    ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
                    ctx.beginPath();
                    ctx.roundRect(-subWidth/2, subYOffset - 25, subWidth, 50, 15);
                    ctx.fill();

                    // Sloganı Çiz
                    ctx.shadowColor = "rgba(0,0,0,0.8)"; ctx.shadowBlur = 10;
                    ctx.fillStyle = textAnimType === 'color_cycle' ? currentTextColor : (finalColors[2] || "#CCCCCC");
                    ctx.globalAlpha = Math.min(1, time / 1000);
                    ctx.fillText(finalSubtitle, 0, subYOffset);
                    ctx.restore();

                    // 5. SİNEMATİK EFEKTLER
                    if (effectType === 'glitch') {
                        if (Math.random() > 0.9) {
                            let offsetX = (Math.random() - 0.5) * 40;
                            let sliceY = Math.random() * canvas.height;
                            let sliceH = Math.random() * 100 + 20;
                            ctx.drawImage(canvas, 0, sliceY, canvas.width, sliceH, offsetX, sliceY, canvas.width, sliceH);
                            ctx.globalCompositeOperation = 'screen';
                            ctx.fillStyle = "rgba(255,0,0,0.2)"; ctx.fillRect(offsetX, 0, canvas.width, canvas.height);
                            ctx.fillStyle = "rgba(0,255,255,0.2)"; ctx.fillRect(-offsetX, 0, canvas.width, canvas.height);
                            ctx.globalCompositeOperation = 'source-over';
                        }
                    } 
                    else if (effectType === 'bloom') {
                        ctx.globalCompositeOperation = 'screen';
                        ctx.globalAlpha = 0.4;
                        ctx.filter = 'blur(15px)';
                        ctx.drawImage(canvas, 0, 0); 
                        ctx.filter = 'none'; ctx.globalAlpha = 1;
                        ctx.globalCompositeOperation = 'source-over';
                    }
                    else if (effectType === 'vignette') {
                        const vignette = ctx.createRadialGradient(centerX, centerY, canvas.height * 0.2, centerX, centerY, canvas.height * 0.9);
                        vignette.addColorStop(0, "rgba(0,0,0,0)");
                        vignette.addColorStop(1, "rgba(0,0,0,0.9)");
                        ctx.fillStyle = vignette;
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    } 
                    else if (effectType === 'grain') {
                        const grainData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        for (let i = 0; i < grainData.data.length; i += 4) {
                            let noise = (Math.random() - 0.5) * 30; 
                            grainData.data[i] += noise; grainData.data[i+1] += noise; grainData.data[i+2] += noise;
                        }
                        ctx.putImageData(grainData, 0, 0);
                    }

                    if (time >= duration) { mediaRecorder.stop(); } 
                    else { animationId = requestAnimationFrame(drawFrame); }
                }

                drawFrame();

            } catch (error) {
                statusText.innerText = "⚠️ Hata: " + error.message;
                generateBtn.disabled = false;
                generateBtn.innerText = "✨ Ultra Reklamı Üret";
            }
        };
    </script>
