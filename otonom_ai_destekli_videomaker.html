<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video ve Resim Destekli Sinema Stüdyosu | AGENT-GELISTIRME</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Montserrat:wght@400;600;800&family=Caveat:wght@700&family=Cinzel:wght@700&family=Inter:wght@400&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background: #0B1120; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { margin: 0; font-family: 'Playfair Display', serif; font-size: 34px; background: linear-gradient(90deg, #38BDF8, #A78BFA, #F472B6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .studio-container { width: 100%; max-width: 1100px; background: #1E293B; border-radius: 20px; padding: 24px; box-shadow: 0 25px 60px rgba(0,0,0,0.6); border: 1px solid #334155; }
        
        .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        .input-group label { font-size: 13px; font-weight: 600; color: #E2E8F0; }
        .input-group input, .input-group textarea { width: 100%; background: #0F172A; border: 1px solid #334155; border-radius: 8px; padding: 12px; color: white; font-family: 'Inter', sans-serif; outline: none; box-sizing: border-box; }
        .input-group textarea { height: 70px; resize: none; }
        .input-group input:focus, .input-group textarea:focus { border-color: #38BDF8; }

        .controls-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 15px; }
        .control-box { background: #0F172A; padding: 10px; border-radius: 10px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 6px; }
        .control-box label { font-size: 10px; color: #94A3B8; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .control-box select { background: #1E293B; color: #E2E8F0; border: 1px solid #334155; padding: 8px; border-radius: 6px; outline: none; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 12px; width: 100%; }
        
        .color-picker-row { display: flex; gap: 10px; align-items: center; justify-content: space-around; padding-top: 5px; }
        .color-picker-group { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .color-picker-group input[type="color"] { -webkit-appearance: none; border: none; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; padding: 0; background: none; }
        .color-picker-group input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        .color-picker-group input[type="color"]::-webkit-color-swatch { border: 2px solid #475569; border-radius: 50%; }

        .upload-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .upload-area { display: flex; flex-direction: column; gap: 10px; background: #0F172A; padding: 15px; border-radius: 10px; border: 1px dashed #475569; }
        .upload-area input { color: #94A3B8; font-size: 13px; cursor: pointer; }
        
        /* Sahne Yöneticisi */
        .scene-manager { background: #0F172A; border-radius: 10px; padding: 15px; border: 1px solid #334155; margin-bottom: 15px; }
        .scene-tabs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid #334155; }
        .scene-tab { background: #1E293B; border: 2px solid #334155; border-radius: 8px; padding: 5px; cursor: pointer; min-width: 80px; text-align: center; transition: all 0.2s; }
        .scene-tab.active { border-color: #38BDF8; box-shadow: 0 0 10px rgba(56,189,248,0.5); }
        .scene-tab span { display: block; font-size: 11px; margin-top: 4px; color: #E2E8F0; }
        
        .scene-editor { display: none; grid-template-columns: 1fr 1fr; gap: 15px; }
        .scene-editor.active { display: grid; }
        
        /* Görsel ve Metin Sürükleme Alanı */
        .interactive-canvas-container { display: flex; flex-direction: column; gap: 10px; }
        .interactive-canvas { 
            position: relative; width: 100%; aspect-ratio: 16/9; background: #000; 
            border: 2px dashed #475569; border-radius: 8px; overflow: hidden; 
            cursor: crosshair; user-select: none;
        }
        .draggable-img, .draggable-video { 
            position: absolute; cursor: grab; transform-origin: center center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); border: 2px solid transparent;
            object-fit: cover;
        }
        .draggable-img.selected, .draggable-video.selected { border-color: #38BDF8; box-shadow: 0 0 15px rgba(56,189,248,0.8); }
        
        .draggable-text {
            position: absolute; cursor: grab; transform-origin: center center;
            padding: 5px 10px; white-space: nowrap; border: 2px dashed transparent;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8); font-weight: bold;
        }
        .draggable-text.selected { border-color: #F472B6; background: rgba(244,114,182,0.1); }

        .slider-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
        .slider-group label { font-size: 11px; color: #94A3B8; display: flex; justify-content: space-between; }
        .slider-group input[type="range"] { width: 100%; accent-color: #38BDF8; }

        .action-row { display: flex; gap: 10px; margin-top: 15px; }
        .action-row button { flex: 1; background: linear-gradient(135deg, #38BDF8, #818CF8, #F472B6); background-size: 200% 200%; color: white; border: none; padding: 16px; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s; animation: gradientBG 3s infinite; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .action-row button:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(56,189,248,0.4); }
        .action-row button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; animation: none; background: #475569; }

        /* Video Oynatıcı ve Canvas Alanı */
        .media-area { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; position: relative; display: flex; justify-content: center; align-items: center; margin-bottom: 15px; margin-top: 20px; border: 2px solid #334155; }
        canvas { width: 100%; height: 100%; display: none; }
        video { width: 100%; height: 100%; display: none; object-fit: contain; background: #000; }
        
        .status { text-align: center; font-size: 13px; color: #94A3B8; margin-bottom: 10px; font-weight: 600; }
        .status.recording { color: #F87171; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .download-area { display: none; text-align: center; margin-top: 10px; }
        .download-area a { display: inline-block; background: #10B981; color: white; padding: 14px 28px; text-decoration: none; border-radius: 10px; font-weight: 700; font-size: 15px; margin-top: 10px;}
        
        @media (max-width: 800px) { .controls-grid, .upload-row { grid-template-columns: repeat(2, 1fr); } .scene-editor.active { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="header">
        <h1>Video ve Resim Destekli Stüdyo</h1>
        <p>Kendi videolarınızı yükleyin, efektlerle süsleyin.</p>
    </div>

    <div class="studio-container">
        
        <div class="input-group">
            <label for="videoPrompt">Senaryo (Yapay Zeka her şeyi buna göre seçecek):</label>
            <textarea id="videoPrompt" placeholder="Örnek: Kırmızı ruj reklamı. Veya: Lüks bir araba tanıtımı."></textarea>
        </div>

        <div class="controls-grid">
            <div class="control-box">
                <label>🎨 Renk Teması</label>
                <select id="colorPalette">
                    <option value="auto" selected>✨ Yapay Zeka Karar Versin</option>
                    <option value="luxury">Altın & Lüks</option>
                    <option value="cyberpunk">Cyberpunk</option>
                    <option value="pastel">Pastel</option>
                    <option value="sunset">Gün Batımı</option>
                    <option value="custom">Özel Renk</option>
                </select>
                <div class="color-picker-row" id="customColorContainer" style="display: none;">
                    <input type="color" id="color1" value="#FF007F">
                    <input type="color" id="color2" value="#00F0FF">
                </div>
            </div>
            <div class="control-box">
                <label>🌌 Arka Plan</label>
                <select id="bgAnimation">
                    <option value="auto" selected>✨ Yapay Zeka Karar Versin</option>
                    <option value="aurora">Aurora</option>
                    <option value="galaxy">Galaksi</option>
                    <option value="matrix">Matrix</option>
                    <option value="waves">Dalgalar</option>
                    <option value="tunnel">Tünel</option>
                    <option value="bokeh">Bokeh</option>
                </select>
                <label style="margin-top: 4px;">✨ Parçacık</label>
                <select id="particleEffect">
                    <option value="auto" selected>✨ Yapay Zeka Karar Versin</option>
                    <option value="golden_dust">Altın Tozu</option>
                    <option value="none">Yok</option>
                    <option value="snow">Kar</option>
                    <option value="confetti">Konfeti</option>
                    <option value="fireflies">Ateş Böcekleri</option>
                </select>
            </div>
            <div class="control-box">
                <label>🖼️ Görsel Stili</label>
                <select id="imageStyle">
                    <option value="auto" selected>✨ Yapay Zeka Karar Versin</option>
                    <option value="glass">Cam</option>
                    <option value="normal">Normal</option>
                    <option value="circle">Yuvarlak</option>
                    <option value="polaroid">Polaroid</option>
                    <option value="neon_border">Neon Çerçeve</option>
                </select>
                <label style="margin-top: 4px;">🚀 Giriş Animasyonu</label>
                <select id="entryAnimation">
                    <option value="auto" selected>✨ Yapay Zeka Karar Versin</option>
                    <option value="slide_left">Soldan Gel</option>
                    <option value="slide_right">Sağdan Gel</option>
                    <option value="drop_down">Yukarıdan Düş</option>
                    <option value="fly_up">Aşağıdan Yüksel</option>
                    <option value="zoom_in">İçeriden Büyü</option>
                    <option value="orbit">Yörünge Çiz</option>
                </select>
            </div>
            <div class="control-box">
                <label>🔠 Yazı Stili</label>
                <select id="textStyle">
                    <option value="auto" selected>✨ Yapay Zeka Karar Versin</option>
                    <option value="modern">Modern</option>
                    <option value="classic">Klasik</option>
                    <option value="elegant">Lüks</option>
                    <option value="impact">Vurucu</option>
                    <option value="handwriting">El Yazısı</option>
                    <option value="mono">Teknik</option>
                </select>
                <label style="margin-top: 4px;">🎬 Yazı Animasyonu</label>
                <select id="textAnimation">
                    <option value="auto" selected>✨ Yapay Zeka Karar Versin</option>
                    <option value="typewriter">Daktilo</option>
                    <option value="slide_in">Yandan Kayma</option>
                    <option value="neon_pulse">Neon Nabız</option>
                    <option value="bounce">Zıplayan</option>
                    <option value="color_cycle">Renk Değiştiren</option>
                    <option value="fade_up">Aşağıdan Süzülme</option>
                </select>
            </div>
        </div>

        <div class="controls-grid" style="grid-template-columns: 1fr 1fr 1fr 1fr;">
            <div class="control-box">
                <label>🎥 Görüntü Efektleri</label>
                <select id="visualEffect">
                    <option value="auto" selected>✨ Yapay Zeka Karar Versin</option>
                    <option value="none">Efekt Yok</option>
                    <option value="bloom">Bloom (Işıma)</option>
                    <option value="glitch">Glitch</option>
                    <option value="vignette">Vignette</option>
                    <option value="grain">Film Greni</option>
                    <option value="scanlines">CRT Çizgileri</option>
                </select>
            </div>
            <div class="control-box">
                <label>🔄 Sahne Geçişi</label>
                <select id="transitionEffect">
                    <option value="auto" selected>✨ Yapay Zeka Karar Versin</option>
                    <option value="none">Ani Geçiş</option>
                    <option value="fade">Karartma (Fade)</option>
                    <option value="slide_left">Sola Kaydır</option>
                    <option value="slide_right">Sağa Kaydır</option>
                    <option value="zoom">Yakınlaş</option>
                    <option value="wipe">Perde (Wipe)</option>
                </select>
            </div>
            <div class="control-box">
                <label>⏱️ Video Hızı (Süre)</label>
                <select id="videoDuration">
                    <option value="auto" selected>✨ Yapay Zeka Karar Versin</option>
                    <option value="4000">Hızlı (4 Saniye)</option>
                    <option value="6000">Normal (6 Saniye)</option>
                    <option value="10000">Yavaş (10 Saniye)</option>
                    <option value="15000">Çok Yavaş (15 Saniye)</option>
                </select>
            </div>
            <div class="control-box">
                <label>🎵 Arka Plan Müziği</label>
                <input type="file" id="audioUpload" accept="audio/*" style="background: transparent; border: none; color: #94A3B8; font-size: 11px; padding: 8px 0;">
                <div id="audioStatus" style="font-size: 11px; color: #10B981; display: none;">✅ Yüklendi</div>
            </div>
        </div>

        <div class="upload-row">
            <div class="upload-area">
                <label style="font-size: 13px; font-weight: 600; color: #E2E8F0;">Resim Yükle (Sahne):</label>
                <input type="file" id="imageUpload" accept="image/*" multiple>
            </div>
            <div class="upload-area">
                <label style="font-size: 13px; font-weight: 600; color: #E2E8F0;">Video Yükle (Sahne):</label>
                <input type="file" id="videoUpload" accept="video/*" multiple>
            </div>
            <div class="upload-area" style="justify-content: center; border-style: solid; border-color: #1E293B; background: #0F172A;">
                <span style="font-size: 12px; color: #94A3B8; text-align: center;">Yüklediğiniz her dosya (resim veya video) yeni bir sahne oluşturur.</span>
            </div>
        </div>

        <div class="scene-manager" id="sceneManager" style="display: none;">
            <h3 style="margin: 0 0 10px 0; font-size: 14px; color: #38BDF8;">Sahne Yöneticisi</h3>
            <div class="scene-tabs" id="sceneTabs"></div>
            
            <div class="scene-editor" id="sceneEditor">
                <div class="interactive-canvas-container">
                    <label style="font-size: 12px; color: #94A3B8; font-weight: 600;">Canlı Önizleme (Görselleri ve yazıları sürükleyin):</label>
                    <div class="interactive-canvas" id="interactiveCanvas"></div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;">
                        <div class="input-group" style="margin: 0;">
                            <label style="font-size: 11px;">Sahne Başlığı (İsteğe Bağlı)</label>
                            <input type="text" id="sceneTitleInput" placeholder="Yazmazsanız çıkmaz...">
                        </div>
                        <div class="input-group" style="margin: 0;">
                            <label style="font-size: 11px;">Sahne Sloganı (İsteğe Bağlı)</label>
                            <input type="text" id="sceneSloganInput" placeholder="Yazmazsanız çıkmaz...">
                        </div>
                    </div>
                </div>
                
                <div id="imageTransformControls" style="display: none; background: #1E293B; padding: 15px; border-radius: 8px;">
                    <label style="font-size: 13px; color: #F472B6; font-weight: 600; display: block; margin-bottom: 10px;" id="selectedImageLabel">Görsel ve Yazı Boyut Ayarları</label>
                    
                    <div class="slider-group">
                        <label>Görsel Boyutu <span id="valScale">1</span></label>
                        <input type="range" id="imgScale" min="0.1" max="3" step="0.05" value="1" oninput="updateImageProperty('scale', this.value)">
                    </div>
                    <div class="slider-group">
                        <label>Görsel Açısı <span id="valRot">0</span></label>
                        <input type="range" id="imgRot" min="-180" max="180" value="0" oninput="updateImageProperty('rotation', this.value)">
                    </div>
                    
                    <div class="slider-group" style="margin-top: 15px; border-top: 1px solid #334155; padding-top: 10px;">
                        <label style="color: #38BDF8;">Başlık Boyutu <span id="valTitleSize">80</span></label>
                        <input type="range" id="titleSize" min="20" max="150" value="80" oninput="updateTextSize('titleSize', this.value)">
                    </div>
                    <div class="slider-group">
                        <label style="color: #38BDF8;">Slogan Boyutu <span id="valSubSize">32</span></label>
                        <input type="range" id="subtitleSize" min="10" max="100" value="32" oninput="updateTextSize('subtitleSize', this.value)">
                    </div>
                </div>
            </div>
        </div>

        <div class="action-row">
            <button id="generateBtn" onclick="generateVideo()" disabled>Yapay Zeka Yükleniyor...</button>
        </div>

        <div class="media-area" id="mediaContainer">
            <span id="mediaPlaceholder" style="color: #64748B; font-weight: 300;">Reklamınız Burada Oluşacak</span>
            <canvas id="videoCanvas" width="1280" height="720"></canvas>
            <video id="videoPlayer" controls></video>
        </div>

        <div class="status" id="statusText">Model indiriliyor, lütfen bekleyin...</div>

        <div class="download-area" id="downloadArea">
            <a id="downloadLink" download="pro_reklam.webm">📥 Reklam Filmini İndir (.webm)</a>
        </div>
    </div>

    <script type="module">
        import * as webllm from "https://esm.run/@mlc-ai/web-llm";

        let engine = null;
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d');
        
        const sceneCanvas = document.createElement('canvas');
        sceneCanvas.width = canvas.width; sceneCanvas.height = canvas.height;
        const sceneCtx = sceneCanvas.getContext('2d');
        
        const prevCanvas = document.createElement('canvas');
        prevCanvas.width = canvas.width; prevCanvas.height = canvas.height;
        const prevCtx = prevCanvas.getContext('2d');

        const statusText = document.getElementById('statusText');
        const generateBtn = document.getElementById('generateBtn');
        const downloadArea = document.getElementById('downloadArea');
        const downloadLink = document.getElementById('downloadLink');
        const mediaPlaceholder = document.getElementById('mediaPlaceholder');
        const videoPlayer = document.getElementById('videoPlayer');
        
        // UI Elements
        const colorPalette = document.getElementById('colorPalette');
        const bgAnimation = document.getElementById('bgAnimation');
        const particleEffect = document.getElementById('particleEffect');
        const imageStyle = document.getElementById('imageStyle');
        const entryAnimation = document.getElementById('entryAnimation');
        const textStyle = document.getElementById('textStyle');
        const textAnimation = document.getElementById('textAnimation');
        const visualEffect = document.getElementById('visualEffect');
        const transitionEffect = document.getElementById('transitionEffect');
        const videoDurationSelect = document.getElementById('videoDuration');
        
        const sceneManager = document.getElementById('sceneManager');
        const sceneTabs = document.getElementById('sceneTabs');
        const sceneEditor = document.getElementById('sceneEditor');
        const interactiveCanvas = document.getElementById('interactiveCanvas');
        const imageTransformControls = document.getElementById('imageTransformControls');
        const sceneTitleInput = document.getElementById('sceneTitleInput');
        const sceneSloganInput = document.getElementById('sceneSloganInput');

        const audioUpload = document.getElementById('audioUpload');
        const audioStatus = document.getElementById('audioStatus');

        let mediaRecorder, recordedChunks = [], animationId;
        let scenes = []; 
        let activeSceneIndex = -1;
        let activeImageIndex = -1;
        
        let audioCtx = null;
        let audioElement = null;

        audioUpload.addEventListener('change', function(e) {
            if (e.target.files.length > 0) audioStatus.style.display = 'block';
            else audioStatus.style.display = 'none';
        });

        function hexToRgba(hex, alpha) {
            if (!hex) return `rgba(17, 24, 39, ${alpha})`;
            let c = hex.replace('#', '');
            if (c.length === 3) c = c.split('').map(char => char + char).join('');
            if (c.length !== 6) return `rgba(17, 24, 39, ${alpha})`;
            const r = parseInt(c.substring(0, 2), 16);
            const g = parseInt(c.substring(2, 4), 16);
            const b = parseInt(c.substring(4, 6), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        document.getElementById('imageUpload').addEventListener('change', async function(e) {
            const files = Array.from(e.target.files);
            for (const file of files) {
                const img = await loadMediaFile(file, 'image');
                scenes.push({
                    id: Date.now() + Math.random(),
                    media: [{ mediaObj: img, type: 'image', x: 0, y: 0, scale: 1, rotation: 0, id: Date.now() + Math.random() }],
                    settings: getDefaultSceneSettings()
                });
            }
            updateSceneUI();
            if (activeSceneIndex === -1 && scenes.length > 0) selectScene(0);
        });

        document.getElementById('videoUpload').addEventListener('change', async function(e) {
            const files = Array.from(e.target.files);
            for (const file of files) {
                const video = await loadMediaFile(file, 'video');
                scenes.push({
                    id: Date.now() + Math.random(),
                    media: [{ mediaObj: video, type: 'video', x: 0, y: 0, scale: 1, rotation: 0, id: Date.now() + Math.random() }],
                    settings: getDefaultSceneSettings()
                });
            }
            updateSceneUI();
            if (activeSceneIndex === -1 && scenes.length > 0) selectScene(0);
        });

        function loadMediaFile(file, type) {
            return new Promise((resolve) => {
                const url = URL.createObjectURL(file);
                if (type === 'image') {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.src = url;
                } else {
                    const video = document.createElement('video');
                    video.src = url;
                    video.muted = true; 
                    video.playsInline = true;
                    video.loop = true; 
                    video.onloadedmetadata = () => {
                        // İlk kareyi yüklemek için oynat ve duraklat (Bazı tarayıcılarda siyah ekran sorununu çözer)
                        video.play().then(() => video.pause()).catch(() => {});
                        resolve(video);
                    };
                    video.load(); 
                }
            });
        }

        function getDefaultSceneSettings() {
            return { 
                colorPalette: 'auto', bgAnimation: 'auto', particleEffect: 'auto', 
                imageStyle: 'auto', entryAnimation: 'auto', textStyle: 'auto', 
                textAnimation: 'auto', visualEffect: 'auto', transitionEffect: 'auto',
                title: "", titleX: 0, titleY: -230, titleSize: 80, // Varsayılan metinler BOŞ
                subtitle: "", subtitleX: 0, subtitleY: 260, subtitleSize: 32, // Varsayılan metinler BOŞ
                titleColor: "#FFFFFF", subtitleColor: "#CCCCCC",
                colors: ["#111827", "#374151", "#1F2937"]
            };
        }

        function updateSceneUI() {
            if (scenes.length === 0) { sceneManager.style.display = 'none'; return; }
            sceneManager.style.display = 'block';
            
            sceneTabs.innerHTML = '';
            scenes.forEach((scene, index) => {
                const tab = document.createElement('div');
                tab.className = `scene-tab ${index === activeSceneIndex ? 'active' : ''}`;
                
                const firstMedia = scene.media[0];
                if(firstMedia.type === 'image') {
                    tab.innerHTML = `<img src="${firstMedia.mediaObj.src}" style="width: 60px; height: 40px; object-fit: cover; border-radius: 4px;"><span>Sahne ${index + 1}</span>`;
                } else {
                    tab.innerHTML = `<div style="width: 60px; height: 40px; background: #000; display: flex; justify-content: center; align-items: center; border-radius: 4px; font-size: 20px;">🎬</div><span>Sahne ${index + 1}</span>`;
                }
                
                tab.onclick = () => selectScene(index);

                sceneEditor.classList.add('active');

            } else {
                sceneEditor.classList.remove('active');
            }
        }

        function selectScene(index) {

        window.updateTextSize = function(prop, value) {
            if (activeSceneIndex === -1) return;
            value = parseFloat(value);
            scenes[activeSceneIndex].settings[prop] = value;
            
            if (prop === 'titleSize') document.getElementById('valTitleSize').innerText = value;
            if (prop === 'subtitleSize') document.getElementById('valSubSize').innerText = value;
            
            renderInteractiveCanvas();
        }

        function renderInteractiveCanvas() {
            interactiveCanvas.innerHTML = ''; 
            const scene = scenes[activeSceneIndex];
            const uiScaleFactor = interactiveCanvas.clientWidth / 1280; 
            
            scene.media.forEach((mediaData, index) => {
                let el;
                let mediaW = mediaData.type === 'image' ? mediaData.mediaObj.width : mediaData.mediaObj.videoWidth;
                let mediaH = mediaData.type === 'image' ? mediaData.mediaObj.height : mediaData.mediaObj.videoHeight;

                if (mediaData.type === 'image') {
                    el = document.createElement('img');
                    el.src = mediaData.mediaObj.src;
                    el.className = `draggable-img ${index === activeImageIndex ? 'selected' : ''}`;
                } else {
                    el = document.createElement('video');
                    el.src = mediaData.mediaObj.src;
                    el.muted = true; el.loop = true; el.playsInline = true;
                    el.play().catch(e=>console.log(e)); 
                    el.className = `draggable-video ${index === activeImageIndex ? 'selected' : ''}`;
                }
                
                el.dataset.index = index;
                
                let maxW = 400;
                if (mediaW > maxW) { mediaH = (maxW / mediaW) * mediaH; mediaW = maxW; }

                const finalW = mediaW * mediaData.scale * uiScaleFactor;
                const finalH = mediaH * mediaData.scale * uiScaleFactor;

                el.style.width = `${finalW}px`;
                el.style.height = `${finalH}px`;
                el.style.left = `calc(50% + ${mediaData.x * uiScaleFactor}px - ${finalW/2}px)`;
                el.style.top = `calc(50% + ${mediaData.y * uiScaleFactor}px - ${finalH/2}px)`;
                el.style.transform = `rotate(${mediaData.rotation}deg)`;

                el.addEventListener('mousedown', (e) => startDrag(e, 'media', index));
                interactiveCanvas.appendChild(el);
            });

            // SADECE YAZI VARSA EKRANA EKLE
            if (scene.settings.title.trim() !== "") {
                const titleEl = document.createElement('div');
                titleEl.className = 'draggable-text';
                titleEl.innerText = scene.settings.title;
                titleEl.style.left = `calc(50% + ${scene.settings.titleX * uiScaleFactor}px)`;
                titleEl.style.top = `calc(50% + ${scene.settings.titleY * uiScaleFactor}px)`;
                titleEl.style.transform = `translate(-50%, -50%)`;
                titleEl.style.color = scene.settings.titleColor;
                titleEl.style.fontSize = `${scene.settings.titleSize * uiScaleFactor}px`; 
                titleEl.addEventListener('mousedown', (e) => startDrag(e, 'title', 0));
                interactiveCanvas.appendChild(titleEl);
            }

            // SADECE SLOGAN VARSA EKRANA EKLE
            if (scene.settings.subtitle.trim() !== "") {
                const subEl = document.createElement('div');
                subEl.className = 'draggable-text';
                subEl.innerText = scene.settings.subtitle;
                subEl.style.left = `calc(50% + ${scene.settings.subtitleX * uiScaleFactor}px)`;
                subEl.style.top = `calc(50% + ${scene.settings.subtitleY * uiScaleFactor}px)`;
                subEl.style.transform = `translate(-50%, -50%)`;
                subEl.style.color = scene.settings.subtitleColor;
                subEl.style.fontSize = `${scene.settings.subtitleSize * uiScaleFactor}px`; 
                subEl.addEventListener('mousedown', (e) => startDrag(e, 'subtitle', 0));
                interactiveCanvas.appendChild(subEl);
            }
            
            updateTransformControls();
        }

        function updateTransformControls() {
            if (activeImageIndex === -1 || activeSceneIndex === -1) {
                imageTransformControls.style.display = 'none'; return;
            }
            const mediaData = scenes[activeSceneIndex].media[activeImageIndex];
            if(!mediaData) return;

            imageTransformControls.style.display = 'block';
            document.getElementById('selectedImageLabel').innerText = `Görsel ve Yazı Boyut Ayarları`;
            document.getElementById('imgScale').value = mediaData.scale;
            document.getElementById('valScale').innerText = mediaData.scale.toFixed(2);
            document.getElementById('imgRot').value = mediaData.rotation;
            document.getElementById('valRot').innerText = mediaData.rotation;
        }

        window.updateImageProperty = function(prop, value) {
            if (activeSceneIndex === -1 || activeImageIndex === -1) return;
            scenes[activeSceneIndex].media[activeImageIndex][prop] = parseFloat(value);
            renderInteractiveCanvas(); 
        }

        let isDragging = false;
        let startX = 0, startY = 0;
        let initialX = 0, initialY = 0;
        let dragType = "";
        let dragIndex = -1;

        function startDrag(e, type, index) {
            e.preventDefault();
            isDragging = true;
            dragType = type;
            dragIndex = index;

            document.querySelectorAll('.draggable-img, .draggable-video').forEach(el => el.classList.remove('selected'));
            document.querySelectorAll('.draggable-text').forEach(el => el.classList.remove('selected'));
            
            if (type === 'media') {
                activeImageIndex = index;
                e.target.classList.add('selected');
                updateTransformControls();
                initialX = scenes[activeSceneIndex].media[index].x;
                initialY = scenes[activeSceneIndex].media[index].y;
            } else {
                e.target.classList.add('selected');
                imageTransformControls.style.display = 'block';
                if (type === 'title') {
                    initialX = scenes[activeSceneIndex].settings.titleX;
                    initialY = scenes[activeSceneIndex].settings.titleY;
                } else {
                    initialX = scenes[activeSceneIndex].settings.subtitleX;
                    initialY = scenes[activeSceneIndex].settings.subtitleY;
                }
            }

            startX = e.clientX;
            startY = e.clientY;

            document.addEventListener('mousemove', onDrag);
            document.addEventListener('mouseup', stopDrag);
        }

        function onDrag(e) {
            if (!isDragging) return;
            const deltaX = e.clientX - startX;
            const deltaY = e.clientY - startY;
            const uiScaleFactor = 1280 / interactiveCanvas.clientWidth;

            const newX = initialX + (deltaX * uiScaleFactor);
            const newY = initialY + (deltaY * uiScaleFactor);

            if (dragType === 'media') {
                scenes[activeSceneIndex].media[dragIndex].x = newX;
                scenes[activeSceneIndex].media[dragIndex].y = newY;
                
                const el = document.querySelector(`.draggable-img[data-index="${dragIndex}"], .draggable-video[data-index="${dragIndex}"]`);
                if(el) {
                    let mediaData = scenes[activeSceneIndex].media[dragIndex];
                    let mediaW = mediaData.type === 'image' ? mediaData.mediaObj.width : mediaData.mediaObj.videoWidth;
                    let maxW = 400;
                    if (mediaW > maxW) mediaW = maxW;
                    const uiScale = interactiveCanvas.clientWidth / 1280;
                    const finalW = mediaW * mediaData.scale * uiScale;
                    
                    el.style.left = `calc(50% + ${newX * uiScale}px - ${finalW/2}px)`;
                    el.style.top = `calc(50% + ${newY * uiScale}px - ${finalW/2}px)`; 
                }
            } else if (dragType === 'title') {
                scenes[activeSceneIndex].settings.titleX = newX;
                scenes[activeSceneIndex].settings.titleY = newY;
                const uiScale = interactiveCanvas.clientWidth / 1280;
                e.target.style.left = `calc(50% + ${newX * uiScale}px)`;
                e.target.style.top = `calc(50% + ${newY * uiScale}px)`;
            } else if (dragType === 'subtitle') {
                scenes[activeSceneIndex].settings.subtitleX = newX;
                scenes[activeSceneIndex].settings.subtitleY = newY;
                const uiScale = interactiveCanvas.clientWidth / 1280;
                e.target.style.left = `calc(50% + ${newX * uiScale}px)`;
                e.target.style.top = `calc(50% + ${newY * uiScale}px)`;
            }
        }

        function stopDrag() {
            isDragging = false;
            document.removeEventListener('mousemove', onDrag);
            document.removeEventListener('mouseup', stopDrag);
        }

        async function initAI() {
            try {
                const selectedModel = "Llama-3.2-1B-Instruct-q4f32_1-MLC";
                engine = await webllm.CreateMLCEngine(selectedModel, {
                    initProgressCallback: (progress) => { statusText.innerText = progress.text; }
                });
                statusText.innerText = "✅ Sistem Hazır!";
                statusText.style.color = "#10B981";
                generateBtn.disabled = false;
                generateBtn.innerText = "✨ Otonom Reklamı Üret";
            } catch (e) {
                statusText.innerText = "⚠️ Model hatası: " + e.message;
            }
        }
        initAI();

        function extractJSON(text) {
            try {
                let clean = text.replace(/```json/gi, '').replace(/```/g, '').replace(/\/\/.*$/gm, '').trim();
                const match = clean.match(/\{[\s\S]*\}/);
                if (match) return JSON.parse(match[0].replace(/'/g, '"').replace(/,\s*}/g, '}'));
            } catch (err) {}
            return null;
        }

        function getLocalPromptDesign(prompt) {
            const p = prompt.toLowerCase();
            let design = { colors: ["#111827", "#374151", "#1F2937"], textColor: "#FFFFFF", bgAnimation: "gradient", particleEffect: "none", imageStyle: "glass", entryAnimation: "zoom_in", textStyle: "modern", textAnimation: "fade_up", visualEffect: "none", transitionEffect: "fade", duration: 6000 };
            
            if (p.includes('ruj') || p.includes('aşk') || p.includes('güzellik') || p.includes('kırmızı')) { design.colors = ["#4C0519", "#BE123C", "#FDA4AF"]; design.textColor = "#FFF1F2"; design.bgAnimation = "aurora"; design.particleEffect = "golden_dust"; design.imageStyle = "glass"; design.entryAnimation = "orbit"; design.textStyle = "elegant"; design.textAnimation = "neon_pulse"; design.visualEffect = "bloom"; design.transitionEffect = "fade"; design.duration = 8000; }
            else if (p.includes('doğa') || p.includes('ağaç') || p.includes('yeşil') || p.includes('orman')) { design.colors = ["#064E3B", "#10B981", "#A7F3D0"]; design.textColor = "#ECFDF5"; design.bgAnimation = "bokeh"; design.particleEffect = "fireflies"; design.imageStyle = "circle"; design.entryAnimation = "fly_up"; design.textStyle = "classic"; design.textAnimation = "fade_up"; design.visualEffect = "lightleak"; design.transitionEffect = "zoom"; design.duration = 10000; }
            else if (p.includes('teknoloji') || p.includes('neon') || p.includes('uzay') || p.includes('roket')) { design.colors = ["#020617", "#1D4ED8", "#06B6D4"]; design.textColor = "#E0F2FE"; design.bgAnimation = "tunnel"; design.particleEffect = "none"; design.imageStyle = "neon_border"; design.entryAnimation = "slide_left"; design.textStyle = "mono"; design.textAnimation = "shake"; design.visualEffect = "glitch"; design.transitionEffect = "slide_right"; design.duration = 4000; }
            return design;
        }

        async function getGlobalDesignFromAI(prompt) {
            const messages = [
                { role: "system", content: `You are an expert AI Art Director. Output ONLY valid JSON.
                    Allowed values:
                    - bgAnimation: [aurora, galaxy, cyber, matrix, waves, tunnel, bokeh, gradient]
                    - particleEffect: [golden_dust, none, snow, confetti, fireflies]
                    - imageStyle: [glass, normal, circle, polaroid, neon_border, shadow]
                    - entryAnimation: [slide_left, slide_right, drop_down, fly_up, zoom_in, orbit]
                    - textStyle: [modern, classic, elegant, impact, handwriting, mono]
                    - textAnimation: [typewriter, slide_in, neon_pulse, bounce, color_cycle, fade_up, zoom_in, shake, split]
                    - visualEffect: [none, bloom, glitch, vignette, grain, scanlines, chromatic, lightleak, retro]
                    - transitionEffect: [none, fade, slide_left, slide_right, zoom, wipe]
                    - duration: [4000, 6000, 10000, 15000]
                    JSON: {"colors": ["#hex1", "#hex2", "#hex3"], "textColor": "#hex", "bgAnimation": "...", "particleEffect": "...", "imageStyle": "...", "entryAnimation": "...", "textStyle": "...", "textAnimation": "...", "visualEffect": "...", "transitionEffect": "...", "duration": 6000}` },
                { role: "user", content: `Design for: "${prompt}"` }
            ];
            try {
                const reply = await engine.chat.completions.create({ messages, temperature: 0.2, max_tokens: 250 });
                return extractJSON(reply.choices[0].message.content);
            } catch (e) { return null; }
        }

        function getFontFamily(style) {
            if (style === 'classic') return "'Playfair Display', serif";
            if (style === 'elegant') return "'Cinzel', serif";
            if (style === 'impact') return "Impact, 'Arial Black', sans-serif";
            if (style === 'handwriting') return "'Caveat', cursive";
            if (style === 'mono') return "'Courier Prime', monospace";
            return "'Montserrat', sans-serif";
        }

        function fitTextSize(text, desiredSize, maxWidth, context, fontFamily) {
            let size = desiredSize;
            context.font = `600 ${size}px ${fontFamily}`;
            let width = context.measureText(text).width;
            if (width > maxWidth) { size = size * (maxWidth / width); }
            return size;
        }

        async function applyAIDesignToScenes(prompt) {
            const aiDesign = await getGlobalDesignFromAI(prompt) || getLocalPromptDesign(prompt);
            
            scenes.forEach(scene => {
                if (!Array.isArray(scene.settings.colors) || scene.settings.colors.length < 3) {
                    scene.settings.colors = aiDesign.colors || ["#111827", "#374151", "#1F2937"];
                }
                
                // SADECE KULLANICI YAZI YAZDIYSA RENGİNİ AYARLA
                if (scene.settings.title.trim() !== "" && scene.settings.titleColor === "#FFFFFF") {
                    scene.settings.titleColor = aiDesign.textColor || "#FFFFFF";
                }
                if (scene.settings.subtitle.trim() !== "" && scene.settings.subtitleColor === "#CCCCCC") {
                    scene.settings.subtitleColor = (aiDesign.colors && aiDesign.colors[2]) ? aiDesign.colors[2] : "#CCCCCC";
                }

                scene.settings.bgAnimation = bgAnimation.value === 'auto' ? (aiDesign.bgAnimation || 'aurora') : bgAnimation.value;
                scene.settings.particleEffect = particleEffect.value === 'auto' ? (aiDesign.particleEffect || 'none') : particleEffect.value;
                scene.settings.imageStyle = imageStyle.value === 'auto' ? (aiDesign.imageStyle || 'glass') : imageStyle.value;
                scene.settings.entryAnimation = entryAnimation.value === 'auto' ? (aiDesign.entryAnimation || 'zoom_in') : entryAnimation.value;
                scene.settings.textStyle = textStyle.value === 'auto' ? (aiDesign.textStyle || 'modern') : textStyle.value;
                scene.settings.textAnimation = textAnimation.value === 'auto' ? (aiDesign.textAnimation || 'fade_up') : textAnimation.value;
                scene.settings.visualEffect = visualEffect.value === 'auto' ? (aiDesign.visualEffect || 'none') : visualEffect.value;
                scene.settings.transitionEffect = transitionEffect.value === 'auto' ? (aiDesign.transitionEffect || 'fade') : transitionEffect.value;
            });
        }

        function easeOutCubic(x) {
            return 1 - Math.pow(1 - x, 3);
        }

        function renderSceneToCtx(targetCtx, sceneIndex, sceneTime, sceneDuration, globalTime) {
            const s = scenes[sceneIndex].settings;
            const selectedFont = getFontFamily(s.textStyle);
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            // Arka Plan
            if (s.bgAnimation === 'aurora' || s.bgAnimation === 'gradient') {
                targetCtx.fillStyle = "#111827"; targetCtx.fillRect(0, 0, canvas.width, canvas.height);
                const t = globalTime / 1000;
                for (let i = 0; i < 3; i++) {
                    let x = centerX + Math.cos(t * 0.5 + i * 2) * 400;
                    let y = centerY + Math.sin(t * 0.7 + i * 2) * 300;
                    let radGrad = targetCtx.createRadialGradient(x, y, 0, x, y, 600);
                    let c = (s.colors && s.colors[i]) ? s.colors[i] : "#111827";
                    radGrad.addColorStop(0, hexToRgba(c, 0.66)); 
                    radGrad.addColorStop(1, hexToRgba(c, 0)); 
                    targetCtx.fillStyle = radGrad; targetCtx.fillRect(0, 0, canvas.width, canvas.height);
                }
            } else if (s.bgAnimation === 'galaxy') {
                targetCtx.fillStyle = "#000000"; targetCtx.fillRect(0, 0, canvas.width, canvas.height);
                let radGrad = targetCtx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 800);
                radGrad.addColorStop(0, "rgba(51, 51, 51, 0.3)"); radGrad.addColorStop(1, "transparent");
                targetCtx.fillStyle = radGrad; targetCtx.fillRect(0, 0, canvas.width, canvas.height);
            } else if (s.bgAnimation === 'matrix') {
                targetCtx.fillStyle = "#000000"; targetCtx.fillRect(0, 0, canvas.width, canvas.height);
                targetCtx.fillStyle = "#00FF41"; targetCtx.font = "20px monospace";
                for(let i=0; i<canvas.width; i+=30) { for(let j=0; j<canvas.height; j+=30) { if(Math.random() > 0.95) targetCtx.fillText(Math.random().toString(36).substring(2,3), i, j + (globalTime/10)%30); } }
            } else {
                targetCtx.fillStyle = "#111827"; targetCtx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // Parçacıklar
            if (s.particleEffect !== 'none') {
                let pCount = s.particleEffect === 'golden_dust' ? 100 : 50;
                for (let i = 0; i < pCount; i++) {
                    let pX = (Math.random() * canvas.width + globalTime * 0.1) % canvas.width;
                    let pY = (Math.random() * canvas.height - globalTime * 0.2) % canvas.height;
                    if(pY < 0) pY += canvas.height;
                    targetCtx.beginPath(); let pRadius = Math.random() * 2 + 1;
                    if(s.particleEffect === 'golden_dust') { targetCtx.fillStyle = `rgba(255, 215, 0, 0.8)`; targetCtx.shadowColor = "gold"; targetCtx.shadowBlur = 10; }
                    else if(s.particleEffect === 'snow') { targetCtx.fillStyle = `rgba(255, 255, 255, 0.8)`; }
                    else if(s.particleEffect === 'fireflies') { targetCtx.fillStyle = `rgba(200, 255, 100, 0.8)`; targetCtx.shadowColor = "yellow"; targetCtx.shadowBlur = 15; }
                    targetCtx.arc(pX, pY, pRadius, 0, Math.PI*2); targetCtx.fill(); targetCtx.shadowBlur = 0;
                }
            }

            // Görseller ve Videolar
            if (scenes[sceneIndex].media.length > 0) {
                const entryDuration = sceneDuration * 0.4; 
                let entryProgress = Math.min(1, sceneTime / entryDuration);
                let easedProgress = easeOutCubic(entryProgress);

                scenes[sceneIndex].media.forEach(mediaData => {
                    if (mediaData.type === 'video') {
                        if (mediaData.mediaObj.paused) mediaData.mediaObj.play().catch(e=>console.log(e));
                    }

                    let targetX = mediaData.x;
                    let targetY = mediaData.y;
                    let targetScale = mediaData.scale;
                    let imgRotation = (mediaData.rotation * Math.PI) / 180;
                    
                    let currentX = targetX, currentY = targetY, currentScale = targetScale, extraRotation = 0;

                    if (entryProgress < 1) {
                        let startX = targetX, startY = targetY, startScale = targetScale;
                        if (s.entryAnimation === 'slide_left') { startX = -1500; }
                        else if (s.entryAnimation === 'slide_right') { startX = 1500; }
                        else if (s.entryAnimation === 'drop_down') { startY = -1000; }
                        else if (s.entryAnimation === 'fly_up') { startY = 1000; }
                        else if (s.entryAnimation === 'zoom_in') { startScale = 0; }
                        else if (s.entryAnimation === 'orbit') { 
                            let angle = (1 - easedProgress) * Math.PI * 4; 
                            startX = targetX + Math.cos(angle) * 800;
                            startY = targetY + Math.sin(angle) * 800;
                            startScale = 0.2; extraRotation = angle;
                        }
                        currentX = startX + (targetX - startX) * easedProgress;
                        currentY = startY + (targetY - startY) * easedProgress;
                        currentScale = startScale + (targetScale - startScale) * easedProgress;
                    }

                    let mediaW = mediaData.type === 'image' ? mediaData.mediaObj.width : mediaData.mediaObj.videoWidth;
                    let mediaH = mediaData.type === 'image' ? mediaData.mediaObj.height : mediaData.mediaObj.videoHeight;
                    
                    let maxSize = 400;
                    if (mediaW > maxSize || mediaH > maxSize) { 
                        if (mediaW > mediaH) { mediaH = (maxSize / mediaW) * mediaH; mediaW = maxSize; } 
                        else { mediaW = (maxSize / mediaH) * mediaW; mediaH = maxSize; } 
                    }

                    targetCtx.save();
                    targetCtx.translate(centerX + currentX, centerY + currentY); 
                    targetCtx.rotate(imgRotation + extraRotation); targetCtx.scale(currentScale, currentScale);

                    if (s.imageStyle === 'glass') {
                        targetCtx.beginPath(); targetCtx.roundRect(-mediaW/2, -mediaH/2, mediaW, mediaH, 30); targetCtx.clip();
                        targetCtx.globalAlpha = 0.85; 
                        targetCtx.drawImage(mediaData.mediaObj, -mediaW/2, -mediaH/2, mediaW, mediaH);
                        targetCtx.shadowBlur = 0;
                        let glare = targetCtx.createLinearGradient(-mediaW/2, -mediaH/2, mediaW/2, mediaH/2);
                        glare.addColorStop(0, "rgba(255,255,255,0.4)"); glare.addColorStop(0.5, "rgba(255,255,255,0)");
                        targetCtx.fillStyle = glare; targetCtx.fillRect(-mediaW/2, -mediaH/2, mediaW, mediaH);
                    } else if (s.imageStyle === 'circle') {
                        targetCtx.beginPath(); targetCtx.arc(0, 0, Math.min(mediaW, mediaH)/2, 0, Math.PI*2); targetCtx.clip();
                        let drawSize = Math.min(mediaW, mediaH); 
                        targetCtx.drawImage(mediaData.mediaObj, -drawSize/2, -drawSize/2, drawSize, drawSize);
                    } else {
                        targetCtx.drawImage(mediaData.mediaObj, -mediaW/2, -mediaH/2, mediaW, mediaH);
                    }
                    targetCtx.restore();
                });
            }

            // YAZILAR (Sadece kullanıcı yazdıysa)
            if (s.title.trim() !== "") {
                let titleX = s.titleX;
                let titleY = s.titleY;
                let currentTitleColor = s.titleColor;
                let textScale = 1;

                if (s.textAnimation === 'color_cycle') { 
                    let hue = (globalTime / 10) % 360; currentTitleColor = `hsl(${hue}, 100%, 60%)`;
                } else if (s.textAnimation === 'bounce') { 
                    titleY += Math.sin(globalTime / 200) * 15; 
                } else if (s.textAnimation === 'neon_pulse') { 
                    textScale = 1 + Math.sin(globalTime / 150) * 0.05; 
                }

                let actualTitleSize = fitTextSize(s.title, s.titleSize, canvas.width - 150, targetCtx, selectedFont);
                targetCtx.save(); 
                targetCtx.translate(centerX + titleX, centerY + titleY); 
                targetCtx.scale(textScale, textScale);
                targetCtx.textAlign = "center"; targetCtx.textBaseline = "middle"; 
                targetCtx.font = `600 ${actualTitleSize}px ${selectedFont}`;
                
                let titleWidth = targetCtx.measureText(s.title).width + 80;
                targetCtx.fillStyle = "rgba(0, 0, 0, 0.5)"; 
                targetCtx.beginPath(); targetCtx.roundRect(-titleWidth/2, -(actualTitleSize*0.75), titleWidth, actualTitleSize*1.5, 20); targetCtx.fill();

                targetCtx.shadowColor = currentTitleColor; targetCtx.shadowBlur = 20; targetCtx.fillStyle = currentTitleColor;
                
                if (s.textAnimation === 'typewriter') {
                    let charsToShow = Math.floor(sceneTime / 50);
                    targetCtx.fillText(s.title.substring(0, charsToShow), 0, 0);
                } else { 
                    targetCtx.fillText(s.title, 0, 0); 
                }
                targetCtx.restore();
            }

            // SLOGAN (Sadece kullanıcı yazdıysa)
            if (s.subtitle.trim() !== "") {
                let subX = s.subtitleX;
                let subY = s.subtitleY;
                let currentSubColor = s.subtitleColor;
                let textScale = 1;

                if (s.textAnimation === 'color_cycle') { 
                    let hue = (globalTime / 10) % 360; currentSubColor = `hsl(${hue}, 100%, 60%)`;
                } else if (s.textAnimation === 'bounce') { 
                    subY += Math.sin(globalTime / 200) * 15; 
                } else if (s.textAnimation === 'neon_pulse') { 
                    textScale = 1 + Math.sin(globalTime / 150) * 0.05; 
                }

                let actualSubSize = fitTextSize(s.subtitle, s.subtitleSize, canvas.width - 150, targetCtx, 'Montserrat');
                targetCtx.save(); 
                targetCtx.translate(centerX + subX, centerY + subY); 
                targetCtx.scale(textScale, textScale);
                targetCtx.textAlign = "center"; targetCtx.textBaseline = "middle";
                targetCtx.font = `400 ${actualSubSize}px 'Montserrat', sans-serif`; 
                
                let subWidth = targetCtx.measureText(s.subtitle).width + 60;
                targetCtx.fillStyle = "rgba(0, 0, 0, 0.5)"; 
                targetCtx.beginPath(); targetCtx.roundRect(-subWidth/2, -(actualSubSize*0.8), subWidth, actualSubSize*1.6, 15); targetCtx.fill();

                targetCtx.shadowColor = "rgba(0,0,0,0.8)"; targetCtx.shadowBlur = 10;
                targetCtx.fillStyle = currentSubColor;
                targetCtx.fillText(s.subtitle, 0, 0); 
                targetCtx.restore();
            }

            // Efektler
            if (s.visualEffect === 'bloom') {
                targetCtx.globalCompositeOperation = 'screen'; targetCtx.globalAlpha = 0.4; targetCtx.filter = 'blur(15px)';
                targetCtx.drawImage(sceneCanvas, 0, 0); targetCtx.filter = 'none'; targetCtx.globalAlpha = 1; targetCtx.globalCompositeOperation = 'source-over';
            }
            else if (s.visualEffect === 'vignette') {
                const vignette = targetCtx.createRadialGradient(centerX, centerY, canvas.height * 0.2, centerX, centerY, canvas.height * 0.9);
                vignette.addColorStop(0, "rgba(0,0,0,0)"); vignette.addColorStop(1, "rgba(0,0,0,0.9)");
                targetCtx.fillStyle = vignette; targetCtx.fillRect(0, 0, canvas.width, canvas.height);
            } 
            else if (s.visualEffect === 'grain') {
                const grainData = targetCtx.getImageData(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < grainData.data.length; i += 4) {
                    let noise = (Math.random() - 0.5) * 30; grainData.data[i] += noise; grainData.data[i+1] += noise; grainData.data[i+2] += noise;
                }
                targetCtx.putImageData(grainData, 0, 0);
            }
            else if (s.visualEffect === 'scanlines') {
                targetCtx.fillStyle = "rgba(0, 0, 0, 0.2)";
                for (let i = 0; i < canvas.height; i += 4) { targetCtx.fillRect(0, i, canvas.width, 2); }
            }
        }

        window.generateVideo = async function() {
            if (scenes.length === 0) return alert("Lütfen önce resim veya video yükleyin!");
            const prompt = document.getElementById('videoPrompt').value.trim() || "Modern bir reklam";

            generateBtn.disabled = true;
            downloadArea.style.display = 'none';
            videoPlayer.style.display = 'none';
            canvas.style.display = 'block';
            mediaPlaceholder.style.display = 'none';
            
            statusText.innerText = "🧠 Yapay Zeka sahneleri tasarlıyor...";
            statusText.className = "status recording";

            try {
                await applyAIDesignToScenes(prompt);
                statusText.innerText = "🎬 Sinematik render başladı...";
                recordedChunks = [];

                let stream = canvas.captureStream(60);
                const audioFile = audioUpload.files[0];
                
                if (audioFile) {
                    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    if(audioCtx.state === 'suspended') await audioCtx.resume();
                    audioElement = new Audio(URL.createObjectURL(audioFile));
                    audioElement.loop = true;
                    const source = audioCtx.createMediaElementSource(audioElement);
                    const dest = audioCtx.createMediaStreamDestination();
                    source.connect(dest);
                    source.connect(audioCtx.destination);
                    const audioTrack = dest.stream.getAudioTracks()[0];
                    stream = new MediaStream([...stream.getVideoTracks(), audioTrack]);
                    audioElement.play();
                }

                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9,opus' });
                mediaRecorder.ondataavailable = (event) => { if (event.data.size > 0) recordedChunks.push(event.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    
                    videoPlayer.src = url;
                    videoPlayer.style.display = 'block';
                    canvas.style.display = 'none';
                    videoPlayer.play();
                    
                    downloadLink.href = url;
                    downloadArea.style.display = 'block';
                    statusText.innerText = "✅ Reklam Filmi Hazır!";
                    statusText.className = "status";
                    generateBtn.disabled = false;
                    generateBtn.innerText = "✨ Otonom Reklamı Üret";
                    cancelAnimationFrame(animationId);
                    if (audioElement) audioElement.pause();
                };

                let totalDuration = 6000; 
                if (videoDurationSelect.value === 'auto') {
                     totalDuration = scenes[0].settings.duration || 6000;
                } else {
                    totalDuration = parseInt(videoDurationSelect.value);
                }

                mediaRecorder.start();
                let startTime = Date.now();
                const sceneDuration = totalDuration / scenes.length;
                
                let lastSceneIndex = -1;
                let transitionStartTime = -1;
                const transitionDuration = 800;

                // Tüm videoları başlangıç durumuna al
                scenes.forEach(scene => {
                    scene.media.forEach(m => {
                        if (m.type === 'video') { 
                            m.mediaObj.currentTime = 0; 
                            m.mediaObj.pause(); 
                        }
                    });
                });

                function drawFrame() {
                    const time = Date.now() - startTime;
                    const currentSceneIndex = Math.min(Math.floor(time / sceneDuration), scenes.length - 1);
                    const sceneTime = time % sceneDuration;
                    
                    const s = scenes[currentSceneIndex].settings;

                    if (currentSceneIndex !== lastSceneIndex) {
                        if (lastSceneIndex !== -1) {
                            prevCtx.clearRect(0, 0, canvas.width, canvas.height);
                            prevCtx.drawImage(sceneCanvas, 0, 0); 
                            transitionStartTime = time;
                        }
                        
                        // Eski sahnedeki videoları durdur
                        if (lastSceneIndex !== -1) {
                            scenes[lastSceneIndex].media.forEach(m => {
                                if (m.type === 'video') m.mediaObj.pause();
                            });
                        }

                        // Yeni sahnedeki videoları başlat (SORUN BURADAYDI, EKLENDİ)
                        scenes[currentSceneIndex].media.forEach(m => {
                            if (m.type === 'video') {
                                m.mediaObj.currentTime = 0; // Baştan başlat
                                m.mediaObj.play().catch(e => console.log("Video oynatma hatası:", e));
                            }
                        });
                        
                        lastSceneIndex = currentSceneIndex;
                    }

                    sceneCtx.clearRect(0, 0, canvas.width, canvas.height);
                    renderSceneToCtx(sceneCtx, currentSceneIndex, sceneTime, sceneDuration, time);

                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    const isTransitioning = (transitionStartTime !== -1 && (time - transitionStartTime) < transitionDuration);
                    
                    if (isTransitioning && currentSceneIndex > 0) {
                        const progress = (time - transitionStartTime) / transitionDuration;
                        
                        ctx.drawImage(prevCanvas, 0, 0);
                        
                        ctx.save();
                        if (s.transitionEffect === 'fade') {
                            ctx.globalAlpha = progress;
                        } else if (s.transitionEffect === 'slide_left') {
                            ctx.translate(-canvas.width * (1 - progress), 0);
                        } else if (s.transitionEffect === 'slide_right') {
                            ctx.translate(canvas.width * (1 - progress), 0);
                        } else if (s.transitionEffect === 'zoom') {
                            ctx.translate(canvas.width/2, canvas.height/2);
                            ctx.scale(progress, progress);
                            ctx.translate(-canvas.width/2, -canvas.height/2);
                        } else if (s.transitionEffect === 'wipe') {
                            ctx.beginPath();
                            ctx.rect(0, 0, canvas.width * progress, canvas.height);
                            ctx.clip();
                        }
                        
                        ctx.drawImage(sceneCanvas, 0, 0);
                        ctx.restore();
                    } else {
                        ctx.drawImage(sceneCanvas, 0, 0);
                    }

                    if (time >= totalDuration) { 
                        // Videonun sonlanması durumunda tüm videoları durdur
                        scenes.forEach(scene => {
                            scene.media.forEach(m => {
                                if (m.type === 'video') m.mediaObj.pause();
                            });
                        });
                        mediaRecorder.stop(); 
                    } 
                    else { animationId = requestAnimationFrame(drawFrame); }
                }

                drawFrame();

            } catch (error) {
                statusText.innerText = "⚠️ Hata: " + error.message;
                generateBtn.disabled = false;
                generateBtn.innerText = "✨ Otonom Reklamı Üret";
            }
        };

        window.addEventListener('resize', () => {
            if (activeSceneIndex !== -1) renderInteractiveCanvas();
        });
    </script>
