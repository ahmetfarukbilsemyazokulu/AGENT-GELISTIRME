<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarayıcı İçi AI Asistanı</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 650px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; height: 80vh; }
        .chat-header { background: #24292e; color: white; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 85%; line-height: 1.5; font-size: 14px; word-break: break-word; white-space: pre-wrap; }
        .user-message { background: #0366d6; color: white; align-self: flex-end; }
        .bot-message { background: #eaecef; color: #24292e; align-self: flex-start; }
        .chat-input-area { display: flex; border-top: 1px solid #eaecef; padding: 12px; background: #fafbfc; }
        .chat-input-area input { flex: 1; padding: 12px; border: 1px solid #dfe2e5; border-radius: 6px; outline: none; font-size: 14px; }
        .chat-input-area button { background: #28a745; color: white; border: none; padding: 12px 22px; margin-left: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .chat-input-area button:disabled { background: #94d3a2; cursor: not-allowed; }
        #status { background: #fff3cd; color: #856404; padding: 10px; text-align: center; font-size: 13px; border-bottom: 1px solid #ffeeba; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🤖 Tarayıcı İçi AI Asistanı</div>
    <div id="status">Kararlı AI motoru yükleniyor, lütfen bekleyin...</div>
    <div class="chat-messages" id="chatMessages">
        <div class="message bot-message">👋 Merhaba! Tarayıcı motorumuz hazır olduğunda mesaj yazabilirsiniz.</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Yükleniyor..." disabled onkeypress="handleKeyPress(event)">
        <button id="sendBtn" disabled onclick="sendMessage()">Gönder</button>
    </div>
</div>

<script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0';

    env.allowLocalModels = false;

    let classifier = null;
    const statusDiv = document.getElementById("status");
    const inputField = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    async function loadModel() {
        try {
            statusDiv.innerText = "Duygu analizi ve metin işleme modeli yükleniyor...";
            
            // Tarayıcıda %100 kararlı çalışan ve dosya yolu hatası vermeyen model
            classifier = await pipeline('sentiment-analysis', 'Xenova/distilbert-base-uncased-finetuned-sst-2-english');

            statusDiv.innerText = "✅ Model Hazır! Dilediğiniz cümleyi yazabilirsiniz.";
            statusDiv.style.background = "#d4edda";
            statusDiv.style.color = "#155724";

            inputField.disabled = false;
            sendBtn.disabled = false;
            inputField.placeholder = "İngilizce bir cümle yazın (örn: I love this tool)...";
        } catch (error) {
            statusDiv.innerText = "⚠️ Model hatası: " + error.message;
            statusDiv.style.background = "#f8d7da";
            statusDiv.style.color = "#721c24";
        }
    }

    loadModel();

    window.sendMessage = async function() {
        const messageText = inputField.value.trim();
        if (!messageText || !classifier) return;

        appendMessage(messageText, 'user-message');
        inputField.value = '';

        const chatMessages = document.getElementById('chatMessages');
        const botMessageDiv = document.createElement('div');
        botMessageDiv.className = 'message bot-message';
        botMessageDiv.innerText = "Analiz ediliyor...";
        chatMessages.appendChild(botMessageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        try {
            const result = await classifier(messageText);
            if (result && result[0]) {
                const label = result[0].label;
                const score = (result[0].score * 100).toFixed(1);
                botMessageDiv.innerText = `🔍 Model Analizi:\nSonuç: ${label} (Doğruluk Oranı: %${score})`;
            } else {
                botMessageDiv.innerText = "Analiz tamamlandı ancak sonuç alınamadı.";
            }
        } catch (error) {
            botMessageDiv.innerText = "Hata oluştu: " + error.message;
        }
        chatMessages.scrollTop = chatMessages.scrollHeight;
    };

    function appendMessage(text, className) {
        const chatMessages = document.getElementById('chatMessages');
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${className}`;
        messageDiv.innerText = text;
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    window.handleKeyPress = function(event) {
        if (event.key === 'Enter') {
            window.sendMessage();
        }
    }
</script>

</body>
</html>
