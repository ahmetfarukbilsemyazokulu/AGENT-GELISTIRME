<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Süper Hızlı Yapay Zeka Asistanı</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 650px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; height: 80vh; }
        .chat-header { background: #24292e; color: white; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 85%; line-height: 1.5; font-size: 14px; word-break: break-word; white-space: pre-wrap; }
        .user-message { background: #0366d6; color: white; align-self: flex-end; }
        .bot-message { background: #eaecef; color: #24292e; align-self: flex-start; }
        .chat-input-area { display: flex; border-top: 1px solid #eaecef; padding: 12px; background: #fafbfc; }
        .chat-input-area input { flex: 1; padding: 12px; border: 1px solid #dfe2e5; border-radius: 6px; outline: none; font-size: 14px; }
        .chat-input-area button { background: #2ea44f; color: white; border: none; padding: 12px 22px; margin-left: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .chat-input-area button:hover { background: #2c974b; }
        #status { background: #d4edda; color: #155724; padding: 8px; text-align: center; font-size: 13px; border-bottom: 1px solid #c3e6cb; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">⚡ Gerçek Yapay Zeka Asistanı</div>
    <div id="status">🚀 Bağlantı Hazır! İstediğin soruyu sorabilirsin.</div>
    <div class="chat-messages" id="chatMessages">
        <div class="message bot-message">👋 Merhaba! Ben dünyadaki en güçlü açık kaynaklı modellerle güçlendirilmiş, tamamen akıcı Türkçe konuşan asistanınım. Bana dilediğini sorabilirsin!</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Mesajınızı yazın..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Gönder</button>
    </div>
</div>

<script>
    // BURAYA ÜCRETSİZ GROQ API ANAHTARINI YAPIŞTIRACAKSIN:
    const GROQ_API_KEY = "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";

    let chatHistory = [
        { role: "system", content: "Sen yardımcı, akıllı, samimi ve Türkçe konuşan profesyonel bir yapay zeka asistanısın." }
    ];

    async function sendMessage() {
        const inputField = document.getElementById('userInput');
        const messageText = inputField.value.trim();
        if (!messageText) return;

        if (GROQ_API_KEY === "BURAYA_GROQ_API_ANAHTARINI_YAZIN") {
            alert("Lütfen kodun içindeki GROQ_API_KEY kısmına kendi ücretsiz anahtarını ekle!");
            return;
        }

        appendMessage(messageText, 'user-message');
        inputField.value = '';

        chatHistory.push({ role: "user", content: messageText });

        const chatMessages = document.getElementById('chatMessages');
        const botMessageDiv = document.createElement('div');
        botMessageDiv.className = 'message bot-message';
        botMessageDiv.innerText = "Yazıyor...";
        chatMessages.appendChild(botMessageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        try {
            // Dünyanın en hızlı açık kaynaklı modeli (Llama 3 8B)
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${GROQ_API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "llama3-8b-8192",
                    messages: chatHistory,
                    temperature: 0.7
                })
            });

            const data = await response.json();

            if (data.choices && data.choices[0].message) {
                const reply = data.choices[0].message.content;
                botMessageDiv.innerText = reply;
                chatHistory.push({ role: "assistant", content: reply });
            } else {
                botMessageDiv.innerText = "Bir hata oluştu, yanıt alınamadı.";
            }
        } catch (error) {
            botMessageDiv.innerText = "Bağlantı hatası: " + error.message;
        }
        
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function appendMessage(text, className) {
        const chatMessages = document.getElementById('chatMessages');
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${className}`;
        messageDiv.innerText = text;
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }
</script>

</body>
</html>
