<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profesyonel AI Asistanı | AGENT-GELISTIRME</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome (İkonlar için) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Marked.js (Markdown Desteği için) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --primary-color: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F3F4F6;
            --chat-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --bot-bubble: #F3F4F6;
            --user-bubble: #4F46E5;
            --border-radius: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text-main);
        }

        .chat-container {
            width: 100%;
            max-width: 700px;
            height: 90vh;
            background: var(--chat-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #E5E7EB;
        }

        /* Header */
        .chat-header {
            background: #FFFFFF;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #E5E7EB;
        }

        .header-info { display: flex; align-items: center; gap: 12px; }
        
        .avatar-bot {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, #4F46E5, #8B5CF6);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            color: white; font-size: 18px;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
        }

        .header-text h2 { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
        .header-text p { font-size: 12px; color: #10B981; display: flex; align-items: center; gap: 4px; }
        .header-text p::before { content: ''; display: block; width: 8px; height: 8px; background: #10B981; border-radius: 50%; }

        .clear-btn {
            background: transparent; border: none; color: var(--text-muted);
            cursor: pointer; font-size: 14px; transition: color 0.2s;
            display: flex; align-items: center; gap: 6px; font-family: 'Inter', sans-serif;
        }
        .clear-btn:hover { color: #EF4444; }

        /* Chat Messages */
        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: #F9FAFB;
        }

        .message-row { display: flex; gap: 12px; max-width: 85%; animation: fadeIn 0.3s ease-out; }
        .message-row.user { align-self: flex-end; flex-direction: row-reverse; }
        .message-row.bot { align-self: flex-start; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-content {
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .user .message-content {
            background: var(--user-bubble); color: white;
            border-top-right-radius: 4px;
        }

        .bot .message-content {
            background: var(--chat-bg); color: var(--text-main);
            border: 1px solid #E5E7EB;
            border-top-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        /* Markdown İçi Linkler */
        .bot .message-content a { color: var(--primary-color); text-decoration: none; font-weight: 500; }
        .bot .message-content a:hover { text-decoration: underline; }
        .bot .message-content p { margin-bottom: 8px; }
        .bot .message-content p:last-child { margin-bottom: 0; }

        /* Yazıyor Animasyonu */
        .typing-indicator {
            display: flex; gap: 4px; padding: 16px 18px;
            background: var(--chat-bg); border: 1px solid #E5E7EB;
            border-radius: 12px; border-top-left-radius: 4px; width: fit-content;
        }
        .typing-indicator span {
            width: 6px; height: 6px; background: #9CA3AF;
            border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Input Area */
        .chat-input-area {
            padding: 20px 24px;
            background: #FFFFFF;
            border-top: 1px solid #E5E7EB;
            display: flex; gap: 12px; align-items: center;
        }

        .input-wrapper {
            flex: 1; position: relative;
            display: flex; align-items: center;
            background: #F3F4F6; border-radius: 24px;
            padding: 4px 8px; border: 1px solid transparent; transition: border 0.2s;
        }
        .input-wrapper:focus-within { border-color: var(--primary-color); background: #FFFFFF; }

        .chat-input-area input {
            flex: 1; border: none; background: transparent;
            padding: 12px 16px; font-size: 14px; outline: none; font-family: 'Inter', sans-serif;
        }

        .send-btn {
            background: var(--primary-color); color: white;
            border: none; width: 40px; height: 40px;
            border-radius: 50%; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            transition: background 0.2s, transform 0.1s;
        }
        .send-btn:hover { background: var(--primary-hover); transform: scale(1.05); }
        .send-btn:active { transform: scale(0.95); }
        .send-btn i { font-size: 16px; margin-left: -2px; }

        /* Scrollbar */
        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-messages::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 10px; }
        .chat-messages::-webkit-scrollbar-thumb:hover { background: #9CA3AF; }

        /* Mobil Uyumluluk */
        @media (max-width: 600px) {
            .chat-container { height: 100vh; border-radius: 0; }
            .message-row { max-width: 95%; }
        }
    </style>
</head>
<body>

<div class="chat-container">
    <!-- Header -->
    <div class="chat-header">
        <div class="header-info">
            <div class="avatar-bot"><i class="fa-solid fa-robot"></i></div>
            <div class="header-text">
                <h2>AGENT Asistan</h2>
                <p>Çevrimiçi & Hazır</p>
            </div>
        </div>
        <button class="clear-btn" onclick="clearChat()">
            <i class="fa-solid fa-trash-can"></i> Temizle
        </button>
    </div>
    
    <!-- Messages -->
    <div class="chat-messages" id="chatMessages">
        <div class="message-row bot">
            <div class="avatar-bot" style="width:32px; height:32px; font-size:14px;"><i class="fa-solid fa-robot"></i></div>
            <div class="message-content">
                Merhaba! Ben profesyonel asistanınızım. Bana <strong>"Arslanköy nerede?"</strong>, <strong>"Çin nerede?"</strong> gibi genel kültür soruları sorabilir veya <strong>"Nasılsın?"</strong> diyerek sohbet edebilirsiniz.
            </div>
        </div>
    </div>
    
    <!-- Input -->
    <div class="chat-input-area">
        <div class="input-wrapper">
            <input type="text" id="userInput" placeholder="Bir mesaj yazın..." onkeypress="handleKeyPress(event)" autocomplete="off">
        </div>
        <button class="send-btn" onclick="sendMessage()">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </div>
</div>

<script>
    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');

    // Sohbeti Temizleme Fonksiyonu
    window.clearChat = function() {
        if(confirm("Sohbet geçmişini temizlemek istediğinize emin misiniz?")) {
            chatMessages.innerHTML = `
                <div class="message-row bot">
                    <div class="avatar-bot" style="width:32px; height:32px; font-size:14px;"><i class="fa-solid fa-robot"></i></div>
                    <div class="message-content">Sohbet temizlendi. Size nasıl yardımcı olabilirim?</div>
                </div>`;
        }
    }

    // Mesaj Gönderme
    window.sendMessage = async function() {
        const messageText = userInput.value.trim();
        if (!messageText) return;

        // Kullanıcı mesajını ekle
        addMessage(messageText, 'user');
        userInput.value = '';

        // Botun yazıyor animasyonunu ekle
        const typingId = addTypingIndicator();

        const textLower = messageText.toLowerCase();
        let botReply = "";

        // KURAL MOTORU (Anında Cevap Verenler)
        if (textLower.includes("merhaba") || textLower.includes("selam")) {
            botReply = "👋 Merhaba! Size nasıl yardımcı olabilirim?";
        } 
        else if (textLower.includes("nasılsın")) {
            botReply = "🤖 Ben bir yapay zeka olduğum için duygularım yok, ama sistemlerim mükemmel çalışıyor! Siz nasılsınız?";
        }
        else if (textLower.includes("saat kaç")) {
            botReply = "⏰ Şu anki saat: **" + new Date().toLocaleTimeString('tr-TR') + "**";
        }
        else if (textLower.includes("günlerden ne") || textLower.includes("bugün günlerden")) {
            botReply = "📅 Bugün: **" + new Date().toLocaleDateString('tr-TR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }) + "**";
        }
        else if (textLower.includes("sen kimsin") || textLower.includes("adın ne")) {
            botReply = "🧠 Ben, tamamen tarayıcınızda çalışan ve genel kültür sorularınızı Wikipedia üzerinden anında yanıtlayan akıllı bir asistanım.";
        }
        // ARSLANKÖY ÖZEL KONTROL
        else if (textLower.includes("arslanköy")) {
            botReply = "📍 **Arslanköy**, Mersin ilinin Toroslar ilçesine bağlı bir mahalledir. Deniz seviyesinden yaklaşık 1475 metre yükseklikte, Toros Dağları üzerinde kurulmuş bir yörük köyüdür. Eski adı Efrenk'tir ve Kurtuluş Savaşı'nda gösterdiği direnişle bilinir.\n\n*Kaynak: Genel Kültür Veri Tabanı*";
        }
        // WIKIPEDIA ENTEGRASYONU
        else {
            try {
                let aranacakKelime = messageText.replace(/nerede|nerededir|kimdir|nedir|neresi|\?/gi, '').trim();
                
                // 1. Arama API'si
                const searchUrl = `https://tr.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(aranacakKelime)}&format=json&origin=*`;
                const searchResponse = await fetch(searchUrl);
                const searchData = await searchResponse.json();
                
                if (searchData.query.search.length > 0) {
                    const bestTitle = searchData.query.search[0].title;
                    
                    // 2. İçerik API'si
                    const contentUrl = `https://tr.wikipedia.org/w/api.php?action=query&prop=extracts&exsentences=4&exlimit=1&titles=${encodeURIComponent(bestTitle)}&explaintext=1&format=json&origin=*`;
                    const contentResponse = await fetch(contentUrl);
                    const contentData = await contentResponse.json();
                    const pages = contentData.query.pages;
                    const pageId = Object.keys(pages)[0];
                    
                    if (pageId !== "-1" && pages[pageId].extract) {
                        let extract = pages[pageId].extract;
                        extract = extract.replace(/\n/g, ' ').trim();
                        if (extract.length > 350) extract = extract.substring(0, 350) + "...";
                        
                        // Markdown formatında dön
                        botReply = `📚 **${bestTitle}** hakkında bilgiler:\n\n${extract}\n\n*Kaynak: Wikipedia*`;
                    } else {
                        botReply = `🤔 "${aranacakKelime}" hakkında Wikipedia'da net bir bilgi bulamadım.`;
                    }
                } else {
                    botReply = `🤔 "${aranacakKelime}" hakkında hiçbir sonuç bulamadım. Lütfen farklı bir kelimeyle deneyin.`;
                }
            } catch (error) {
                botReply = "⚠️ Wikipedia'ya bağlanırken bir hata oluştu. İnternet bağlantınızı kontrol edin.";
            }
        }

        // Animasyonun görünmesi için ufak bir gecikme (Profesyonel hissettirir)
        setTimeout(() => {
            removeTypingIndicator(typingId);
            addMessage(botReply, 'bot');
        }, 600);
    };

    // Mesaj Ekleme
    function addMessage(text, sender) {
        const row = document.createElement('div');
        row.className = `message-row ${sender}`;

        let avatarHtml = '';
        if (sender === 'bot') {
            avatarHtml = `<div class="avatar-bot" style="width:32px; height:32px; font-size:14px;"><i class="fa-solid fa-robot"></i></div>`;
        }

        // Markdown'ı HTML'e çevir (Sadece bot mesajları için)
        let parsedText = sender === 'bot' ? marked.parse(text) : text;

        row.innerHTML = `
            ${avatarHtml}
            <div class="message-content">${parsedText}</div>
        `;

        chatMessages.appendChild(row);
        scrollToBottom();
    }

    // Yazıyor Animasyonu Ekle
    function addTypingIndicator() {
        const id = 'typing-' + Date.now();
        const row = document.createElement('div');
        row.className = `message-row bot`;
        row.id = id;
        row.innerHTML = `
            <div class="avatar-bot" style="width:32px; height:32px; font-size:14px;"><i class="fa-solid fa-robot"></i></div>
            <div class="typing-indicator">
                <span></span><span></span><span></span>
            </div>
        `;
        chatMessages.appendChild(row);
        scrollToBottom();
        return id;
    }

    // Yazıyor Animasyonunu Kaldır
    function removeTypingIndicator(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
    }

    function scrollToBottom() {
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    window.handleKeyPress = function(event) {
        if (event.key === 'Enter') {
            window.sendMessage();
        }
    }
</script>

</body>
</html>
