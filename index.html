<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akıllı ve Hafızalı Yapay Zeka - Agent</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 650px; background: white; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; height: 85vh; }
        .chat-header { background: #24292e; color: white; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 85%; line-height: 1.5; font-size: 14px; word-break: break-word; }
        .user-message { background: #0366d6; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot-message { background: #eaecef; color: #24292e; align-self: flex-start; border-bottom-left-radius: 2px; }
        .chat-input-area { display: flex; border-top: 1px solid #eaecef; padding: 12px; background: #fafbfc; }
        .chat-input-area input { flex: 1; padding: 12px; border: 1px solid #dfe2e5; border-radius: 6px; outline: none; font-size: 14px; }
        .chat-input-area button { background: #28a745; color: white; border: none; padding: 12px 22px; margin-left: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .chat-input-area button:hover { background: #218838; }
        .chat-input-area button:disabled { background: #94d3a2; cursor: not-allowed; }
        #status { background: #fff3cd; color: #856404; padding: 10px; text-align: center; font-size: 13px; border-bottom: 1px solid #ffeeba; font-weight: bold; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🤖 Akıllı ve Hafızalı Tarayıcı İçi AI</div>
    <div id="status">Model yükleniyor, lütfen bekleyin...</div>
    
    <div class="chat-messages" id="chatMessages">
        <div class="message bot-message">👋 Merhaba! Ben gelişmiş yapay zeka modelinizim. Artık önceki mesajlarımızı hatırlıyorum. Bana dilediğiniz soruyu sorabilirsiniz!</div>
    </div>
    
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Mesajınızı yazın..." disabled onkeypress="handleKeyPress(event)">
        <button id="sendBtn" disabled onclick="sendMessage()">Gönder</button>
    </div>
</div>

<script type="module">
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";

    let engine = null;
    // Daha zeki 3 Milyar parametreli model (Llama-3.2-3B)
    const selectedModel = "Llama-3.2-3B-Instruct-q4f32_1-MLC"; 
    
    // Sohbet hafızası dizisi (Geçmişi tutar)
    let chatHistory = [
        { role: "system", content: "Sen son derece zeki, bilgili ve yardımcı bir yapay zeka asistanısın. Kullanıcının sorularına her zaman doğru, mantıklı, detaylı ve Türkçe yanıtlar ver. Asla saçmalama, bilgin yoksa bilmediğini söyle." }
    ];

    async function initializeEngine() {
        const statusDiv = document.getElementById("status");
        const inputField = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");

        try {
            statusDiv.innerText = "Daha akıllı model indiriliyor... (İlk seferde 1.5 GB indirebilir, lütfen bekleyin)...";
            
            engine = await webllm.CreateMLCEngine(
                selectedModel,
                {
                    initProgressCallback: (progress) => {
                        statusDiv.innerText = progress.text;
                    }
                }
            );

            statusDiv.innerText = "✅ Gelişmiş Yapay Zeka Hazır! Sorularınızı sorabilirsiniz.";
            statusDiv.style.background = "#d4edda";
            statusDiv.style.color = "#155724";
            
            inputField.disabled = false;
            sendBtn.disabled = false;
            inputField.placeholder = "Mersin nerede? veya Nasılsın?";
            inputField.focus();
        } catch (error) {
            statusDiv.innerText = "⚠️ Model yüklenirken hata oluştu: " + error.message;
            statusDiv.style.background = "#f8d7da";
            statusDiv.style.color = "#721c24";
        }
    }

    initializeEngine();

    window.sendMessage = async function() {
        const inputField = document.getElementById('userInput');
        const messageText = inputField.value.trim();
        if (!messageText || !engine) return;

        appendMessage(messageText, 'user-message');
        inputField.value = '';

        // Kullanıcının mesajını hafızaya ekle
        chatHistory.push({ role: "user", content: messageText });

        const chatMessages = document.getElementById('chatMessages');
        const botMessageDiv = document.createElement('div');
        botMessageDiv.className = 'message bot-message';
        botMessageDiv.innerText = "Düşünüyor...";
        chatMessages.appendChild(botMessageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        try {
            // Hafızadaki TÜM sohbeti modele gönderiyoruz
            const reply = await engine.chat.completions.create({ messages: chatHistory });
            const botReply = reply.choices[0].message.content;
            
            // Botun cevabını da hafızaya ekle (Bir sonraki soruda hatırlaması için)
            chatHistory.push({ role: "assistant", content: botReply });
            
            botMessageDiv.innerText = botReply;
        } catch (error) {
            botMessageDiv.innerText = "Üzgünüm, yanıt üretirken bir hata oluştu: " + error.message;
            chatHistory.pop(); // Hata olursa son mesajı hafızadan sil
        }
        chatMessages.scrollTop = chatMessages.scrollHeight;
    };

    function appendMessage(text, className) {
        const chatMessages = document.getElementById('chatMessages');
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${className}`;
        messageDiv.innerText = text;
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    window.handleKeyPress = function(event) {
        if (event.key === 'Enter') {
            window.sendMessage();
        }
    }
</script>

</body>
</html>
