<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kusursuz Akıllı Asistan - Agent</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 650px; background: white; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; height: 85vh; }
        .chat-header { background: #24292e; color: white; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 85%; line-height: 1.5; font-size: 14px; word-break: break-word; }
        .user-message { background: #0366d6; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot-message { background: #eaecef; color: #24292e; align-self: flex-start; border-bottom-left-radius: 2px; }
        .chat-input-area { display: flex; border-top: 1px solid #eaecef; padding: 12px; background: #fafbfc; }
        .chat-input-area input { flex: 1; padding: 12px; border: 1px solid #dfe2e5; border-radius: 6px; outline: none; font-size: 14px; }
        .chat-input-area button { background: #28a745; color: white; border: none; padding: 12px 22px; margin-left: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .chat-input-area button:hover { background: #218838; }
        #status { background: #d4edda; color: #155724; padding: 10px; text-align: center; font-size: 13px; border-bottom: 1px solid #c3e6cb; font-weight: bold; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🤖 Süper Akıllı Asistan (Wikipedia Destekli)</div>
    <div id="status">✅ Sistem Hazır! Anında cevap verebilirim.</div>
    
    <div class="chat-messages" id="chatMessages">
        <div class="message bot-message">👋 Merhaba! Ben gelişmiş asistanınızım. Bana "Çin nerede?", "Atatürk kimdir?" gibi genel kültür soruları sorabilir veya "Nasılsın?" diyerek sohbet edebilirsiniz.</div>
    </div>
    
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Bir şey sorun..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Gönder</button>
    </div>
</div>

<script>
    window.sendMessage = async function() {
        const inputField = document.getElementById('userInput');
        const messageText = inputField.value.trim();
        if (!messageText) return;

        appendMessage(messageText, 'user-message');
        inputField.value = '';

        const chatMessages = document.getElementById('chatMessages');
        const botMessageDiv = document.createElement('div');
        botMessageDiv.className = 'message bot-message';
        botMessageDiv.innerText = "Araştırılıyor...";
        chatMessages.appendChild(botMessageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        const textLower = messageText.toLowerCase();
        let botReply = "";

        // 1. KURAL MOTORU (Anında Cevap Verenler)
        if (textLower.includes("merhaba") || textLower.includes("selam")) {
            botReply = "👋 Merhaba! Size nasıl yardımcı olabilirim?";
        } 
        else if (textLower.includes("nasılsın")) {
            botReply = "🤖 Ben bir yapay zeka olduğum için duygularım yok, ama sistemlerim mükemmel çalışıyor! Siz nasılsınız?";
        }
        else if (textLower.includes("saat kaç")) {
            botReply = "⏰ Şu anki saat: " + new Date().toLocaleTimeString('tr-TR');
        }
        else if (textLower.includes("günlerden ne") || textLower.includes("bugün günlerden")) {
            botReply = "📅 Bugün: " + new Date().toLocaleDateString('tr-TR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }
        else if (textLower.includes("sen kimsin") || textLower.includes("adın ne")) {
            botReply = "🧠 Ben, tamamen tarayıcınızda çalışan ve genel kültür sorularınızı Wikipedia üzerinden anında yanıtlayan akıllı bir asistanım.";
        }
        // 2. WIKIPEDIA ENTEGRASYONU (Genel Kültür ve Yer Soruları)
        else {
            botMessageDiv.innerText = "Wikipedia'da aranıyor...";
            try {
                // Sorudaki gereksiz kelimeleri temizle (örn: "çin nerede" -> "çin")
                let aranacakKelime = messageText.replace(/nerede|nerededir|kimdir|nedir|neresi|\?/gi, '').trim();
                
                const response = await fetch(`https://tr.wikipedia.org/w/api.php?action=query&prop=extracts&exsentences=3&exlimit=1&titles=${aranacakKelime}&explaintext=1&format=json&origin=*`);
                const data = await response.json();
                const pages = data.query.pages;
                const pageId = Object.keys(pages)[0];

                if (pageId !== "-1" && pages[pageId].extract) {
                    // Wikipedia'dan gelen metni temizle ve kısalt
                    let extract = pages[pageId].extract;
                    extract = extract.split('\n')[0]; // İlk paragrafı al
                    if (extract.length > 300) extract = extract.substring(0, 300) + "...";
                    
                    botReply = `📚 **${aranacakKelime.toUpperCase()}** hakkında bulduklarım:\n\n${extract}`;
                } else {
                    botReply = `🤔 Üzgünüm, "${aranacakKelime}" hakkında Wikipedia'da net bir bilgi bulamadım. Lütfen sorunuzu farklı bir şekilde sorun (örn: "Türkiye'nin başkenti neresi?").`;
                }
            } catch (error) {
                botReply = "⚠️ Wikipedia'ya bağlanırken bir hata oluştu. İnternet bağlantınızı kontrol edin.";
            }
        }

        // Cevabı ekrana yaz
        botMessageDiv.innerText = botReply;
        chatMessages.scrollTop = chatMessages.scrollHeight;
    };

    function appendMessage(text, className) {
        const chatMessages = document.getElementById('chatMessages');
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${className}`;
        messageDiv.innerText = text;
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    window.handleKeyPress = function(event) {
        if (event.key === 'Enter') {
            window.sendMessage();
        }
    }
</script>

</body>
</html>
