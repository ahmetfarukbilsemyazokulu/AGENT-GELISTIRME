<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarayıcı İçi Yapay Zeka - Agent</title>
    <!-- WebLLM Kütüphanesi -->
    <script type="module">
        import * as webllm from "https://esm.run/@mlc-ai/web-llm";
        window.webllm = webllm;
    </script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 650px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; height: 80vh; }
        .chat-header { background: #24292e; color: white; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 85%; line-height: 1.5; font-size: 14px; word-break: break-word; }
        .user-message { background: #0366d6; color: white; align-self: flex-end; }
        .bot-message { background: #eaecef; color: #24292e; align-self: flex-start; }
        .chat-input-area { display: flex; border-top: 1px solid #eaecef; padding: 12px; background: #fafbfc; }
        .chat-input-area input { flex: 1; padding: 12px; border: 1px solid #dfe2e5; border-radius: 6px; outline: none; font-size: 14px; }
        .chat-input-area button { background: #28a745; color: white; border: none; padding: 12px 22px; margin-left: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .chat-input-area button:disabled { background: #94d3a2; cursor: not-allowed; }
        #status { background: #fff3cd; color: #856404; padding: 10px; text-align: center; font-size: 13px; border-bottom: 1px solid #ffeeba; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🤖 Gerçek Tarayıcı İçi AI Asistanı</div>
    <div id="status">Model yükleniyor, lütfen bekleyin (İlk yüklemede model indirilebilir)...</div>
    <div class="chat-messages" id="chatMessages">
        <div class="message bot-message">👋 Merhaba! Ben doğrudan tarayıcınızda çalışan gerçek bir yapay zeka modeliyim. Model tamamen yüklendiğinde dilediğiniz her soruyu bana sorabilirsiniz!</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Yapay zekaya bir şeyler sorun..." disabled onkeypress="handleKeyPress(event)">
        <button id="sendBtn" disabled onclick="sendMessage()">Gönder</button>
    </div>
</div>

<script type="module">
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";

    let engine = null;
    // Hafif ve hızlı bir model seçiyoruz
    const selectedModel = "Llama-3-8B-Instruct-q4f32_1-MLC"; 

    async function initializeEngine() {
        const statusDiv = document.getElementById("status");
        const inputField = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");

        try {
            statusDiv.innerText = "Yapay zeka motoru başlatılıyor ve model yükleniyor...";
            
            engine = await webllm.CreateMLCEngine(
                selectedModel,
                {
                    initProgressCallback: (progress) => {
                        statusDiv.innerText = progress.text;
                    }
                }
            );

            statusDiv.innerText = "✅ Yapay Zeka Hazır! Dilediğiniz soruyu sorabilirsiniz.";
            statusDiv.style.background = "#d4edda";
            statusDiv.style.color = "#155724";
            
            inputField.disabled = false;
            sendBtn.disabled = false;
            inputField.placeholder = "Mesajınızı yazın...";
        } catch (error) {
            statusDiv.innerText = "⚠️ Model yüklenirken hata oluştu: " + error.message;
            statusDiv.style.background = "#f8d7da";
            statusDiv.style.color = "#721c24";
        }
    }

    initializeEngine();

    window.sendMessage = async function() {
        const inputField = document.getElementById('userInput');
        const messageText = inputField.value.trim();
        if (!messageText || !engine) return;

        appendMessage(messageText, 'user-message');
        inputField.value = '';

        // Bot yanıtı için geçici bir kutu açalım
        const chatMessages = document.getElementById('chatMessages');
        const botMessageDiv = document.createElement('div');
        botMessageDiv.className = 'message bot-message';
        botMessageDiv.innerText = "Düşünüyor...";
        chatMessages.appendChild(botMessageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        try {
            const messages = [
                { role: "system", content: "Sen yardımcı, akıllı ve arkadaş canlısı bir yapay zeka asistanısın. Türkçe yanıtlar ver." },
                { role: "user", content: messageText }
            ];

            const reply = await engine.chat.completions.create({ messages });
            botMessageDiv.innerText = reply.choices[0].message.content;
        } catch (error) {
            botMessageDiv.innerText = "Üzgünüm, bir hata oluştu: " + error.message;
        }
        chatMessages.scrollTop = chatMessages.scrollHeight;
    };

    function appendMessage(text, className) {
        const chatMessages = document.getElementById('chatMessages');
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${className}`;
        messageDiv.innerText = text;
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    window.handleKeyPress = function(event) {
        if (event.key === 'Enter') {
            window.sendMessage();
        }
    }
</script>

</body>
</html>
