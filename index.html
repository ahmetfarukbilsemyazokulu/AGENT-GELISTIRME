<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Süper Hızlı Yapay Zeka Asistanı</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 650px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; height: 88vh; }
        .chat-header { background: #24292e; color: white; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; }
        .settings-bar { background: #fff3cd; padding: 10px 15px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid #ffeeba; }
        .settings-row { display: flex; gap: 8px; align-items: center; }
        .settings-row input { flex: 1; padding: 8px; border: 1px solid #ced4da; border-radius: 4px; font-size: 13px; }
        .settings-row button { padding: 8px 14px; background: #ffc107; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 85%; line-height: 1.5; font-size: 14px; word-break: break-word; white-space: pre-wrap; }
        .user-message { background: #0366d6; color: white; align-self: flex-end; }
        .bot-message { background: #eaecef; color: #24292e; align-self: flex-start; }
        .chat-input-area { display: flex; border-top: 1px solid #eaecef; padding: 12px; background: #fafbfc; }
        .chat-input-area input { flex: 1; padding: 12px; border: 1px solid #dfe2e5; border-radius: 6px; outline: none; font-size: 14px; }
        .chat-input-area button { background: #2ea44f; color: white; border: none; padding: 12px 22px; margin-left: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .chat-input-area button:hover { background: #2c974b; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">⚡ Gerçek Yapay Zeka Asistanı</div>
    
    <!-- Ayarlar Çubuğu (API Key ve Model Adı) -->
    <div class="settings-bar">
        <div class="settings-row">
            <input type="password" id="apiKeyInput" placeholder="Groq API Key (gsk_...)">
        </div>
        <div class="settings-row">
            <input type="text" id="modelInput" value="llama-3.3-70b-versatile" placeholder="Model Adı (örn: llama3-8b-8192)">
            <button onclick="saveSettings()">Ayarları Kaydet</button>
        </div>
    </div>

    <div class="chat-messages" id="chatMessages">
        <div class="message bot-message">👋 Merhaba! Yukarıdaki alanlara API anahtarınızı girip "Ayarları Kaydet" butonuna basın, hemen sohbet edelim!</div>
    </div>
    
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Önce ayarları kaydedin..." disabled onkeypress="handleKeyPress(event)">
        <button id="sendBtn" disabled onclick="sendMessage()">Gönder</button>
    </div>
</div>

<script>
    let GROQ_API_KEY = localStorage.getItem("groq_key") || "";
    let GROQ_MODEL = localStorage.getItem("groq_model") || "llama-3.3-70b-versatile";
    
    if (GROQ_API_KEY) {
        document.getElementById("apiKeyInput").value = GROQ_API_KEY;
        document.getElementById("modelInput").value = GROQ_MODEL;
        document.getElementById("userInput").disabled = false;
        document.getElementById("sendBtn").disabled = false;
        document.getElementById("userInput").placeholder = "Mesajınızı yazın...";
    }

    function saveSettings() {
        const key = document.getElementById("apiKeyInput").value.trim();
        const model = document.getElementById("modelInput").value.trim();

        if (!key.startsWith("gsk_")) {
            alert("Geçersiz API anahtarı! Groq anahtarları 'gsk_' ile başlar.");
            return;
        }
        if (!model) {
            alert("Lütfen bir model adı girin!");
            return;
        }

        localStorage.setItem("groq_key", key);
        localStorage.setItem("groq_model", model);
        GROQ_API_KEY = key;
        GROQ_MODEL = model;

        document.getElementById("userInput").disabled = false;
        document.getElementById("sendBtn").disabled = false;
        document.getElementById("userInput").placeholder = "Mesajınızı yazın...";
        alert("Ayarlar başarıyla kaydedildi! Şimdi sohbet edebilirsiniz.");
    }

    let chatHistory = [
        { role: "system", content: "Sen yardımcı, akıllı, samimi ve Türkçe konuşan profesyonel bir yapay zeka asistanısın." }
    ];

    async function sendMessage() {
        const inputField = document.getElementById('userInput');
        const messageText = inputField.value.trim();
        if (!messageText || !GROQ_API_KEY) return;

        appendMessage(messageText, 'user-message');
        inputField.value = '';

        chatHistory.push({ role: "user", content: messageText });

        const chatMessages = document.getElementById('chatMessages');
        const botMessageDiv = document.createElement('div');
        botMessageDiv.className = 'message bot-message';
        botMessageDiv.innerText = "Yazıyor...";
        chatMessages.appendChild(botMessageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": "Bearer " + GROQ_API_KEY,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: GROQ_MODEL,
                    messages: chatHistory,
                    temperature: 0.7
                })
            });

            const data = await response.json();

            if (response.ok && data.choices && data.choices[0].message) {
                const reply = data.choices[0].message.content;
                botMessageDiv.innerText = reply;
                chatHistory.push({ role: "assistant", content: reply });
            } else {
                const errorMsg = data.error ? data.error.message : "Bilinmeyen hata";
                botMessageDiv.innerText = "API Hatası: " + errorMsg;
            }
        } catch (error) {
            botMessageDiv.innerText = "Bağlantı hatası: " + error.message;
        }
        
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function appendMessage(text, className) {
        const chatMessages = document.getElementById('chatMessages');
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${className}`;
        messageDiv.innerText = text;
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }
</script>

</body>
</html>
