<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sıfır Maliyetli Tarayıcı Yapay Zekası</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 650px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; height: 88vh; }
        .chat-header { background: #d73a49; color: white; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; }
        .info-bar { background: #e1f5fe; color: #01579b; padding: 10px 15px; font-size: 13px; border-bottom: 1px solid #b3e5fc; text-align: center; font-weight: bold; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 85%; line-height: 1.5; font-size: 14px; word-break: break-word; white-space: pre-wrap; }
        .user-message { background: #0366d6; color: white; align-self: flex-end; }
        .bot-message { background: #eaecef; color: #24292e; align-self: flex-start; }
        .chat-input-area { display: flex; border-top: 1px solid #eaecef; padding: 12px; background: #fafbfc; }
        .chat-input-area input { flex: 1; padding: 12px; border: 1px solid #dfe2e5; border-radius: 6px; outline: none; font-size: 14px; }
        .chat-input-area button { background: #2ea44f; color: white; border: none; padding: 12px 22px; margin-left: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .chat-input-area button:hover { background: #2c974b; }
    </style>
    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
        
        let generator = null;
        
        window.initModel = async function() {
            const statusDiv = document.getElementById("statusText");
            statusDiv.innerText = "Model tarayıcıya indiriliyor, lütfen bekleyin...";
            
            try {
                generator = await pipeline('text2text-generation', 'Xenova/flan-t5-small');
                statusDiv.innerText = "✅ Model hazır! API anahtarı gerekmeden sohbete başlayabilirsiniz.";
                document.getElementById("userInput").disabled = false;
                document.getElementById("sendBtn").disabled = false;
                document.getElementById("userInput").placeholder = "Mesajınızı yazın...";
            } catch (err) {
                statusDiv.innerText = "❌ Model yüklenme hatası: " + err.message;
            }
        };

        window.sendLocalMessage = async function() {
            const inputField = document.getElementById('userInput');
            const text = inputField.value.trim();
            if (!text || !generator) return;

            appendMessage(text, 'user-message');
            inputField.value = '';

            const chatMessages = document.getElementById('chatMessages');
            const botDiv = document.createElement('div');
            botDiv.className = 'message bot-message';
            botDiv.innerText = "Düşünüyor...";
            chatMessages.appendChild(botDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const output = await generator(text, { max_new_tokens: 128 });
                botDiv.innerText = output[0].generated_text;
            } catch (error) {
                botDiv.innerText = "Yanıt üretilirken hata oluştu: " + error.message;
            }
            chatMessages.scrollTop = chatMessages.scrollHeight;
        };

        window.addEventListener('DOMContentLoaded', () => {
            initModel();
        });
    </script>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">🚀 Saf Tarayıcı Yapay Zekası (API Yok)</div>
    <div class="info-bar" id="statusText">Model yükleniyor, lütfen bekleyin...</div>

    <div class="chat-messages" id="chatMessages">
        <div class="message bot-message">👋 Merhaba! Bu sürüm tamamen tarayıcınızda çalışır, asla API anahtarı istemez.</div>
    </div>
    
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Model yükleniyor..." disabled onkeypress="if(event.key==='Enter') sendLocalMessage()">
        <button id="sendBtn" disabled onclick="sendLocalMessage()">Gönder</button>
    </div>
</div>

<script>
    function appendMessage(text, className) {
        const chatMessages = document.getElementById('chatMessages');
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${className}`;
        messageDiv.innerText = text;
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
</script>

</body>
</html>
